  :root{--card:var(--bg-2)}
  html[data-theme="ivory"]{--card:#FFFFFF}
  body{background:var(--bg);color:var(--ink)}
  .d-dash{max-width:1240px;margin:0 auto;padding:22px clamp(14px,2.4vw,32px) 60px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
  .d-col{display:grid;gap:18px;min-width:0}
  .d-col>*{min-width:0}
  .d-card{background:var(--card);border:1px solid var(--ink-12);border-radius:20px;padding:22px}
  .d-mission{display:grid;grid-template-columns:minmax(0,1fr) 38%;gap:22px;align-items:center}
  .d-mission__ic{width:52px;height:52px;border-radius:14px;background:var(--terra);display:grid;place-items:center;margin-bottom:12px}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .d-chip{font:700 11px/1 var(--sans);letter-spacing:.04em;padding:6px 10px;border-radius:99px;text-transform:uppercase}

  .d-mission__img{border-radius:16px;overflow:hidden;aspect-ratio:16/10}

  .btn-go{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:11px 20px;background:var(--terra);color:#fff;text-decoration:none;font:700 14px var(--sans)}

  .d-bar i{display:block;height:100%;background:var(--terra);border-radius:99px}
  .d-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .d-tabs button{border:1.5px solid var(--ink-12);background:var(--card);color:var(--ink);border-radius:14px;padding:14px 12px;cursor:pointer;
    font:800 12.5px/1.2 var(--sans);letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px}
  .d-tabs button.on{border-color:var(--terra);color:var(--terra);box-shadow:0 0 0 3px var(--terra-06)}
  .d-tabs em{font-style:normal;font-size:10.5px;padding:3px 7px;border-radius:99px;background:var(--ink-06);color:var(--ink-70)}
  .d-tilegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .d-tile{display:block;padding:16px;border-radius:14px;border:1px solid var(--ink-12);background:var(--bg);color:var(--ink);text-decoration:none}
  .d-tile b{display:block;font-size:15px}.d-tile span{font-size:13px;color:var(--ink-50)}
  .d-tile:hover{border-color:var(--terra)}

  .d-journey img{width:100%;height:100%;object-fit:cover;display:block}
  .d-pills{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}

  .d-pills button.on{background:var(--terra);color:#fff}

  .lvmap__chip{font:800 12.5px var(--sans);padding:8px 14px;border-radius:99px;background:rgba(229,178,75,.14);color:#E5B24B;white-space:nowrap;text-decoration:none}
  .lvmap__track{position:relative;display:flex;gap:12px;overflow-x:auto;padding:24px 6px 12px;margin-top:4px;scrollbar-width:thin}
  .lvmap__track::before{content:"";position:absolute;left:0;right:0;top:62px;height:3px;background:rgba(255,255,255,.1)}
  .lvmap__lv{flex:0 0 124px;position:relative;display:grid;gap:8px;justify-items:center;text-align:center}
  .lvmap__badge{position:relative;width:68px;height:68px;border-radius:20px;display:grid;place-items:center;background:var(--bg,#555);color:#fff;font-weight:900;font-size:23px;

  .lvmap__card b{font-size:13px;line-height:1.25;min-height:32px;color:#F7EBDD}
  .lvmap__card span{font-size:11.5px;color:rgba(247,235,221,.6)}
  .lvmap__you{position:absolute;top:-2px;left:50%;transform:translate(-50%,-100%);background:#E5B24B;color:#2A1B13;font:900 10.5px var(--sans);border-radius:99px;padding:3px 9px;letter-spacing:.06em}
  .lvmap__f{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);border-radius:16px;padding:12px 14px;margin-top:8px;font-size:14px}
  .lvmap__bar{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:10px}.lvmap__bar i{display:block;height:100%;background:#E5B24B;border-radius:99px}
  .lvmap__go{display:inline-flex;border-radius:12px;background:var(--terra);color:#fff;font:800 12.5px var(--sans);letter-spacing:.05em;text-transform:uppercase;padding:11px 16px;text-decoration:none}

const TIER_COLORS = ['#8A7B6B', '#5E8C61', '#3F7EA6', '#7A5BA8', '#C0792B', '#B8452E'];
function renderLevelMap(nextKey) {
  const el = document.getElementById('lvMap'); if (!el) return;
  const s = S.get(), L = level(s.xp), n = L.n, nxt = L.next, need = nxt ? nxt - s.xp : 0;
  const per = Math.round((nxt ? (s.xp - L.cur) / (nxt - L.cur) : 1) * 100);
  const left = Math.max(1, Math.ceil(need / XP.lesson)), st = (i) => i < n ? 'done' : i === n ? 'here' : 'locked';
  const f = (x) => x.toLocaleString('vi-VN'), check = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  el.innerHTML = `<div class="lvmap__wrap"><button type="button" class="lvmap__nav lvmap__nav--l" id="lvPrev" aria-label="Xem các cấp trước">‹</button>
    <div class="lvmap__track" id="lvTrack" tabindex="0" role="region" aria-label="30 cấp học viên, kéo ngang để xem">${LEVELS.map((name, k) => { const i = k + 1, t = st(i);
      return `<div class="lvmap__lv" data-s="${t}" ${k % 5 === 0 ? `data-tier="Bậc ${k / 5 + 1}"` : ''}>${t === 'here' ? '<span class="lvmap__you">bạn ở đây</span>' : ''}
        <div class="at-medal" aria-hidden="true">${i}${t === 'done' ? `<i>${check}</i>` : ''}</div>
        <div class="lvmap__card"><small>CẤP ${i}</small><b>${escH(name)}</b><span>${f(lvXP(i))} XP</span>
          <span>${t === 'done' ? 'Đã đạt' : t === 'here' ? (nxt ? 'còn ' + f(need) + ' XP' : 'Cấp cao nhất') : 'cần ' + f(lvXP(i) - s.xp) + ' XP'}</span></div></div>`; }).join('')}</div>
    <button type="button" class="lvmap__nav lvmap__nav--r" id="lvNext" aria-label="Xem các cấp sau">›</button></div>
    <div class="lvmap__f"><div style="flex:1;min-width:200px">${nxt ? `Còn <b>${f(need)} XP</b> nữa lên cấp ${n + 1} — khoảng ${left} bài học.` : 'Bạn đang ở cấp cao nhất.'}
      <div class="lvmap__bar"><i style="width:${per}%"></i></div></div>
      <a class="lvmap__go" href="bai.html?id=${encodeURIComponent(nextKey)}">Học bài ngay →</a></div>`;
  const cur = el.querySelector('[data-s="here"]'), tr = document.getElementById('lvTrack');
  if (cur && tr) tr.scrollLeft = Math.max(0, cur.offsetLeft - tr.clientWidth / 2 + cur.clientWidth / 2);
  slider(tr, document.getElementById('lvPrev'), document.getElementById('lvNext'));
}

/* Kéo ngang bằng chuột/ngón tay, nút trước–sau, phím ←/→. Dùng cho dải cấp độ và dải tab. */
function slider(tr, prev, next) {
  if (!tr || tr.dataset.sl) return; tr.dataset.sl = '1';
  const step = () => Math.max(160, tr.clientWidth * .8);
  const sync = () => { if (prev) prev.hidden = tr.scrollLeft < 8; if (next) next.hidden = tr.scrollLeft + tr.clientWidth >= tr.scrollWidth - 8; };
  if (prev) prev.onclick = () => tr.scrollBy({ left: -step(), behavior: 'smooth' });
  if (next) next.onclick = () => tr.scrollBy({ left: step(), behavior: 'smooth' });
  tr.addEventListener('scroll', sync, { passive: true }); window.addEventListener('resize', sync); sync();
  tr.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') { tr.scrollBy({ left: 160, behavior: 'smooth' }); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { tr.scrollBy({ left: -160, behavior: 'smooth' }); e.preventDefault(); } });
  let down = false, x0 = 0, s0 = 0, moved = false;
  tr.addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch') return; down = true; moved = false; x0 = e.clientX; s0 = tr.scrollLeft; });
  window.addEventListener('pointermove', (e) => { if (!down) return; const dx = e.clientX - x0; if (Math.abs(dx) > 4) { moved = true; tr.classList.add('is-drag'); } tr.scrollLeft = s0 - dx; });
  window.addEventListener('pointerup', () => { down = false; tr.classList.remove('is-drag'); });
  tr.addEventListener('click', (e) => { if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; } }, true);
}

function renderDashboard(user) {
  const s = S.get();
  const doneCount = Object.keys(s.done || {}).length;
  const totalLessons = ALL.length;
  const pct = Math.min(100, Math.round((doneCount / Math.max(1, totalLessons)) * 100));
  const nk = nextLesson(s) || ALL[0].key;
  const nm = lessonMeta(nk), w = where(nk);
  const stageN = w ? STAGES.indexOf(w.stage) + 1 : 1, lessonN = w ? w.mod.lessons.indexOf(nk) + 1 : 1;
  const goHref = 'bai.html?id=' + encodeURIComponent(nk);
  const hello = user && user.name ? `Chào ${escH(user.name.split(' ').slice(-1)[0])}, ` : '';

  /* Bố cục tạp chí: hero (nhiệm vụ đang học) → thẻ học viên → hành trình sáu chặng → bộ sưu tập cấp độ → nhiệm vụ | bảng xếp hạng. */
  const PHOTO = ['poster_apple_thinker.jpg', 'studio_workspace.jpg', 'cafe_community.jpg', 'coffee_lifestyle.jpg', 'poster_nike_athlete.jpg', 'hero_editorial_face.jpg'];
  const title = nm ? nm.t : 'Bắt đầu bài đầu tiên';
  const heroPhoto = 'assets/img/' + PHOTO[Math.max(0, stageN - 1) % PHOTO.length];
  const words = title.split(/\s+/), cut = words.length > 3 ? Math.ceil(words.length * 0.6) : words.length;
  const titleHtml = words.length > 3 ? escH(words.slice(0, cut).join(' ')) + ' <em>' + escH(words.slice(cut).join(' ')) + '</em>' : '<em>' + escH(title) + '</em>';
  const stageInfo = STAGES.map((st, si) => {
    const ks = st.mods.flatMap((m) => m.lessons), d = ks.filter((k) => s.done[k]).length;
    return { st, si, n: ks.length, d, first: ks.find((k) => !s.done[k]) || ks[0] };
  });
  const hereIdx = Math.max(0, stageN - 1), L0 = level(s.xp);
  const left0 = L0.next ? Math.max(1, Math.ceil((L0.next - s.xp) / XP.lesson)) : 0;
  const story = doneCount === 0
    ? `Bạn chưa đi bước nào — chặng đầu tiên là <b>${escH(STAGES[0].t)}</b>. Mỗi bài chỉ mất vài phút.`
    : `Bạn đã đi <b>${doneCount}</b> trên ${totalLessons} bài, hiện ở chặng ${stageN}: <b>${escH(STAGES[hereIdx].t)}</b>.${left0 ? ' Khoảng ' + left0 + ' bài nữa là lên cấp ' + (L0.n + 1) + '.' : ''}`;

  app.innerHTML = `
  <div class="at-dash">
    <header class="at-hero">
      <div class="at-hero__txt">
        <p class="at-kick">Chặng ${stageN} · Bài ${lessonN} <span>Nhiệm vụ đang học</span></p>
        ${hello ? `<p class="at-hello">${hello}tiếp tục nhé.</p>` : '<p class="at-hello">Hôm nay, ta bắt đầu từ đây.</p>'}
        <h1 class="at-display">${titleHtml}</h1>
        <div class="at-hero__cta">
          <a class="at-btn" href="${goHref}">Học tiếp <span aria-hidden="true">→</span></a>
          <a class="at-link" href="hoc-bai.html">Xem toàn bộ bài học</a>
        </div>
        <div class="at-trail">
          <p><b>${doneCount}</b> / ${totalLessons} bài · ${pct}% hành trình</p>
          <div class="at-trail__line" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${Math.max(1, pct)}%"></i></div>
        </div>
      </div>
      <figure class="at-hero__ph" aria-hidden="true">
        <div class="ph"><img src="${heroPhoto}" alt="" loading="eager"></div>
        <span class="at-scrap">+10 XP<br>khi hoàn thành</span>
        <figcaption><b>Tư.${String(lessonN).padStart(2, '0')}</b> ${escH(STAGES[hereIdx].t)}</figcaption>
      </figure>
    </header>
    <div class="at-pass-slot"><div id="sbProfile"></div></div>

    <div class="at-body">
      <section class="at-sec" aria-labelledby="atL" data-at>
        <div class="at-sec__head">
          <div><p class="at-kick">Cấp độ &amp; XP</p><h2 class="at-sec__title" id="atL">Bộ sưu tập <em>con dấu</em></h2></div>
          <a class="at-link" href="cap-do.html" title="Xem chi tiết 30 cấp và cách kiếm XP">Cấp ${level(s.xp).n}/30 · xem chi tiết</a>
        </div>
        <div class="lvmap" id="lvMap" aria-label="Bản đồ cấp độ"></div>
      </section>

      <section class="at-sec" aria-labelledby="atJ" data-at>
        <div class="at-sec__head">
          <div><p class="at-kick">Hành trình</p><h2 class="at-sec__title" id="atJ">Sáu chặng, <em>một con đường</em></h2></div>
          <p class="at-sec__aside">${story}</p>
        </div>
        <ol class="at-path">${stageInfo.map((x) => {
          const st = x.si < hereIdx ? (x.d >= x.n ? 'done' : 'done') : x.si === hereIdx ? 'here' : 'later';
          return `<li class="at-stop" data-s="${st}" style="--i:${x.si}"><a href="bai.html?id=${encodeURIComponent(x.first)}">
            <span class="at-stop__no">${String(x.si + 1).padStart(2, '0')}</span><span class="at-stop__dot"></span>
            <span><h3>${escH(x.st.t)}</h3><p>${escH(x.st.q || '')}</p><small>${x.d}/${x.n} bài</small></span></a></li>`;
        }).join('')}</ol>
      </section>

      <div class="at-cols" data-at>
        <section aria-label="Nhiệm vụ và lối vào">
          <p class="at-kick">Hôm nay</p>
          <div class="d-tabs" role="tablist">
            <button class="on" data-tab="q" role="tab">Thưởng &amp; nhiệm vụ</button>
            <button data-tab="m" role="tab">Mục tiêu nghề &amp; kỹ năng</button>
            <button data-tab="a" role="tab">Đấu trường &amp; luyện tập</button>
            <button data-tab="l" role="tab">Cấp độ &amp; XP</button>
          </div>
          <div id="tabBody"></div>
        </section>
        <aside aria-label="Cộng đồng">
          <section class="at-blk">
            <div class="at-blk__h"><h3 class="at-blk__t">Bảng <em>xếp hạng</em></h3><a class="at-link" href="bang-xep-hang.html">Tất cả</a></div>
            <div class="d-pills" id="boardPills"><button class="on" data-by="xp">Điểm tuần</button><button data-by="streak">Chuỗi ngày</button><button data-by="cases">Case</button></div>
            <div id="sbBoard"></div>
          </section>
          <section class="at-blk">
            <div class="at-blk__h"><h3 class="at-blk__t">Hành trình <em>của bạn</em></h3></div>
            <p>Mỗi chặng bạn đi qua được vẽ thêm vào bản đồ nghề nghiệp.</p>
            <a href="ban-do.html" class="at-btn at-btn--ink">Xem bản đồ hành trình <span aria-hidden="true">→</span></a>
          </section>
          <div id="sbInvite"></div>
        </aside>
      </div>
    </div>
  </div>`;

  renderLevelMap(nk);
  slider(document.querySelector('.d-tabs'));
  const body = document.getElementById('tabBody');
  const tiles = (arr) => `<div class="d-tilegrid">${arr.map(([t, d, h]) => `<a class="d-tile" href="${h}"><b>${t}</b><span>${d}</span></a>`).join('')}</div>`;
  const TAB = {
    q: () => { body.innerHTML = '<div id="qList"></div>'; SocialUI.questsPanel(document.getElementById('qList'), goHref, () => SocialUI.profileCard(document.getElementById('sbProfile'), user)); },
    m: () => { body.innerHTML = tiles([['Học theo nghề', 'Chọn mục tiêu nghề nghiệp', 'ban-do.html'], ['Kỹ năng & triện', 'Mức thành thạo từng kỹ năng', 'nang-luc.html'], ['Rương thưởng', 'Mở rương và xem phần thưởng', 'ruong.html']]); },
    a: () => { body.innerHTML = tiles([['Quiz', 'Làm nhanh, nhận XP', 'quiz.html'], ['Thi vượt chặng', 'Chứng minh bạn đã nắm chặng', 'thi.html'], ['Game Kingdom', 'Đấu trường và boss', 'kingdom.html'], ['Luyện phỏng vấn', 'Tập trả lời như thật', 'phong-van.html']]); },
  };
  TAB.l = () => {
    const L = level(s.xp), n = L.n, nxt = L.next, f = (x) => x.toLocaleString('vi-VN');
    const WAYS = [['lesson', 'Hoàn thành một bài học'], ['drill', 'Bài tính số đúng'], ['case', 'Hoàn thành một case'], ['exam', 'Qua đề thi vượt chặng'], ['talk', 'Nói 60 giây / thực hành'], ['daily', 'Thử thách hằng ngày']];
    body.innerHTML = `<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">
        <div><b style="font-size:1.1rem">Cấp ${n} · ${escH(L.name)}</b><div class="small muted">${f(s.xp)} XP${nxt ? ' · còn ' + f(nxt - s.xp) + ' XP lên cấp ' + (n + 1) : ' · cấp cao nhất'}</div></div>
        <a class="btn-go" href="cap-do.html">Xem 30 cấp độ →</a></div>
      <div class="d-bar" style="margin:14px 0"><i style="width:${nxt ? Math.max(2, Math.round((s.xp - L.cur) / (nxt - L.cur) * 100)) : 100}%"></i></div>
      <div class="small muted" style="margin-bottom:8px">Cách kiếm XP nhanh nhất</div>
      <div class="d-tilegrid">${WAYS.map(([k, t]) => `<div class="d-tile"><b>+${XP[k]} XP</b><span>${t}</span></div>`).join('')}</div>`;
  };
  document.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => {
    document.querySelectorAll('[data-tab]').forEach((x) => x.classList.toggle('on', x === b)); TAB[b.dataset.tab]();
  });
  TAB.q();

  SocialUI.profileCard(document.getElementById('sbProfile'), user);
  const board = (by) => SocialUI.boardCard(document.getElementById('sbBoard'), by);
  board('xp');
  document.querySelectorAll('#boardPills [data-by]').forEach((b) => b.onclick = () => {
    document.querySelectorAll('#boardPills [data-by]').forEach((x) => x.classList.toggle('on', x === b)); board(b.dataset.by);
  });
  SocialUI.inviteCard(document.getElementById('sbInvite'));
}

account().then((u) => renderDashboard(u || {})).catch(() => renderDashboard({}));
</script>
<script src="assets/js/paper.js?v=7"></script>
</body>
