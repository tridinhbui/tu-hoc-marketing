<style>

  /* Top Universe Nav */
  .dash-nav{

  /* Case Universe Section */

  .universe-header{

    margin-bottom:24px;

<script>
const app = document.getElementById('app');

function renderDashboard() {
  const s = S.get();
  const xpChip = document.getElementById('userXpChip');
  if (xpChip) xpChip.textContent = `${fmt(s.xp)} XP`;

  const doneCount = Object.keys(s.done || {}).length;
  const totalLessons = ALL.length;
  const pct = Math.min(100, Math.round((doneCount / Math.max(1, totalLessons)) * 100));
  const rk = typeof rank === 'function' ? rank(s) : { t: 'Strategist' };
  const nk = nextLesson(s) || ALL[0].key;
  const nm = lessonMeta(nk);

  /* Case Universe items (Curated from real campaigns matching Screen 2) */
  const universeCases = [
    {
      id: 'case-apple-1984',
      badge: 'CHIẾN LƯỢC THƯƠNG HIỆU',
      title: 'Lần tái định vị đỉnh cao của Apple',
      category: 'chien-luoc',
      img: 'assets/img/hero_model.jpg',
      href: 'case/apple-1984.html'
    },
    {
      id: 'case-nike-dream-crazy',
      badge: 'TĂNG TRƯỞNG',
      title: 'Cách Nike biến một insight thành phong trào toàn cầu',
      category: 'tang-truong',
      img: 'assets/img/billboard_city.jpg',
      href: 'case/nike-dream-crazy.html'
    },
    {
      id: 'case-highlands-third-place',
      badge: 'SẢN PHẨM',
      title: 'Chiến lược premium hoá của Highlands Coffee',
      category: 'san-pham',
      img: 'assets/img/coffee_aesthetic.jpg',
      href: 'case/highlands-third-place.html'
    },
    {
      id: 'case-dove-real-beauty',
      badge: 'SÁNG TẠO',
      title: 'Bài học từ chiến dịch "Real Beauty" của Dove',
      category: 'sang-tao',
      img: 'assets/img/model_thinking.jpg',
      href: 'case/dove-real-beauty.html'
    },
    {
      id: 'case-baemin-vietnam',
      badge: 'THƯƠNG HIỆU VIỆT',
      title: 'Cách Baemin chiếm trọn trái tim người trẻ thành thị',
      category: 'viet-nam',
      img: 'assets/og/case-baemin-vietnam.png',
      href: 'case/baemin-vietnam.html'
    },
    {
      id: 'case-bitis-hunter',
      badge: 'THƯƠNG HIỆU VIỆT',
      title: 'Biti\'s Hunter: Đi để trở về & Sự hồi sinh di sản',
      category: 'viet-nam',
      img: 'assets/og/case-bitis-hunter.png',
      href: 'case/bitis-hunter.html'
    }
  ];

  app.innerHTML = `
    <!-- 1. HERO WORKSPACE & PROGRESS -->
    <section class="dash-hero">
      <div class="dash-hero-grid">
        <!-- Left: Greetings & Floating Progress -->
        <div>
          <span class="dash-eyebrow">CHÀO BẠN TRỞ LẠI,</span>
          <h1 class="dash-title">
            Hành trình hôm nay:<br>
            <em>Tiếp tục phá vỡ những lối mòn</em>
          </h1>

          <!-- Floating Progress Card -->
          <div class="progress-card-floating">
            <div class="row between">
              <span class="lbl" style="color:var(--ink-dark-70)">LỘ TRÌNH CỦA BẠN</span>
              <span class="gold" style="font-size:13px;font-weight:700">${pct}% HOÀN THÀNH</span>
            </div>
            <div>
              <b style="font-family:var(--serif);font-size:1.35rem;display:block;margin-bottom:4px">
                ${escH(rk ? rk.t : 'Management Trainee')}
              </b>
              <span class="small muted" style="color:var(--ink-dark-50)">
                Đã giải quyết ${doneCount}/${totalLessons} case thực tế
              </span>
            </div>
            <div class="progress-bar-wrap">
              <div class="progress-bar-fill" style="width:${Math.max(8, pct)}%"></div>
            </div>
            <a class="btn btn--primary" href="bai.html?id=${encodeURIComponent(nk)}" style="align-self:flex-start;border-radius:99px;padding:10px 22px;margin-top:4px">
              Tiếp tục học →
            </a>
          </div>
        </div>

        <!-- Right: Studio Workspace Frame -->
        <div class="workspace-frame">
          <img src="assets/img/studio_workspace.jpg" alt="Creative Studio Workspace">
          <div class="workspace-note">
            Ideas. People.<br>Culture. Business.<br>A better world.
          </div>
        </div>
      </div>
    </section>

    <!-- 2. CASE UNIVERSE SECTION (Screen 2 Parity) -->
    <section class="universe-section">
      <div class="universe-header">
        <div>
          <span class="studio-badge studio-badge--terra">CASE UNIVERSE</span>
          <h2 class="universe-title">Khám phá các thế giới marketing</h2>
        </div>

        <!-- Filter Pills -->
        <div class="filter-pills" id="universeFilters">
          <button class="filter-pill active" onclick="filterUniverse('all')">Tất cả</button>
          <button class="filter-pill" onclick="filterUniverse('viet-nam')">Thương hiệu Việt</button>
          <button class="filter-pill" onclick="filterUniverse('quoc-te')">Quốc tế</button>
          <button class="filter-pill" onclick="filterUniverse('chien-luoc')">Chiến lược</button>
          <button class="filter-pill" onclick="filterUniverse('sang-tao')">Sáng tạo</button>
          <button class="filter-pill" onclick="filterUniverse('tang-truong')">Tăng trưởng</button>
          <button class="filter-pill" onclick="filterUniverse('san-pham')">Sản phẩm</button>
        </div>
      </div>

      <!-- Universe Cards Grid -->
      <div class="universe-grid" id="universeGrid">
        ${universeCases.map(c => `
          <a class="universe-card" href="${c.href}" data-cat="${c.category}">
            <img class="universe-card__img" src="${c.img}" alt="${escH(c.title)}" loading="lazy">
            <div class="universe-card__overlay">
              <span class="universe-card__tag">${escH(c.badge)}</span>
              <h3 class="universe-card__title">${escH(c.title)}</h3>
            </div>
          </a>
        `).join('')}
      </div>
    </section>

    <!-- 3. DAILY MISSION / BRIEF BANNER (Screen 2 Bottom Parity) -->
    <section class="mission-bottom-banner">
      <img class="mission-bottom-img" src="assets/img/hero_model.jpg" alt="Strategist Brief">
      <div class="mission-bottom-content">
        <div class="row between">
          <span class="studio-badge studio-badge--terra">THỬ THÁCH HÔM NAY</span>
          <span class="gold">+20 XP</span>
        </div>
        <h2 style="font-family:var(--serif);font-size:clamp(1.6rem,3vw,2.4rem);margin:0;line-height:1.2">
          Một brief mới đang chờ bạn.
        </h2>
        <p style="font-size:14.5px;color:rgba(249,244,235,.75);line-height:1.6;margin:0">
          Áp dụng những gì đã học để giải quyết một bài toán marketing thực tế: 
          Định vị lại sản phẩm cà phê cao cấp khi thị trường tràn ngập đối thủ giảm giá.
        </p>
        <div class="row" style="margin-top:10px">
          <a class="btn btn--primary" href="quiz.html" style="border-radius:99px;padding:12px 28px">
            Xác nhận lựa chọn →
          </a>
          <span class="hand" style="font-size:22px;color:#E5B4A8;margin-left:10px">
            Good Strategy Brings Good Change.
          </span>
        </div>
      </div>
    </section>
  `;
}

window.filterUniverse = function(cat) {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(420, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
  } catch(e) {}

  const pills = document.querySelectorAll('.filter-pill');
  pills.forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');

  const cards = document.querySelectorAll('.universe-card');
  cards.forEach(c => {
    if (cat === 'all' || c.dataset.cat === cat || (cat === 'quoc-te' && c.dataset.cat !== 'viet-nam')) {
      c.style.display = 'flex';
      c.style.animation = 'stamp-slam .25s ease-out';
    } else {
      c.style.display = 'none';
    }
  });
};

function initUniverseTilt() {
  const cards = document.querySelectorAll('.universe-card, .progress-card-floating');
  cards.forEach(card => {
    card.addEventListener('mousemove', e => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;
      const rotateX = (-y / (rect.height / 2)) * 6;
      const rotateY = (x / (rect.width / 2)) * 6;
      card.style.transform = `perspective(900px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-4px)`;
    });
    card.addEventListener('mouseleave', () => {
      card.style.transform = '';
    });
  });
}

renderDashboard();
setTimeout(initUniverseTilt, 150);
</script>
