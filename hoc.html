<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23C4552D%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27Georgia,serif%27 font-size=%2720%27 text-anchor=%27middle%27 fill=%27%23FAF3E7%27%3EM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/case.css?v=4">
<title>Hôm nay — Tự Học Marketing Case</title>
<meta name="description" content="Bạn đang ở bước nào của hành trình, hôm nay làm ba việc gì, yếu ở đâu và sắp mở khoá gì.">
</head>
<body>
<noscript><div class="nojs"><h1 class="h2">Trang này cần JavaScript</h1><p>Bài học và tiến độ được dựng ngay trong trình duyệt của bạn.</p></div></noscript>
<main class="wrap" id="app"></main>
<script src="assets/js/data/lessons.js?v=7"></script>
<script src="assets/js/data/principles.js?v=7"></script>
<script src="assets/js/data/curriculum.js?v=4"></script>
<script src="assets/js/data/bai-index.js?v=8"></script>
<script src="assets/js/data/drills.js?v=2"></script>
<script src="assets/js/data/cases.js?v=2"></script>
<script src="assets/js/data/rewards.js?v=1"></script>
<script src="assets/js/data/exam-items.js?v=7"></script>
<script src="assets/js/data/exams.js?v=8"></script>
<script src="assets/js/app.js?v=16"></script>
<script src="assets/js/exam.js?v=8"></script>
<script>
appShell('hoc.html');
const app=document.getElementById('app');

/* người dùng cũ đã chọn nhóm: đổi sang mục tiêu nghề tương ứng, không hỏi lại */
(()=>{ const s=S.get(); if(s.goal||!s.persona) return;
  const g={student:'exec',mt:'mt',comp:'mt',worker:'owner'}[s.persona]||'exec'; S.set({goal:g,startLv:0}); })();

/* ================= ONBOARDING =================
   Không mở ra danh sách bài. Hỏi hai câu, rồi giao nhiệm vụ đầu tiên. */
const ob={step:1,goal:null,lv:null};
function onboarding(){
  if(ob.step===1){
    app.innerHTML=`<section class="ob">
      <span class="eyebrow">Bước 1 / 2</span>
      <h1 class="display">Bạn muốn giỏi marketing <em>để làm gì?</em></h1>
      <p class="lede">Chọn đích đến gần nhất. App dựng lộ trình, điểm bắt đầu và nhiệm vụ đầu tiên theo lựa chọn này — đổi lúc nào cũng được.</p>
      <div class="picks">${GOALS.map(g=>`<button class="pick" data-goal="${g.id}"><b>${g.t}</b><span>${g.d}</span></button>`).join('')}</div>
    </section>`;
  } else if(ob.step===2){
    const g=GOALS.find(x=>x.id===ob.goal);
    app.innerHTML=`<section class="ob">
      <span class="eyebrow">Bước 2 / 2 · ${escH(g.t)}</span>
      <h1 class="display">Bạn đang <em>ở mức nào?</em></h1>
      <p class="lede">Trả lời thật. Người đã đi làm sẽ được thử đề vượt chặng để khỏi học lại phần đã biết.</p>
      <div class="picks picks--4">${START_LEVELS.map(l=>`<button class="pick" data-lv="${l.id}"><b>${l.t}</b><span>${l.d}</span></button>`).join('')}</div>
      <button class="btn btn--quiet" data-back style="margin-top:22px">← Chọn lại mục tiêu</button>
    </section>`;
  } else {
    const g=GOALS.find(x=>x.id===ob.goal), p=PATHS.find(x=>x.id===g.path), lv=START_LEVELS[ob.lv];
    const first=p.lessons?p.lessons.find(k=>!lessonState(k))||p.lessons[0]:(ALL.map(x=>x.key).find(k=>lessonOpen(k))||nextLesson());   // bài thuộc lộ trình luôn mở, đầu tiên theo thứ tự hành trình
    const fm=lessonMeta(first), fw=where(first);
    const gaps=SKILLS.map(sk=>({...sk,need:g.need[sk.id]})).sort((a,b)=>b.need-a.need).slice(0,3);
    const skip=ob.lv>=2;
    app.innerHTML=`<section class="ob ob--done">
      <span class="eyebrow eyebrow--gold">Đã sẵn sàng</span>
      <h1 class="display">Nhiệm vụ đầu tiên của bạn <em>đã sẵn sàng.</em></h1>
      <div class="brief">
        <div class="brief__row"><span>Mục tiêu</span><b>${escH(g.t)}</b></div>
        <div class="brief__row"><span>Lộ trình đề xuất</span><b>${escH(p.t)} · ${(p.lessons||ALL).length} bài</b></div>
        <div class="brief__row"><span>Điểm bắt đầu</span><b>${skip?(API.login?'Làm bài xếp lớp — app đặt bạn vào đúng bước, bỏ qua phần đã biết':'Thử đề vượt chặng 01 — qua là bỏ được phần nền tảng'):'Bước 1 · Quan sát'} <small>(${escH(lv.t)})</small></b></div>
        <div class="brief__row"><span>Kỹ năng cần xây nhiều nhất</span><b>${gaps.map(x=>`${escH(x.t)} <small>cần ${x.need}%</small>`).join(' · ')}</b></div>
      </div>
      <div class="mission">
        <span class="eyebrow">Nhiệm vụ 01 · ${fw?escH(JOURNEY.find(j=>j.mods.includes(fw.mod.id)).t):''}</span>
        <h2 class="h2">${escH(fm.t)}</h2>
        <p class="small muted">${escH(fm.read)} đọc · một tình huống thật, một quyết định, một quiz ngắn · <span class="gold">+${XP.lesson} XP</span></p>
        <div class="row" style="margin-top:16px">
          <a class="btn btn--primary btn--lg" href="bai.html?id=${encodeURIComponent(first)}" data-finish>Bắt đầu nhiệm vụ →</a>
          ${skip?(API.login?`<a class="btn btn--ghost" href="xep-lop.html" data-finish>Làm bài xếp lớp</a>`:`<a class="btn btn--ghost" href="thi.html?stage=s1" data-finish>Thử đề vượt chặng 01</a>`):''}
        </div>
      </div>
    </section>`;
  }
}
app.addEventListener('click',e=>{
  const g=e.target.closest('[data-goal]'), l=e.target.closest('[data-lv]');
  if(g){ ob.goal=g.dataset.goal; ob.step=2; onboarding(); scrollTo(0,0); }
  else if(l){ ob.lv=+l.dataset.lv; ob.step=3; onboarding(); scrollTo(0,0); }
  else if(e.target.closest('[data-back]')){ ob.step=1; onboarding(); }
  else if(e.target.closest('[data-finish]')){ const gg=GOALS.find(x=>x.id===ob.goal);
    S.set({goal:gg.id,startLv:ob.lv,path:gg.path}); }
});

/* ================= TÍN HIỆU HÔM NAY =================
   Một câu tình huống mỗi ngày, lấy từ ngân hàng đề của các chặng đã mở. Cùng ngày thì cùng câu. */
function signalItem(s){
  const pool=EXAM_ITEMS.filter(it=>it.type!=='calc'&&it.options&&stageOpen(it.stage,s));
  if(!pool.length) return null;
  const t=today(); let h=0; for(const c of t) h=(h*31+c.charCodeAt(0))>>>0;
  const saved=(s.daily||{})[t]; return saved&&EXAM_ITEMS.find(x=>x.id===saved.id) || pool[h%pool.length];
}
function signalHTML(s){
  const it=signalItem(s); if(!it) return '';
  const res=(s.daily||{})[today()], sk=skillOfLesson(it.source||(it.teaches||[])[0]);
  return `<section class="signal" id="signal">
    <div class="signal__head"><span class="eyebrow eyebrow--light">Tín hiệu thị trường · ${new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'numeric'})}</span>
      <span class="small">1–3 phút · <span class="gold">+${XP.daily} XP</span> · giữ chuỗi ngày</span></div>
    <p class="signal__stem">${it.stem}</p>
    <div class="signal__opts">${it.options.map(o=>{
      const why=(res&&res.why)||{}, st=res?(o.k===res.answer?'right':o.k===res.given?'wrong':''):'';
      return `<button class="opt" data-sig="${o.k}" ${res?'disabled':''} ${st?`data-r="${st}"`:''}>${escH(o.t)}${res&&why[o.k]?`<small>${escH(why[o.k])}</small>`:''}</button>`}).join('')}</div>
    ${res?`<div class="signal__after">
      <span class="${res.ok?'ok':'bad'}">${res.ok?'Đúng — đọc được tín hiệu.':'Chưa đúng — câu này đã vào hàng ôn.'}</span>
      ${sk?`<span class="skillup">${escH(sk.t)}${res.ok?' ↑':' · cần luyện'}</span>`:''}
      ${(res.why||{})[res.answer]?`<div class="stickynote"><span class="eyebrow">Thẻ insight</span>${escH(res.why[res.answer])}</div>`:''}
      <a class="btn btn--ghost" href="${res.ok?'quiz.html':'on-loi.html'}">${res.ok?'Luyện tiếp 5 câu →':'Luyện lại chỗ sai →'}</a></div>`:''}
  </section>`;
}
async function answerSignal(k){
  const s=S.get(), it=signalItem(s);
  document.querySelectorAll('[data-sig]').forEach(b=>b.disabled=true);
  let g; try{ g=await gradeAsync(it,k,'practice'); }
  catch(e){ document.querySelectorAll('[data-sig]').forEach(b=>b.disabled=false); toast(GRADE_OFFLINE); return; }
  const ok=g.ok;
  /* lưu đáp án + lời giải server trả về để lần mở sau vẫn hiện, không cần tải lại đáp án */
  S.set({daily:{...(s.daily||{}),[today()]:{id:it.id,given:k,ok,answer:g.answer,why:g.why}}});
  if(!ok) (it.teaches||[]).slice(0,1).forEach(pid=>logError(conceptCode(pid),it.source||pid));
  award('daily',today());
  render(); document.getElementById('signal').scrollIntoView({block:'start'});
}

/* ================= COMMAND CENTER ================= */
function render(){
  const s=S.get();
  if(!s.goal){ onboarding(); return; }
  const g=goalOf(s), path=PATHS.find(p=>p.id===(s.path||g.path))||PATHS[0];
  const js=journeyState(s), ni=js.findIndex(j=>j.st==='now'), now=js[ni]||js[js.length-1];
  const tasks=todayTasks(s), firstOpen=tasks.find(t=>!t.done);
  const rk=rank(s), gaps=skillGaps(s), weak=gaps[0];
  const nk=nextLesson(s), learning=nk&&skillOfLesson(nk);
  const lp=learning&&skillPct(learning,s);
  const nxt=js[ni+1];
  let unlock=null;
  if(nxt){
    if(nxt.st==='lock'){ const i=STAGES.findIndex(x=>x.id===nxt.stage.id), pv=STAGES[i-1];
      unlock={t:nxt.t,how:`Qua đề vượt chặng ${pv.n} để mở`,href:`thi.html?stage=${pv.id}`,cta:'Xem đề chặng'}; }
    else unlock={t:nxt.t,how:`Còn ${now.total-now.have} bài ở bước ${now.t}`,href:nk?'bai.html?id='+encodeURIComponent(nk):'hoc-bai.html',cta:'Học tiếp'};
  }
  const wk=weekly(S.get());
  const pl=path.lessons||ALL.map(x=>x.key), plDone=pl.filter(k=>s.done[k]).length;
  const rw={learn:`+${XP.lesson} XP`,drill:`đến +${XP_CAP.review} XP`,signal:`+${XP.daily} XP`};

  const started=s.xp>0||s.streak>0||Object.keys(s.done||{}).length>0;
  const startKeys=(path.start||pl.slice(0,7)).slice(0,7);
  const startHTML=`<section class="first7"><h2 class="h2">7 bài đầu của bạn</h2>
    <ol class="first7__l">${startKeys.map((k,i)=>{ const m=lessonMeta(k), st=lessonState(k,s);
      return `<li data-st="${st?'done':'todo'}"><a href="bai.html?id=${encodeURIComponent(k)}"><span class="first7__n">${st?'✓':i+1}</span>
        <span class="first7__t">${escH(m?m.t:k)}</span><span class="first7__m">${escH(m?m.read:'')}</span></a></li>`; }).join('')}</ol></section>`;
  app.innerHTML=`
  <section class="cc">
    <div class="cc__main">
      <span class="eyebrow">Hành trình · ${escH(g.t)}${path.t.toLowerCase()!==g.t.toLowerCase()?' · lộ trình '+escH(path.t):''}</span>
      <h1 class="display">Bước ${ni+1}/9 · <em>${escH(now.t)}</em></h1>
      <p class="lede">${escH(now.stage?now.stage.q:'')}</p>
      <div class="row" style="margin-top:22px">
        <a class="btn btn--primary btn--lg" href="${firstOpen?firstOpen.href:'case-thu-vien.html'}">${firstOpen?'Tiếp tục hành trình →':'Hôm nay xong rồi — làm thêm một case →'}</a>
        <span class="small muted">${started?(firstOpen?`Tiếp theo: ${escH(firstOpen.t)}`:'Ba việc hôm nay đã xong.'):'Khoảng 6 phút cho bài đầu.'}</span>
      </div>
      ${started?`<p class="small" style="margin-top:14px"><span class="xpchip">${fmt(s.xp)} XP</span> · chuỗi ${s.streak} ngày · ${escH(rk.t)}</p>`:''}
    </div>
  </section>

  ${started?'':startHTML}
  ${journeyHTML(s)}

  ${!started?'':`<section class="today">
    <div class="today__head"><h2 class="h2">Hôm nay, <em>ba việc.</em></h2>
      <span class="small muted">Không hơn. Xong cả ba là giữ chuỗi và có đủ lượt luyện cho ngày.</span></div>
    <ol class="tasks">${tasks.map(t=>`<li data-st="${t.done?'done':t===firstOpen?'now':'todo'}">
      <a href="${t.href}"><span class="tasks__n">${t.done?'✓':t.n}</span>
        <span class="tasks__body"><b>${escH(t.t)}</b><span>${escH(t.d)}</span></span>
        <span class="tasks__xp">${t.done?'Xong':rw[t.k]}</span></a></li>`).join('')}</ol>
  </section>`}

  ${!started?'':`<section class="split">
    <div class="skillfocus">
      <span class="eyebrow">${learning?'Kỹ năng đang học':'Kỹ năng'}</span>
      ${learning?`<div class="bigpct"><b>${lp}%</b><span>${escH(learning.t)}</span></div>
        <div class="bar"><i style="width:${lp}%"></i>${g.need[learning.id]?`<em style="left:${g.need[learning.id]}%" title="Mức cần cho ${escH(g.t)}"></em>`:''}</div>
        <span class="small muted">Vạch vàng là mức một ${escH(g.t)} thường cần: ${g.need[learning.id]}%.</span>`:''}
      ${weak&&weak.gap?`<p class="gapnote">Khoảng cách lớn nhất: <b>${escH(weak.t)}</b> — ${weak.pct}% / cần ${weak.need}%.
        <a href="nang-luc.html#${weak.id}">Xem cách bù →</a></p>`:''}
    </div>
    ${unlock?`<div class="unlock">
      <span class="eyebrow eyebrow--gold">Mở khoá tiếp theo</span>
      <b class="unlock__t">${escH(unlock.t)}</b>
      <span class="small">${escH(unlock.how)}</span>
      <a class="btn btn--ghost" href="${unlock.href}">${unlock.cta} →</a>
    </div>`:''}
  </section>`}

  ${started?signalHTML(s):''}

  ${!started?'':`<section class="week">
    <span class="eyebrow">Tuần này</span>
    <div class="week__nums">
      <div><b>${wk.lessons}</b><span>bài học</span></div>
      <div><b>${wk.cases}</b><span>case</span></div>
      <div><b>${wk.reps}</b><span>lượt luyện</span></div>
      <div><b>${plDone}/${pl.length}</b><span>bài của lộ trình</span></div>
    </div>
    ${wk.moves.length?`<p class="small">${wk.moves.slice(0,3).map(m=>`${escH(m.t)} <b>${m.from} → ${m.to}%</b>`).join(' · ')}</p>`:''}
    ${wk.focus?`<p class="week__focus">Trọng tâm tuần tới: <b>${escH(wk.focus.t)}</b> <a href="nang-luc.html#${wk.focus.id}">Lên kế hoạch →</a></p>`:''}
  </section>`}

  <nav class="also" aria-label="Công cụ khác">
    <a href="on-loi.html">Ôn lỗi${dueErrors(s).length?` · <b>${dueErrors(s).length}</b> đến hạn`:''}</a>
    <a href="ruong.html">Rương thưởng</a>
    <a href="tro-choi.html">Trò chơi điều hành 8 quý</a>
    <a href="ban-do.html">Bản đồ chặng</a>
    <button type="button" id="reGoal">Đổi mục tiêu</button>
  </nav>`;

  document.getElementById('reGoal').onclick=()=>{ S.set({goal:null}); ob.step=1; render(); scrollTo(0,0); };
  app.querySelectorAll('[data-sig]').forEach(b=>b.onclick=()=>answerSignal(b.dataset.sig));
  if(location.hash==='#signal') document.getElementById('signal')?.scrollIntoView();
}
canLogin().then(render, render);
</script>
</body>
</html>
