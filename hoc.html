<body>
<noscript><div class="nojs"><h1 class="h2">Trang này cần JavaScript</h1><p>Bài học và tiến độ được dựng ngay trong trình duyệt của bạn.</p></div></noscript>

<script>
appShell('hoc.html');
const app=document.getElementById('app');

/* người dùng cũ đã chọn nhóm: đổi sang mục tiêu nghề tương ứng, không hỏi lại */
(()=>{ const s=S.get(); if(s.goal||!s.persona) return;
  const g={student:'exec',mt:'mt',comp:'mt',worker:'owner'}[s.persona]||'exec'; S.set({goal:g,startLv:0}); })();

/* ================= ONBOARDING =================
   Không mở ra danh sách bài. Hỏi hai câu, rồi giao nhiệm vụ đầu tiên. */
const ob={step:1,goal:null,lv:null};
function onboarding(){
  if(ob.step===1){
    app.innerHTML=`<section class="ob">
      <span class="eyebrow">Bước 1 / 2</span>
      <h1 class="display">Bạn muốn giỏi marketing <em>để làm gì?</em></h1>
      <p class="lede">Chọn đích đến gần nhất. App dựng lộ trình, điểm bắt đầu và nhiệm vụ đầu tiên theo lựa chọn này — đổi lúc nào cũng được.</p>
      <div class="picks">${GOALS.map(g=>`<button class="pick" data-goal="${g.id}"><b>${g.t}</b><span>${g.d}</span></button>`).join('')}</div>
    </section>`;
  } else if(ob.step===2){
    const g=GOALS.find(x=>x.id===ob.goal);
    app.innerHTML=`<section class="ob">
      <span class="eyebrow">Bước 2 / 2 · ${escH(g.t)}</span>
      <h1 class="display">Bạn đang <em>ở mức nào?</em></h1>
      <p class="lede">Trả lời thật. Người đã đi làm sẽ được thử đề vượt chặng để khỏi học lại phần đã biết.</p>
      <div class="picks picks--4">${START_LEVELS.map(l=>`<button class="pick" data-lv="${l.id}"><b>${l.t}</b><span>${l.d}</span></button>`).join('')}</div>
      <button class="btn btn--quiet" data-back style="margin-top:22px">← Chọn lại mục tiêu</button>
    </section>`;
  } else {
    const g=GOALS.find(x=>x.id===ob.goal), p=PATHS.find(x=>x.id===g.path), lv=START_LEVELS[ob.lv];
    const first=p.lessons?p.lessons.find(k=>!lessonState(k))||p.lessons[0]:(ALL.map(x=>x.key).find(k=>lessonOpen(k))||nextLesson());   // bài thuộc lộ trình luôn mở, đầu tiên theo thứ tự hành trình
    const fm=lessonMeta(first), fw=where(first);
    const gaps=SKILLS.map(sk=>({...sk,need:g.need[sk.id]})).sort((a,b)=>b.need-a.need).slice(0,3);
    const skip=ob.lv>=2;
    app.innerHTML=`<section class="ob ob--done">
      <span class="eyebrow eyebrow--gold">Đã sẵn sàng</span>
      <h1 class="display">Nhiệm vụ đầu tiên của bạn <em>đã sẵn sàng.</em></h1>
      <div class="brief">
        <div class="brief__row"><span>Mục tiêu</span><b>${escH(g.t)}</b></div>
        <div class="brief__row"><span>Lộ trình đề xuất</span><b>${escH(p.t)} · ${(p.lessons||ALL).length} bài</b></div>
        <div class="brief__row"><span>Điểm bắt đầu</span><b>${skip?(API.login?'Làm bài xếp lớp — app đặt bạn vào đúng bước, bỏ qua phần đã biết':'Thử đề vượt chặng 01 — qua là bỏ được phần nền tảng'):'Bước 1 · Quan sát'} <small>(${escH(lv.t)})</small></b></div>
        <div class="brief__row"><span>Kỹ năng cần xây nhiều nhất</span><b>${gaps.map(x=>`${escH(x.t)} <small>cần ${x.need}%</small>`).join(' · ')}</b></div>
      </div>
      <div class="mission">
        <span class="eyebrow">Nhiệm vụ 01 · ${fw?escH(JOURNEY.find(j=>j.mods.includes(fw.mod.id)).t):''}</span>
        <h2 class="h2">${escH(fm.t)}</h2>
        <p class="small muted">${escH(fm.read)} đọc · một tình huống thật, một quyết định, một quiz ngắn · <span class="gold">+${XP.lesson} XP</span></p>
        <div class="row" style="margin-top:16px">
          <a class="btn btn--primary btn--lg" href="bai.html?id=${encodeURIComponent(first)}" data-finish>Bắt đầu nhiệm vụ →</a>
          ${skip?(API.login?`<a class="btn btn--ghost" href="xep-lop.html" data-finish>Làm bài xếp lớp</a>`:`<a class="btn btn--ghost" href="thi.html?stage=s1" data-finish>Thử đề vượt chặng 01</a>`):''}
        </div>
      </div>
    </section>`;
  }
}
app.addEventListener('click',e=>{
  const g=e.target.closest('[data-goal]'), l=e.target.closest('[data-lv]');
  if(g){ ob.goal=g.dataset.goal; ob.step=2; onboarding(); scrollTo(0,0); }
  else if(l){ ob.lv=+l.dataset.lv; ob.step=3; onboarding(); scrollTo(0,0); }
  else if(e.target.closest('[data-back]')){ ob.step=1; onboarding(); }
  else if(e.target.closest('[data-finish]')){ const gg=GOALS.find(x=>x.id===ob.goal);
    S.set({goal:gg.id,startLv:ob.lv,path:gg.path}); }
});

/* ================= TÍN HIỆU HÔM NAY =================
   Một câu tình huống mỗi ngày, lấy từ ngân hàng đề của các chặng đã mở. Cùng ngày thì cùng câu. */
function signalItem(s){
  const pool=EXAM_ITEMS.filter(it=>it.type!=='calc'&&it.options&&stageOpen(it.stage,s));
  if(!pool.length) return null;
  const t=today(); let h=0; for(const c of t) h=(h*31+c.charCodeAt(0))>>>0;
  const saved=(s.daily||{})[t]; return saved&&EXAM_ITEMS.find(x=>x.id===saved.id) || pool[h%pool.length];
}
function signalHTML(s){
  const it=signalItem(s); if(!it) return '';
  const res=(s.daily||{})[today()], sk=skillOfLesson(it.source||(it.teaches||[])[0]);
  return `<section class="signal" id="signal">
    <div class="signal__head"><span class="eyebrow eyebrow--light">Tín hiệu thị trường · ${new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'numeric'})}</span>
      <span class="small">1–3 phút · <span class="gold">+${XP.daily} XP</span> · giữ chuỗi ngày</span></div>
    <p class="signal__stem">${it.stem}</p>
    <div class="signal__opts">${it.options.map(o=>{
      const why=(res&&res.why)||{}, st=res?(o.k===res.answer?'right':o.k===res.given?'wrong':''):'';
      return `<button class="opt" data-sig="${o.k}" ${res?'disabled':''} ${st?`data-r="${st}"`:''}>${escH(o.t)}${res&&why[o.k]?`<small>${escH(why[o.k])}</small>`:''}</button>`}).join('')}</div>
    ${res?`<div class="signal__after">
      <span class="${res.ok?'ok':'bad'}">${res.ok?'Đúng — đọc được tín hiệu.':'Chưa đúng — câu này đã vào hàng ôn.'}</span>
      ${sk?`<span class="skillup">${escH(sk.t)}${res.ok?' ↑':' · cần luyện'}</span>`:''}
      ${(res.why||{})[res.answer]?`<div class="stickynote"><span class="eyebrow">Thẻ insight</span>${escH(res.why[res.answer])}</div>`:''}
      <a class="btn btn--ghost" href="${res.ok?'quiz.html':'on-loi.html'}">${res.ok?'Luyện tiếp 5 câu →':'Luyện lại chỗ sai →'}</a></div>`:''}
  </section>`;
}
async function answerSignal(k){
  const s=S.get(), it=signalItem(s);
  document.querySelectorAll('[data-sig]').forEach(b=>b.disabled=true);
  let g; try{ g=await gradeAsync(it,k,'practice'); }
  catch(e){ document.querySelectorAll('[data-sig]').forEach(b=>b.disabled=false); toast(GRADE_OFFLINE); return; }
  const ok=g.ok;
  /* lưu đáp án + lời giải server trả về để lần mở sau vẫn hiện, không cần tải lại đáp án */
  S.set({daily:{...(s.daily||{}),[today()]:{id:it.id,given:k,ok,answer:g.answer,why:g.why}}});
  if(!ok) (it.teaches||[]).slice(0,1).forEach(pid=>logError(conceptCode(pid),it.source||pid));
  award('daily',today());
  render(); document.getElementById('signal').scrollIntoView({block:'start'});
}

/* ================= COMMAND CENTER ================= */
function render(){
  const s=S.get();
  if(!s.goal){ onboarding(); return; }
  const g=goalOf(s), path=PATHS.find(p=>p.id===(s.path||g.path))||PATHS[0];
  const js=journeyState(s), ni=js.findIndex(j=>j.st==='now'), now=js[ni]||js[js.length-1];
  const tasks=todayTasks(s), firstOpen=tasks.find(t=>!t.done);
  const rk=rank(s), gaps=skillGaps(s), weak=gaps[0];
  const nk=nextLesson(s), learning=nk&&skillOfLesson(nk);
  const lp=learning&&skillPct(learning,s);
  const nxt=js[ni+1];
  let unlock=null;
  if(nxt){
    if(nxt.st==='lock'){ const i=STAGES.findIndex(x=>x.id===nxt.stage.id), pv=STAGES[i-1];
      unlock={t:nxt.t,how:`Qua đề vượt chặng ${pv.n} để mở`,href:`thi.html?stage=${pv.id}`,cta:'Xem đề chặng'}; }
    else unlock={t:nxt.t,how:`Còn ${now.total-now.have} bài ở bước ${now.t}`,href:nk?'bai.html?id='+encodeURIComponent(nk):'hoc-bai.html',cta:'Học tiếp'};
  }
  const wk=weekly(S.get());
  const pl=path.lessons||ALL.map(x=>x.key), plDone=pl.filter(k=>s.done[k]).length;
  const rw={learn:`+${XP.lesson} XP`,drill:`đến +${XP_CAP.review} XP`,signal:`+${XP.daily} XP`};

  const started=s.xp>0||s.streak>0||Object.keys(s.done||{}).length>0;
  const startKeys=(path.start||pl.slice(0,6)).slice(0,6);

  /* Định hướng câu hỏi chiến lược cho từng case */
  function caseQuestion(k, m, w) {
    const custom = {
      'B:ob01-01': 'Khách hàng ghé quán nhưng không gọi món: Vấn đề ở menu hay trải nghiệm?',
      'B:ob01-02': 'Quán trà sữa vắng khách dù ở mặt tiền: Bạn bắt đầu chẩn đoán từ đâu?',
      'B:ob01-03': 'Tung khuyến mãi mua 1 tặng 1: Vì sao khách biến mất khi hết giảm giá?',
      'B:ob01-04': 'Giá 68k cho một ly cà phê specialty: Khách có thấy đáng tiền?',
      'B:ob01-05': 'Chiến dịch đẹp nghìn share nhưng không ai mua: Điểm nghẽn ở bước nào?',
      'B:ob01-06': 'Doanh thu giảm 20%: Cắt chi phí quảng cáo hay đổi thông điệp?',
      'B:ob01-07': 'Đối thủ copy mẫu quảng cáo và bán rẻ hơn: Bạn ứng phó thế nào?',
      'L:1': 'Khách không mua cái máy khoan, họ mua cái lỗ trên tường: Bán tính năng hay công việc cần làm?',
      'L:2': 'Giá 68k cho một ly cà phê: Định vị trải nghiệm hay neo giá sản phẩm?',
      'L:3': 'Chiến dịch đẹp nhưng không ai mua: Bóc tách rào cản chuyển đổi',
      'L:4': 'Doanh thu giảm 20%: Bạn bắt đầu chẩn đoán từ đâu?',
      'L:65': 'ROAS 4.0 lần nhưng thương hiệu có thực sự kiếm được tiền?'
    };
    if (custom[k]) return custom[k];
    if (m && m.t) {
      if (/giá|chi phí|lợi nhuận|roas|tiền/i.test(m.t)) return `Bài toán kinh tế: ${m.t} — Doanh nghiệp có thực sự có lãi?`;
      if (/khách|insight|hành vi|tâm lý/i.test(m.t)) return `Giải mã tâm lý: ${m.t} — Động lực ngầm đằng sau hành vi mua?`;
      if (/định vị|thương hiệu|brand/i.test(m.t)) return `Định vị chiến lược: Làm sao để ${m.t} tạo ra sự khác biệt bền vững?`;
      if (/quảng cáo|media|kênh|content/i.test(m.t)) return `Đo lường chiến dịch: ${m.t} — Tác động thực tế đến chuyển đổi?`;
      return `Tình huống: ${m.t}`;
    }
    return 'Tình huống chiến lược marketing';
  }

  function caseContext(k, w) {
    const sectors = [
      'F&B · Chuỗi cà phê & Trải nghiệm',
      'D2C · Thời trang & Phong cách sống',
      'Bán lẻ · Mỹ phẩm & Chăm sóc cá nhân',
      'Dịch vụ số · E-commerce & App',
      'Hàng tiêu dùng nhanh (FMCG)'
    ];
    let h = 0; for (const c of k) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return sectors[h % sectors.length];
  }

  /* Ảnh campaign hoặc plate đồ họa cho case */
  const caseImages = [
    'assets/og/case-baemin-vietnam.png',
    'assets/og/case-bitis-hunter.png',
    'assets/og/case-oatly-packaging.png',
    'assets/og/case-highlands-third-place.png',
    'assets/og/case-katinat-sao-la.png',
    'assets/og/case-spotify-wrapped.png',
    'assets/og/case-dove-real-beauty.png'
  ];

  /* VISUAL CASE PREVIEWS */
  const visualCasesHTML = `
    <section style="margin-top:clamp(28px,4vw,44px)">
      <div class="row between">
        <div>
          <span class="studio-badge studio-badge--terra">Visual Case Previews</span>
          <h2 class="h2" style="margin:8px 0 0">Tình huống đang chờ bạn <em>giải quyết</em></h2>
        </div>
        <a class="btn btn--ghost" href="hoc-bai.html">Xem toàn bộ lộ trình →</a>
      </div>
      <div class="case-visual-grid">
        ${startKeys.map((k, i) => {
          const m = lessonMeta(k), st = lessonState(k, s), w = where(k), sk = skillOfLesson(k);
          const q = caseQuestion(k, m, w);
          const ctx = caseContext(k, w);
          const img = caseImages[i % caseImages.length];
          const isDone = !!st;
          return `
            <a class="case-card-visual" href="bai.html?id=${encodeURIComponent(k)}" data-done="${isDone}">
              <div class="case-card-visual__thumb">
                <img class="case-card-visual__img" src="${img}" alt="${escH(m ? m.t : k)}" loading="lazy">
                <span class="studio-badge" style="position:absolute;top:10px;left:10px;background:rgba(26,16,11,.85);color:#fff;border-color:transparent">
                  ${escH(ctx)}
                </span>
              </div>
              <div class="case-card-visual__content">
                <span class="lbl" style="color:var(--terra)">${sk ? escH(sk.t) : (w ? escH(w.stage.t) : 'Chiến lược')}</span>
                <h3 class="case-card-visual__problem">${escH(q)}</h3>
                <p class="case-card-visual__desc">Khái niệm: <b>${escH(m ? m.t : '')}</b> · Đọc bối cảnh thật, chọn phương án và đối chiếu kết quả.</p>
                <div class="case-card-visual__foot">
                  <span>⏱ ${escH(m ? m.read : '6 phút')} · +10 XP</span>
                  <span class="case-card-visual__status">${isDone ? '✓ Đã hoàn thành' : 'Sẵn sàng giải quyết →'}</span>
                </div>
              </div>
            </a>
          `;
        }).join('')}
      </div>
    </section>
  `;

  /* FEATURED DAILY MISSION */
  const missionLesson = firstOpen ? firstOpen.href.replace('bai.html?id=', '') : (startKeys[0] || 'L:1');
  const mm = lessonMeta(decodeURIComponent(missionLesson)) || lessonMeta('L:1');
  const mw = where(decodeURIComponent(missionLesson));
  const featuredMissionHTML = `
    <section class="mission-dilemma">
      <div class="mission-dilemma__main">
        <div class="row between">
          <span class="studio-badge studio-badge--terra">Nhiệm vụ chiến lược hôm nay</span>
          <span class="studio-badge studio-badge--sage">+${XP.lesson} XP KHI HOÀN THÀNH</span>
        </div>
        <h2 class="h2" style="margin:6px 0 0">
          ${escH(caseQuestion(decodeURIComponent(missionLesson), mm, mw))}
        </h2>
        <p class="small" style="color:var(--ink-70);line-height:1.6;margin:0">
          Bạn đang đóng vai trò Creative Strategist. Hãy đọc kỹ dữ kiện thực tế của thương hiệu, 
          phân tích động lực ngầm của khách hàng và đưa ra quyết định có trách nhiệm với ngân sách.
        </p>
        <div class="row" style="margin-top:10px">
          <a class="btn btn--primary btn--lg" href="${firstOpen ? firstOpen.href : 'bai.html?id=' + encodeURIComponent(missionLesson)}">
            ${firstOpen ? 'Thực hiện nhiệm vụ ngay →' : 'Bắt đầu case hôm nay →'}
          </a>
          <span class="small muted">Khoảng 6 phút · 1 bài đọc, 1 quyết định, 1 phản biện</span>
        </div>
      </div>
      <div class="mission-dilemma__side">
        <span class="lbl">Hồ sơ tình huống</span>
        <div style="font-family:var(--serif);font-size:1.15rem;font-weight:500;line-height:1.3">
          ${escH(mm ? mm.t : 'Chiến lược cốt lõi')}
        </div>
        <div class="small muted">Lĩnh vực: <b>${escH(caseContext(decodeURIComponent(missionLesson), mw))}</b></div>
        <div class="small muted">Mục tiêu: <b>${escH(g.t)}</b> · Chặng <b>${escH(now.t)}</b></div>
      </div>
    </section>
  `;

  /* CASE COLLECTIONS */
  const collectionsHTML = `
    <section style="margin-top:clamp(32px,5vw,56px);border-top:1px solid var(--ink-12);padding-top:clamp(28px,4vw,44px)">
      <span class="studio-badge studio-badge--blush">Chuyên đề tuyển chọn</span>
      <h2 class="h2" style="margin:10px 0 16px">Case Collections</h2>
      <div class="method-chain" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
        <div class="method-card">
          <span class="lbl" style="color:var(--terra)">BỘ SƯU TẬP 01</span>
          <b>Sức mạnh định giá & Bản sắc</b>
          <p class="small muted">Học cách bán giá cao gấp 3 lần đối thủ mà khách hàng vẫn tự hào cầm trên tay.</p>
          <a class="btn btn--quiet" href="case-thu-vien.html" style="margin-top:auto">Khám phá 6 case →</a>
        </div>
        <div class="method-card">
          <span class="lbl" style="color:var(--sage-d)">BỘ SƯU TẬP 02</span>
          <b>Bóc tách Insight & Rào cản</b>
          <p class="small muted">Những chiến dịch giải quyết mâu thuẫn văn hóa sâu sắc thay vì chỉ chạy theo trend.</p>
          <a class="btn btn--quiet" href="case-thu-vien.html" style="margin-top:auto">Khám phá 8 case →</a>
        </div>
        <div class="method-card">
          <span class="lbl" style="color:var(--gold-d)">BỘ SƯU TẬP 03</span>
