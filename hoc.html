<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23C85A32%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27Georgia,serif%27 font-size=%2720%27 text-anchor=%27middle%27 fill=%27%23FAF3E8%27%3EM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/case.css?v=13">
<title>Hành trình hôm nay — Tự Học Marketing Case</title>
<meta name="description" content="Khám phá các thế giới marketing, giải quyết case study thực tế và nâng cao tư duy chiến lược mỗi ngày.">
<style>
  :root{--card:var(--bg-2)}
  html[data-theme="ivory"]{--card:#FFFFFF}
  body{background:var(--bg);color:var(--ink)}
  .d-dash{max-width:1240px;margin:0 auto;padding:22px clamp(14px,2.4vw,32px) 60px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
  .d-col{display:grid;gap:18px;min-width:0}
  .d-col>*{min-width:0}
  .d-card{background:var(--card);border:1px solid var(--ink-12);border-radius:20px;padding:22px}
  .d-mission{display:grid;grid-template-columns:minmax(0,1fr) 38%;gap:22px;align-items:center}
  .d-mission__ic{width:52px;height:52px;border-radius:14px;background:var(--terra);display:grid;place-items:center;margin-bottom:12px}
  .d-mission__ic svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .d-chip{font:700 11px/1 var(--sans);letter-spacing:.04em;padding:6px 10px;border-radius:99px;text-transform:uppercase}
  .d-chip--g{background:rgba(34,160,90,.14);color:#15803d}.d-chip--y{background:rgba(229,178,75,.2);color:var(--gold-d)}
  .d-mission h1{font:800 clamp(1.4rem,2.2vw,1.9rem)/1.2 var(--sans);margin:4px 0 14px;color:var(--ink)}
  .d-dash .muted,.d-dash .small{color:var(--ink-50)}
  .d-dash b{color:var(--ink)}
  .d-mission__img{border-radius:16px;overflow:hidden;aspect-ratio:16/10}
  .d-mission__img img{width:100%;height:100%;object-fit:cover;display:block}
  .btn-go{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:11px 20px;background:var(--terra);color:#fff;text-decoration:none;font:700 14px var(--sans)}
  .d-bar{height:8px;border-radius:99px;background:var(--ink-12);overflow:hidden}
  .d-bar i{display:block;height:100%;background:var(--terra);border-radius:99px}
  .d-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .d-tabs button{border:1.5px solid var(--ink-12);background:var(--card);color:var(--ink);border-radius:14px;padding:14px 12px;cursor:pointer;
    font:800 12.5px/1.2 var(--sans);letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px}
  .d-tabs button.on{border-color:var(--terra);color:var(--terra);box-shadow:0 0 0 3px var(--terra-06)}
  .d-tabs em{font-style:normal;font-size:10.5px;padding:3px 7px;border-radius:99px;background:var(--ink-06);color:var(--ink-70)}
  .d-tilegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .d-tile{display:block;padding:16px;border-radius:14px;border:1px solid var(--ink-12);background:var(--bg);color:var(--ink);text-decoration:none}
  .d-tile b{display:block;font-size:15px}.d-tile span{font-size:13px;color:var(--ink-50)}
  .d-tile:hover{border-color:var(--terra)}
  .d-journey{border-radius:14px;overflow:hidden;margin:10px 0 12px;aspect-ratio:16/8}
  .d-journey img{width:100%;height:100%;object-fit:cover;display:block}
  .d-pills{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
  .d-pills button{border:0;border-radius:99px;padding:7px 13px;background:var(--ink-06);color:var(--ink-70);font:700 12.5px var(--sans);cursor:pointer}
  .d-pills button.on{background:var(--terra);color:#fff}
  @media(max-width:1020px){.d-dash{grid-template-columns:minmax(0,1fr)}.d-mission{grid-template-columns:1fr}}
  @media(max-width:560px){.d-tabs{grid-template-columns:1fr}}

  /* bản đồ 30 cấp độ (dùng chung dữ liệu với cap-do.html) */
  .lvmap{background:radial-gradient(120% 120% at 0% 0%,#2A1B13,#1E130D);color:#F7EBDD;border-radius:24px;padding:20px 20px 16px;border:1px solid rgba(255,255,255,.06)}
  .lvmap__h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
  .lvmap__h h2{margin:0 0 4px;font:600 1.2rem var(--serif);color:#F7EBDD}.lvmap__h p{margin:0;color:rgba(247,235,221,.65);font-size:13px}
  .lvmap__chip{font:800 12.5px var(--sans);padding:8px 14px;border-radius:99px;background:rgba(229,178,75,.14);color:#E5B24B;white-space:nowrap;text-decoration:none}
  .lvmap__track{position:relative;display:flex;gap:12px;overflow-x:auto;padding:24px 6px 12px;margin-top:4px;scrollbar-width:thin}
  .lvmap__track::before{content:"";position:absolute;left:0;right:0;top:62px;height:3px;background:rgba(255,255,255,.1)}
  .lvmap__lv{flex:0 0 124px;position:relative;display:grid;gap:8px;justify-items:center;text-align:center}
  .lvmap__badge{position:relative;width:68px;height:68px;border-radius:20px;display:grid;place-items:center;background:var(--bg,#555);color:#fff;font-weight:900;font-size:23px;
    box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 10px 24px -10px rgba(0,0,0,.6)}
  .lvmap__badge svg{position:absolute;right:-8px;bottom:-8px;width:24px;height:24px;padding:4px;border-radius:50%;background:#3D7A45;stroke:#fff;fill:none;stroke-width:3;box-sizing:border-box}
  .lvmap__lv[data-s="locked"] .lvmap__badge{filter:grayscale(1);opacity:.4}
  .lvmap__lv[data-s="here"] .lvmap__badge{outline:3px solid #E5B24B;outline-offset:4px;transform:scale(1.08)}
  .lvmap__card{width:100%;box-sizing:border-box;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);border-radius:14px;padding:9px 8px 10px;display:grid;gap:3px}
  .lvmap__lv[data-s="here"] .lvmap__card{border-color:#E5B24B;background:rgba(229,178,75,.08)}
  .lvmap__lv[data-s="locked"] .lvmap__card{opacity:.55}
  .lvmap__card small{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:rgba(247,235,221,.5)}
  .lvmap__card b{font-size:13px;line-height:1.25;min-height:32px;color:#F7EBDD}
  .lvmap__card span{font-size:11.5px;color:rgba(247,235,221,.6)}
  .lvmap__you{position:absolute;top:-2px;left:50%;transform:translate(-50%,-100%);background:#E5B24B;color:#2A1B13;font:900 10.5px var(--sans);border-radius:99px;padding:3px 9px;letter-spacing:.06em}
  .lvmap__f{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);border-radius:16px;padding:12px 14px;margin-top:8px;font-size:14px}
  .lvmap__bar{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:10px}.lvmap__bar i{display:block;height:100%;background:#E5B24B;border-radius:99px}
  .lvmap__go{display:inline-flex;border-radius:12px;background:var(--terra);color:#fff;font:800 12.5px var(--sans);letter-spacing:.05em;text-transform:uppercase;padding:11px 16px;text-decoration:none}
</style>
<link rel="stylesheet" href="assets/css/paper.css?v=4">
</head>
<body>
<noscript><div class="nojs"><h1 class="h2">Trang này cần JavaScript</h1><p>Bài học và tiến độ được dựng ngay trong trình duyệt của bạn.</p></div></noscript>

<!-- TOP NAVIGATION BAR -->
<main class="wrap" id="app"></main>

<script src="assets/js/data/lessons.js?v=8"></script>
<script src="assets/js/data/principles.js?v=8"></script>
<script src="assets/js/data/curriculum.js?v=4"></script>
<script src="assets/js/data/bai-index.js?v=11"></script>
<script src="assets/js/data/drills.js?v=3"></script>
<script src="assets/js/data/cases.js?v=5"></script>
<script src="assets/js/data/exam-items.js?v=8"></script>
<script src="assets/js/app.js?v=21"></script>
<script src="assets/js/social-ui.js?v=2"></script>
<script>
appShell('hoc.html');
const app = document.getElementById('app');
app.className = '';


const TIER_COLORS = ['#8A7B6B', '#5E8C61', '#3F7EA6', '#7A5BA8', '#C0792B', '#B8452E'];
function renderLevelMap(nextKey) {
  const el = document.getElementById('lvMap'); if (!el) return;
  const s = S.get(), L = level(s.xp), n = L.n, nxt = L.next, need = nxt ? nxt - s.xp : 0;
  const per = Math.round((nxt ? (s.xp - L.cur) / (nxt - L.cur) : 1) * 100);
  const left = Math.max(1, Math.ceil(need / XP.lesson)), st = (i) => i < n ? 'done' : i === n ? 'here' : 'locked';
  const f = (x) => x.toLocaleString('vi-VN'), check = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  el.innerHTML = `<div class="lvmap__h"><div><h2>Bản đồ cấp độ học viên</h2><p>${f(s.xp)} XP · 6 bậc, mỗi bậc 5 cấp.</p></div>
      <a class="lvmap__chip" href="cap-do.html" title="Xem chi tiết 30 cấp và cách kiếm XP">Cấp ${n}/30 →</a></div>
    <div class="lvmap__track" id="lvTrack">${LEVELS.map((name, k) => { const i = k + 1, t = st(i);
      return `<div class="lvmap__lv" data-s="${t}">${t === 'here' ? '<span class="lvmap__you">BẠN</span>' : ''}
        <div class="lvmap__badge" style="--bg:${TIER_COLORS[Math.floor(k / 5)]}">${i}${t === 'done' ? check : ''}</div>
        <div class="lvmap__card"><small>CẤP ${i}</small><b>${escH(name)}</b><span>${f(lvXP(i))} XP</span>
          <span>${t === 'done' ? 'Đã đạt' : t === 'here' ? (nxt ? 'còn ' + f(need) + ' XP' : 'Cấp cao nhất') : 'cần ' + f(lvXP(i) - s.xp) + ' XP'}</span></div></div>`; }).join('')}</div>
    <div class="lvmap__f"><div style="flex:1;min-width:200px">${nxt ? `Còn <b style="color:#fff">${f(need)} XP</b> nữa lên cấp ${n + 1} — khoảng ${left} bài học.` : 'Bạn đang ở cấp cao nhất.'}
      <div class="lvmap__bar"><i style="width:${per}%"></i></div></div>
      <a class="lvmap__go" href="bai.html?id=${encodeURIComponent(nextKey)}">Học bài ngay →</a></div>`;
  const cur = el.querySelector('[data-s="here"]'), tr = document.getElementById('lvTrack');
  if (cur && tr) tr.scrollLeft = Math.max(0, cur.offsetLeft - tr.clientWidth / 2 + cur.clientWidth / 2);
}

function renderDashboard(user) {
  const s = S.get();
  const doneCount = Object.keys(s.done || {}).length;
  const totalLessons = ALL.length;
  const pct = Math.min(100, Math.round((doneCount / Math.max(1, totalLessons)) * 100));
  const nk = nextLesson(s) || ALL[0].key;
  const nm = lessonMeta(nk), w = where(nk);
  const stageN = w ? STAGES.indexOf(w.stage) + 1 : 1, lessonN = w ? w.mod.lessons.indexOf(nk) + 1 : 1;
  const goHref = 'bai.html?id=' + encodeURIComponent(nk);
  const hello = user && user.name ? `Chào ${escH(user.name.split(' ').slice(-1)[0])}, ` : '';

  app.innerHTML = `
  <div class="d-dash">
    <div class="d-col">
      <section class="d-card d-mission">
        <div>
          <div class="d-mission__ic"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 19V5"/></svg></div>
          <div class="chips"><span class="d-chip d-chip--g">● Nhiệm vụ đang học</span><span class="d-chip d-chip--y">⚡ +10 XP khi hoàn thành</span></div>
          <div class="small muted">Chặng ${stageN} · Bài ${lessonN}</div>
          <h1>${hello ? `<span style="font-weight:600;color:var(--ink-50);font-size:.7em;display:block">${hello}tiếp tục nhé</span>` : ''}${escH(nm ? nm.t : 'Bắt đầu bài đầu tiên')}</h1>
          <a class="btn-go" href="${goHref}">Học tiếp →</a>
          <div style="display:flex;align-items:center;gap:12px;margin-top:16px;font-size:13px;color:var(--ink-70)">
            <span style="white-space:nowrap">Tiến độ (${doneCount}/${totalLessons} bài)</span><div class="d-bar" style="flex:1"><i style="width:${Math.max(1, pct)}%"></i></div><b>${pct}%</b>
          </div>
        </div>
        <div class="d-mission__img"><img src="assets/img/coffee_aesthetic.jpg" alt=""></div>
      </section>
      <a href="hoc-bai.html" style="font-size:14px;color:var(--ink-70);text-decoration:none">📖 Xem toàn bộ bài học →</a>

      <section class="lvmap" id="lvMap" aria-label="Bản đồ cấp độ"></section>

      <div class="d-tabs" role="tablist">
        <button class="on" data-tab="q" role="tab">🎁 Thưởng &amp; nhiệm vụ</button>
        <button data-tab="m" role="tab">🧭 Mục tiêu nghề &amp; kỹ năng</button>
        <button data-tab="a" role="tab">⚔️ Đấu trường &amp; luyện tập</button>
      </div>
      <section class="d-card" id="tabBody"></section>
    </div>

    <div class="d-col">
      <div id="sbProfile"></div>
      <section class="d-card">
        <div style="display:flex;justify-content:space-between;align-items:center"><b>Hành trình của bạn</b><span class="d-chip d-chip--g">Cấp ${level(s.xp).n}</span></div>
        <div class="d-journey"><img src="assets/img/hero_mountain.jpg" alt=""></div>
        <a href="ban-do.html" class="btn-go" style="display:flex;justify-content:center;background:var(--bg);color:var(--ink);border:1px solid var(--ink-12)">Xem bản đồ hành trình →</a>
      </section>
      <div>
        <div class="d-pills" id="boardPills"><button class="on" data-by="xp">Điểm tuần</button><button data-by="streak">Chuỗi ngày</button><button data-by="cases">Case</button></div>
        <div id="sbBoard"></div>
      </div>
      <div id="sbInvite"></div>
    </div>
  </div>`;

  renderLevelMap(nk);
  const body = document.getElementById('tabBody');
  const tiles = (arr) => `<div class="d-tilegrid">${arr.map(([t, d, h]) => `<a class="d-tile" href="${h}"><b>${t}</b><span>${d}</span></a>`).join('')}</div>`;
  const TAB = {
    q: () => { body.innerHTML = '<div id="qList"></div>'; SocialUI.questsPanel(document.getElementById('qList'), goHref); },
    m: () => { body.innerHTML = tiles([['30 cấp độ & cách kiếm XP', 'Mốc XP từng cấp, bảng điểm', 'cap-do.html'], ['Học theo nghề', 'Chọn mục tiêu nghề nghiệp', 'ban-do.html'], ['Kỹ năng & triện', 'Mức thành thạo từng kỹ năng', 'nang-luc.html'], ['Rương thưởng', 'Mở rương và xem phần thưởng', 'ruong.html']]); },
    a: () => { body.innerHTML = tiles([['Quiz', 'Làm nhanh, nhận XP', 'quiz.html'], ['Thi vượt chặng', 'Chứng minh bạn đã nắm chặng', 'thi.html'], ['Game Kingdom', 'Đấu trường và boss', 'kingdom.html'], ['Luyện phỏng vấn', 'Tập trả lời như thật', 'phong-van.html']]); },
  };
  document.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => {
    document.querySelectorAll('[data-tab]').forEach((x) => x.classList.toggle('on', x === b)); TAB[b.dataset.tab]();
  });
  TAB.q();

  SocialUI.profileCard(document.getElementById('sbProfile'), user);
  const board = (by) => SocialUI.boardCard(document.getElementById('sbBoard'), by);
  board('xp');
  document.querySelectorAll('#boardPills [data-by]').forEach((b) => b.onclick = () => {
    document.querySelectorAll('#boardPills [data-by]').forEach((x) => x.classList.toggle('on', x === b)); board(b.dataset.by);
  });
  SocialUI.inviteCard(document.getElementById('sbInvite'));
}

account().then((u) => renderDashboard(u || {})).catch(() => renderDashboard({}));
</script>
<script src="assets/js/paper.js?v=4"></script>
</body>
</html>
