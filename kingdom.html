<meta name="description" content="Bản đồ thế giới game: đi bộ giữa các toà nhà, vào từng khu để chơi case, quiz, World Boss, đấu trường và mini-game. Ghé mỗi toà mỗi ngày được thưởng xu.">
<style>
:root{--wd-bg:#FBF8F3;--wd-card:#fff;--wd-ink:#24160E;--wd-ink2:rgba(36,22,14,.68);--wd-ink3:rgba(36,22,14,.48);--wd-line:rgba(36,22,14,.12);
  --wd-soft:rgba(36,22,14,.05);--wd-acc:#C85A32;--wd-ok:#3D7A45;--wd-gold:#B07A12;--wd-gold-soft:rgba(229,178,75,.18);
  --wd-grass:#EAEFD9;--wd-grass2:#DDE6C4;--wd-road:#E9D8B8;--wd-water:#BBD6DA;--wd-dark:#2A1A12}
html[data-theme="ivory"]{--wd-bg:#F7F0E6;--wd-card:#FFFDF9}
html[data-theme="dark"]{--wd-bg:#16100C;--wd-card:#221913;--wd-ink:#F4ECE0;--wd-ink2:rgba(244,236,224,.74);--wd-ink3:rgba(244,236,224,.5);--wd-line:rgba(244,236,224,.14);
  --wd-soft:rgba(244,236,224,.07);--wd-acc:#E27A52;--wd-ok:#7DBE86;--wd-gold:#E5B24B;--wd-gold-soft:rgba(229,178,75,.14);
  --wd-grass:#232A18;--wd-grass2:#2C3520;--wd-road:#4A3C2A;--wd-water:#2C4650;--wd-dark:#0E0906}
html,body{background:var(--wd-bg)!important;color:var(--wd-ink)}
body{margin:0;padding:0!important;font-family:var(--sans,system-ui,sans-serif)}
#app{display:block;max-width:none;padding:0;margin:0}
.wd{max-width:1240px;margin:0 auto;padding:clamp(16px,2.6vw,32px) clamp(14px,3vw,36px) 80px;display:grid;gap:18px}
.wd>*{min-width:0}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--wd-acc)}
.wd h1{font-family:var(--serif,Georgia,serif);font-weight:600;font-size:clamp(1.6rem,3vw,2.3rem);margin:6px 0 4px}
.wd .lede{margin:0;color:var(--wd-ink2);max-width:64ch;line-height:1.55}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kp div{background:var(--wd-card);border:1px solid var(--wd-line);border-radius:16px;padding:12px 16px}
.kp small{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--wd-ink3)}
.kp b{font-size:1.35rem}

:root{--wa-sky1:#8FD0F2;--wa-sky2:#CFEBF8;--wa-sky3:#F6EFD8;--wa-sea1:#9AD7EC;--wa-sea2:#6FBBD9;--wa-mt1:#A9BFD9;--wa-mt2:#C7D6E8;
  --wa-plaza-1:#FBE2B4;--wa-plaza-2:#F2BF84;--wa-plaza-c1:#D79B63;--wa-plaza-c2:#B97A47;
  --wa-court-1:#E4D4F4;--wa-court-2:#C2A7E3;--wa-court-c1:#9A80C4;--wa-court-c2:#7A62A6;
  --wa-people-1:#CBE8A8;--wa-people-2:#92C772;--wa-people-c1:#76A85A;--wa-people-c2:#5C8A47;
  --wa-data-1:#C9EAF5;--wa-data-2:#8FCFE6;--wa-data-c1:#6AA9C7;--wa-data-c2:#4D8CAD;
  --wa-road:#FBEBC8;--wa-road-edge:#D9B87C}
html[data-theme="dark"]{--wa-sky1:#1B2A4A;--wa-sky2:#2B3F63;--wa-sky3:#3C4A66;--wa-sea1:#25506A;--wa-sea2:#1B3C54;--wa-mt1:#3A4C6E;--wa-mt2:#4A5C80;
  --wa-plaza-1:#8A6A44;--wa-plaza-2:#6E5236;--wa-plaza-c1:#58402A;--wa-plaza-c2:#442F1E;
  --wa-court-1:#6A5A8C;--wa-court-2:#54467A;--wa-court-c1:#41365F;--wa-court-c2:#30284A;
  --wa-people-1:#5C7F45;--wa-people-2:#456534;--wa-people-c1:#35502A;--wa-people-c2:#273D1F;
  --wa-data-1:#4C8CA6;--wa-data-2:#38708A;--wa-data-c1:#285468;--wa-data-c2:#1C3F52;
  --wa-road:#CDB98E;--wa-road-edge:#8F7A52}
.stage{position:relative;border:1px solid var(--wd-line);border-radius:26px;overflow:hidden;background:var(--wa-sky2);aspect-ratio:1200/760;touch-action:manipulation;user-select:none;container-type:inline-size}
.wa-cloud{animation:waDrift 40s ease-in-out infinite alternate}
@keyframes waDrift{from{transform:translateX(0)}to{transform:translateX(18px)}}
.wa-flag{transform-origin:left center;animation:waFlag 2.4s ease-in-out infinite alternate}
@keyframes waFlag{from{transform:skewY(-4deg)}to{transform:skewY(4deg)}}
@media(prefers-reduced-motion:reduce){.wa-cloud,.wa-flag{animation:none}}
.pl .body{transform-box:fill-box}
.hud{position:absolute;inset:0;pointer-events:none;font-family:var(--sans,system-ui)}
.hud>*{position:absolute}
.hud__title{left:2.4cqw;top:2.2cqw;display:flex;gap:1.2cqw;align-items:center;background:linear-gradient(180deg,#FFF7E3,#F4E3BC);border:1px solid rgba(160,110,50,.35);border-radius:1.2cqw;padding:1cqw 2.4cqw 1cqw 1.4cqw;box-shadow:0 .6cqw 1.6cqw -.8cqw rgba(60,30,10,.5)}
.hud__title svg{width:4cqw;height:4cqw;flex:none}
.hud__title b{display:block;font:700 2.7cqw/1.05 var(--serif,Georgia,serif);color:#3A2A1A}
.hud__title span{display:block;font-size:1.25cqw;color:#7A5A3A;margin-top:.3cqw}
.hud__stats{left:50%;top:1.8cqw;transform:translateX(-50%);display:flex;background:rgba(255,248,232,.92);border:1px solid rgba(160,110,50,.3);border-radius:2.4cqw;padding:.8cqw 1.4cqw;gap:0;box-shadow:0 .6cqw 1.6cqw -.8cqw rgba(60,30,10,.45);color:#3A2A1A}
.hud__stats div{padding:0 2.2cqw;border-left:1px solid rgba(160,110,50,.25);min-width:7cqw}
.hud__stats div:first-child{border-left:0}
.hud__stats small{display:block;font-size:1.15cqw;color:#8A6A48;font-weight:600}
.hud__stats b{font-size:2.1cqw;font-weight:800;line-height:1.15}
.hud__bar{height:.6cqw;border-radius:9cqw;background:rgba(120,80,30,.2);margin-top:.35cqw;overflow:hidden}
.hud__bar i{display:block;height:100%;background:#F2A33A}
.hud__help{left:2cqw;bottom:2cqw;display:flex;gap:1.2cqw;align-items:center;background:linear-gradient(180deg,#FFF7E3,#F4E3BC);border:1px solid rgba(160,110,50,.35);border-radius:1.2cqw;padding:1cqw 2cqw 1cqw 1.2cqw;max-width:30cqw}
.hud__help b{display:block;font:700 1.9cqw/1.1 var(--serif,Georgia,serif);color:#3A2A1A}
.hud__help span{display:block;font-size:1.2cqw;color:#7A5A3A;margin-top:.2cqw}
.hud__motto{right:2cqw;bottom:2cqw;text-align:right;display:flex;gap:1.4cqw;align-items:center;color:#3A2A1A}
.hud__motto span{display:block;background:linear-gradient(180deg,#FFF7E3,#F4E3BC);border:1px solid rgba(160,110,50,.35);border-radius:1cqw;padding:.8cqw 1.4cqw;font-style:italic;font-size:1.25cqw;line-height:1.4;transform:rotate(-2deg)}
.hud__motto svg{width:5.5cqw;height:5.5cqw}
.pl .nm{font:800 14px var(--sans,system-ui);fill:#4A3220}
.pl .sub{font:800 9.5px var(--sans,system-ui);letter-spacing:.05em;fill:#8A6A48}
@media(max-width:820px){.hud__help,.hud__motto{display:none}}
.stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{position:absolute;left:14px;bottom:12px;background:var(--wd-card);border:1px solid var(--wd-line);border-radius:99px;padding:7px 14px;font-size:12.5px;color:var(--wd-ink2)}
.pl{cursor:pointer}
.pl:hover .body{transform:translateY(-3px)}
.pl .body{transition:transform .15s}
.pl[data-sel] .ring{opacity:.55}
.pl .ring{opacity:0;transition:opacity .15s}
.pl[data-state="locked"] .body,.pl[data-state="soon"] .body{filter:grayscale(.85) brightness(1.05)}
.pl[data-state="soon"]{opacity:.8}
#me{pointer-events:none}
.panel{background:var(--wd-card);border:1px solid var(--wd-line);border-radius:20px;padding:16px 18px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;min-height:56px}
.panel b{font-size:17px}
.panel p{margin:2px 0 0;color:var(--wd-ink2);font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:var(--wd-soft);color:var(--wd-ink2);margin-right:6px}
.tag--ok{background:rgba(61,122,69,.14);color:var(--wd-ok)}.tag--gold{background:var(--wd-gold-soft);color:var(--wd-gold)}
.go{border:0;border-radius:12px;background:var(--wd-acc);color:#fff;font:800 13px var(--sans,system-ui);letter-spacing:.05em;text-transform:uppercase;padding:13px 20px;cursor:pointer;text-decoration:none;white-space:nowrap}
.go[disabled]{opacity:.45;cursor:default}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.list button{text-align:left;border:1.5px solid var(--wd-line);background:var(--wd-card);color:var(--wd-ink);border-radius:16px;padding:14px 16px;cursor:pointer;display:grid;gap:4px;font:inherit}
.list button:hover:not([disabled]){border-color:var(--wd-acc)}
.list button[data-sel]{border-color:var(--wd-acc);box-shadow:0 0 0 3px rgba(200,90,50,.12)}
.list b{font-size:15px}.list span{font-size:13px;color:var(--wd-ink2)}
.list button[data-state="locked"],.list button[data-state="soon"]{opacity:.6}
.note{border-left:4px solid var(--wd-gold);background:var(--wd-gold-soft);border-radius:0 14px 14px 0;padding:12px 16px;font-size:14px}
.note a{color:var(--wd-acc);font-weight:700}
.sr{position:absolute;left:-9999px}
.stagewrap{overflow-x:auto;border-radius:26px;scrollbar-width:thin}
@media(max-width:820px){.stagewrap .stage{min-width:880px}}
.tour{position:fixed;inset:0;z-index:70;background:rgba(20,12,8,.72);display:grid;place-items:center;padding:16px}
.tour[hidden]{display:none}
.tour__c{background:var(--wd-card);color:var(--wd-ink);border-radius:22px;max-width:460px;width:100%;padding:22px 24px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.tour__c h2{margin:4px 0 8px;font:600 1.4rem var(--serif,Georgia,serif)}
.tour__c p{margin:0;color:var(--wd-ink2);line-height:1.6}
.tour__d{display:flex;gap:6px;margin:14px 0}
.tour__d i{width:8px;height:8px;border-radius:50%;background:var(--wd-line)}.tour__d i[data-on]{background:var(--wd-acc)}
.tour__b{display:flex;justify-content:space-between;gap:10px}
.board{width:100%;border-collapse:collapse;font-size:14px}
.board th,.board td{text-align:left;padding:9px 6px;border-top:1px solid var(--wd-line)}
.board th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--wd-ink3);border-top:0}
.board td.n{text-align:right;font-variant-numeric:tabular-nums}
.extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.box{background:var(--wd-card);border:1px solid var(--wd-line);border-radius:20px;padding:16px 18px}
.box h2{margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.chest{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--wd-line)}
.chest:first-of-type{border-top:0}
.chest b{font-size:14.5px}.chest small{display:block;color:var(--wd-ink3);font-size:12.5px}
.chest .bar{grid-column:1/-1;height:6px;border-radius:9px;background:var(--wd-soft);overflow:hidden}
.chest .bar i{display:block;height:100%;background:var(--wd-acc)}
.sm{border:0;border-radius:10px;background:var(--wd-acc);color:#fff;font:800 12px var(--sans,system-ui);padding:9px 14px;cursor:pointer}
.sm[disabled]{background:var(--wd-soft);color:var(--wd-ink3);cursor:default}
.wear{display:flex;gap:8px;flex-wrap:wrap}
.wear button{border:1.5px solid var(--wd-line);background:var(--wd-card);color:var(--wd-ink);border-radius:99px;padding:8px 14px 8px 8px;font:700 13px var(--sans,system-ui);cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.wear button i{width:20px;height:20px;border-radius:50%;display:block;border:2px solid #fff;box-shadow:0 0 0 1px var(--wd-line)}
.wear button[aria-pressed="true"]{border-color:var(--wd-acc);box-shadow:0 0 0 3px rgba(200,90,50,.14)}
.wear button[disabled]{opacity:.55;cursor:default}
.wear small{font-weight:600;color:var(--wd-ink3)}
</style>

<body>
<noscript><div class="nojs"><h1 class="h2">Trang này cần JavaScript</h1></div></noscript>
<main id="app"></main>
<script src="assets/js/data/lessons.js?v=8"></script>
<script src="assets/js/data/principles.js?v=8"></script>
<script src="assets/js/data/curriculum.js?v=4"></script>
<script src="assets/js/data/bai-index.js?v=11"></script>
<script src="assets/js/data/world-map.js?v=1"></script>
<script src="assets/js/app.js?v=21"></script>
<script src="assets/js/games/frame.js?v=1"></script>
<script src="assets/js/world/art.js?v=1"></script>
<script>
appShell('kingdom.html');
const app=document.getElementById('app');
const NS='http://www.w3.org/2000/svg';
const state={user:null, srv:null, level:level().n, coins:null, visited:new Set(), sel:null, target:null, pending:null, pos:null, keys:new Set()};
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;

const stateOf=p=>p.soon?'soon':(state.level<(p.min_level||1)?'locked':'open');
const visitable=()=>WORLD.places.filter(p=>!p.soon);

function savedPos(){ const g=(S.get().gw||{}).pos; return g&&isFinite(g.x)&&isFinite(g.y)?worldClamp(g):{...WORLD.start}; }
function savePos(){ const s=S.get(); S.set({gw:{...(s.gw||{}),pos:{x:Math.round(state.pos.x),y:Math.round(state.pos.y)}}}); }

/* ---------- vẽ ---------- */
function regionColor(id){ return (WORLD.regions.find(r=>r.id===id)||{}).c||'#888'; }
function drawWorld(){
  return WorldArt.world(WORLD,{ fill:currentOutfit().fill,
    placeOpts:p=>{ const st=stateOf(p); return { state:st, visited:state.visited.has(p.id), locked:st==='locked', stars:(p.game&&st==='open')?GW.stars(p.id):null }; } });
}
function drawMe(){ const me=document.getElementById('me'); if(me) me.setAttribute('transform',`translate(${state.pos.x},${state.pos.y})`); }

/* ---------- hướng dẫn lần đầu ---------- */
const TOUR=[
  ['Đây là vương quốc của bạn','Mỗi toà nhà là một cách luyện: case, quiz, đấu trường, boss và các mini-game. Nhân vật tròn màu cam là bạn.'],
  ['Đi dạo và vào toà','Bấm vào toà nhà hoặc chỗ trống để đi tới; hoặc dùng phím mũi tên / WASD. Đến nơi, bảng bên dưới hiện thông tin và nút Vào.'],
  ['Chơi để lấy sao','Mỗi mini-game chấm 1–3 sao. Sao mới cho XP; đủ sao trong một khu thì mở rương, huy hiệu và áo mới cho nhân vật.'],
];
function tour(){
  if((gwState()).seen) return;
  let i=0; const el=document.createElement('div'); el.className='tour'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-label','Hướng dẫn');
  document.body.appendChild(el);
  const close=()=>{ const s=gwState(); S.set({gw:{...s,seen:true}}); el.remove(); };
  const draw=()=>{ const [h,p]=TOUR[i];
    el.innerHTML=`<div class="tour__c"><span class="eyebrow">Bước ${i+1}/${TOUR.length}</span><h2>${escH(h)}</h2><p>${escH(p)}</p>
      <div class="tour__d">${TOUR.map((_,k)=>`<i ${k===i?'data-on':''}></i>`).join('')}</div>
      <div class="tour__b"><button class="go" style="background:var(--wd-soft);color:var(--wd-ink)" id="tSkip">Bỏ qua</button><button class="go" id="tNext">${i<TOUR.length-1?'Tiếp':'Bắt đầu đi dạo'}</button></div></div>`;
    el.querySelector('#tSkip').onclick=close; el.querySelector('#tNext').onclick=()=>{ if(i<TOUR.length-1){ i++; draw(); } else close(); };
    el.querySelector('#tNext').focus(); };
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&el.isConnected) close(); });
  draw();
}

/* ---------- rương vùng + trang phục ---------- */
const gwState=()=>S.get().gw||{};
function currentOutfit(){ const g=gwState(), o=WORLD.outfits.find(x=>x.id===g.outfit);
  return o&&worldOutfitUnlocked(o,g.stars||{},g.chests||{})?o:WORLD.outfits[0]; }
function paintOutfit(){ const c=document.getElementById('meBody'); if(c) c.setAttribute('fill',currentOutfit().fill); }
function extras(){
  const el=document.getElementById('extras'); if(!el) return;
  const g=gwState(), stars=g.stars||{}, chests=g.chests||{}, cur=currentOutfit().id;
  const regs=WORLD.regions.filter(r=>r.chest);
  el.innerHTML=`<div class="box"><h2>Rương vùng</h2>${regs.map(r=>{ const rs=worldRegionStars(r.id,stars), opened=chests[r.id], ready=worldChestReady(r.id,stars);
      return `<div class="chest"><span><b>${escH(r.t)}</b><small>${opened?'Đã mở · huy hiệu “'+escH(r.chest.badge)+'”':`${Math.min(rs.have,r.chest.need)}/${r.chest.need} sao để mở · tối đa ${rs.max}`}</small></span>
        ${opened?'<span class="tag tag--ok">Đã mở</span>':`<button class="sm" data-chest="${r.id}" ${ready?'':'disabled'}>Mở rương</button>`}
        ${opened?'':`<span class="bar"><i style="width:${Math.min(100,rs.have/r.chest.need*100)}%"></i></span>`}</div>`; }).join('')}</div>
    <div class="box"><h2>Trang phục</h2><div class="wear">${WORLD.outfits.map(o=>{ const ok=worldOutfitUnlocked(o,stars,chests);
      const need=o.need?(o.need.chest?'Mở rương '+escH((WORLD.regions.find(r=>r.id===o.need.chest)||{}).t||''):'Cần '+o.need.stars+' sao'):'';
      return `<button type="button" data-wear="${o.id}" aria-pressed="${o.id===cur}" ${ok?'':'disabled'} title="${ok?'':need}"><i style="background:${o.fill}"></i>${escH(o.t)}${ok?'':` <small>· ${need}</small>`}</button>`; }).join('')}</div></div>`;
  el.querySelectorAll('[data-chest]').forEach(b=>b.onclick=()=>{ const id=b.dataset.chest, reg=WORLD.regions.find(r=>r.id===id);
    if(!worldChestReady(id,gwState().stars||{})) return;
    const s=gwState(); S.set({gw:{...s,chests:{...(s.chests||{}),[id]:today()}}});
    award('game','chest:'+id); toast('Huy hiệu mới: '+reg.chest.badge); extras(); paintOutfit(); });
  el.querySelectorAll('[data-wear]').forEach(b=>b.onclick=()=>{ const s=gwState(); S.set({gw:{...s,outfit:b.dataset.wear}}); extras(); paintOutfit(); });
}

/* Bảng mùa: điểm = sát thương boss + đấu trường; sao là tổng sao game đã đồng bộ lên máy chủ. */
function board(s){
  const el=document.getElementById('board'); if(!el||!s||!s.rows) return;
  const mine=gwState().stars||{}, my=Object.values(mine).reduce((n,v)=>n+v,0);
  const rows=s.rows.slice(0,10);
  el.hidden=false;
  el.innerHTML=`<h2>Bảng xếp hạng mùa ${escH(String((s.season||{}).id||''))}</h2>
    ${rows.length?`<table class="board"><thead><tr><th>#</th><th>Người học</th><th class="n">Điểm mùa</th><th class="n">Sao game</th></tr></thead><tbody>
      ${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${escH(r.name)}</td><td class="n">${r.points}</td><td class="n">★ ${r.stars||0}</td></tr>`).join('')}</tbody></table>`
      :'<p class="lede" style="margin:0">Chưa ai có điểm mùa này. Hạ boss hoặc thắng đấu trường để lên bảng.</p>'}
    <p class="lede" style="margin:10px 0 0;font-size:13px">Điểm mùa = sát thương boss ÷ 6.000 + điểm đấu trường (thắng 3, hoà 1). Bạn đang có ★ ${my} sao game.</p>`;
}

/* ---------- bảng thông tin ---------- */
function panelHTML(p){
  if(!p) return `<div><b>Đi dạo trong vương quốc</b><p>Bấm vào một toà nhà, hoặc dùng phím mũi tên / WASD để đi. Đứng gần toà nào, thông tin hiện ở đây.</p></div>`;
  const st=stateOf(p), vis=state.visited.has(p.id);
  const tag=st==='soon'?'<span class="tag tag--gold">Sắp có</span>':st==='locked'?`<span class="tag">Mở ở cấp ${p.min_level}</span>`
    :vis?'<span class="tag tag--ok">Đã ghé hôm nay</span>':state.user&&!p.local?'<span class="tag tag--gold">+5 xu hôm nay</span>':'';
  const starTag=p.game&&st==='open'?`<span class="tag tag--gold">${GW.starsText(GW.stars(p.id))}</span>`:'';
  const reg=(WORLD.regions.find(r=>r.id===p.region)||{}).t||'';
  return `<div><div>${tag}${starTag}<span class="tag">${escH(reg)}</span></div><b style="display:block;margin-top:8px">${escH(p.t)}</b><p>${escH(p.d)}</p></div>
    ${st==='open'?`<button class="go" id="enter">Vào ${escH(p.t)} →</button>`
      :`<button class="go" disabled>${st==='soon'?'Đang được xây':'Chưa mở'}</button>`}`;
}
function select(p){
  state.sel=p?p.id:null;
  document.querySelectorAll('.pl,.list button').forEach(e=>e.toggleAttribute('data-sel',e.dataset.id===state.sel));
  const pn=document.getElementById('panel'); pn.innerHTML=panelHTML(p);
  const en=document.getElementById('enter'); if(en) en.onclick=()=>enter(p);
}
async function enter(p){
  if(state.user&&!p.local){ try{ const r=await api('/kingdom/visit',{method:'POST',body:{building:p.id}});
      if(r.coins_gained){ toast(`+${r.coins_gained} xu`); state.visited.add(p.id); } }catch(e){} }
  setTimeout(()=>{ location.href=p.href; },state.user?300:0);
}

/* ---------- chuyển động ---------- */
let last=0, raf=0;
function walkTo(pt,place){
  state.target=worldClamp(pt); state.pending=place||null;
  if(REDUCE){ state.pos={...state.target}; arrive(); return; }
  if(!raf){ last=performance.now(); raf=requestAnimationFrame(tick); }
}
function arrive(){
  state.target=null; savePos(); drawMe();
  const p=state.pending||worldNearest(state.pos); state.pending=null;
  if(p) select(p);
}
function tick(now){
  raf=0; const dt=Math.min(.05,(now-last)/1000); last=now;
  let moving=false;
  const k=state.keys;
  if(k.size){ const vx=(k.has('ArrowRight')||k.has('d')?1:0)-(k.has('ArrowLeft')||k.has('a')?1:0),
      vy=(k.has('ArrowDown')||k.has('s')?1:0)-(k.has('ArrowUp')||k.has('w')?1:0);
    if(vx||vy){ const l=Math.hypot(vx,vy); state.pos=worldClamp({x:state.pos.x+vx/l*WORLD.speed*dt,y:state.pos.y+vy/l*WORLD.speed*dt});
      state.target=null; state.pending=null; moving=true; } }
  if(state.target){ const s=worldStep(state.pos,state.target,WORLD.speed*dt); state.pos={x:s.x,y:s.y}; moving=true;
    if(s.arrived){ drawMe(); arrive(); moving=k.size>0; } }
  drawMe();
  if(moving||k.size){ raf=requestAnimationFrame(tick); }
  else { const n=worldNearest(state.pos); if(n&&n.id!==state.sel) select(n); }
}
function svgPoint(ev){ const svg=document.getElementById('svg'), pt=svg.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY;
  const m=svg.getScreenCTM(); return m?pt.matrixTransform(m.inverse()):{x:0,y:0}; }

function selectAndWalk(p){ select(p); walkTo({x:p.x,y:p.y+58},p); }

async function load(){
  try{ const d=await api('/kingdom'); state.srv=d; state.level=d.level||state.level; state.coins=d.coins;
    d.buildings.filter(b=>b.visited).forEach(b=>state.visited.add(b.id)); }catch(e){}
  try{ state.user=await account(); }catch(e){}
}
const CROWN='<svg viewBox="0 0 48 48"><path d="M6 36h36l2-20-10 8-10-14-10 14L4 16z" fill="#F6B91B" stroke="#C98A00" stroke-width="2.4" stroke-linejoin="round"/><rect x="6" y="36" width="36" height="6" rx="2" fill="#E59E0B"/></svg>';
const COMPASS='<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="#FFF3D6" stroke="#C98A3A" stroke-width="4"/><circle cx="32" cy="32" r="21" fill="none" stroke="#E4B867" stroke-width="2"/><path d="M32 12l6 20-6 20-6-20z" fill="#D2562B"/><path d="M12 32l20-6 20 6-20 6z" fill="#F6B91B" opacity=".85"/><circle cx="32" cy="32" r="4" fill="#7A5535"/></svg>';
function hudHTML(got,total){
  const L=level(), pct=L.next?Math.round((S.get().xp-L.cur)/(L.next-L.cur)*100):100;
  return `<div class="hud" aria-hidden="false">
    <div class="hud__title">${CROWN}<div><b>Vương quốc</b><span>Học để xây dựng tương lai</span></div></div>
    <div class="hud__stats"><div><small>Cấp ${L.n}</small><b>${L.n}</b><div class="hud__bar"><i style="width:${Math.max(3,Math.min(100,pct))}%"></i></div></div>
      <div><small>Xu</small><b>${state.coins===null?'—':fmt(state.coins)}</b></div>
      <div><small>Toà đã ghé hôm nay</small><b>${got} / ${total}</b></div>
      <div><small>Mùa giải</small><b id="ss">—</b></div></div>
    <div class="hud__help"><div><b>Bản đồ game</b><span>Bấm vào các toà, hoặc dùng phím mũi tên / WASD</span></div></div>
    <div class="hud__motto"><span>Mỗi toà là một bài học<br>Mỗi bước là một level up</span>${COMPASS}</div></div>`;
}
function render(){
  const play=visitable().filter(p=>!p.local), got=play.filter(p=>state.visited.has(p.id)).length;
  app.innerHTML=`<div class="wd">
    <header><span class="eyebrow">Vương quốc Marketing</span><h1>Đi dạo, rồi vào một toà để chơi.</h1>
      <p class="lede">Mỗi toà nhà là một cách luyện. Ghé mỗi toà có thưởng một lần mỗi ngày được +5 xu (khi đã đăng nhập). Các mini-game chấm sao: sao mới cho XP, đủ sao trong một khu thì mở rương, huy hiệu và áo mới. Xu dùng ở Chợ.</p></header>
    ${state.user?'':`<p class="note"><a href="tai-khoan.html?next=kingdom.html">Đăng nhập</a> để nhận xu khi ghé toà nhà và lưu tiến độ lên máy chủ. Không đăng nhập vẫn đi dạo và vào chơi được.</p>`}
    <div class="stagewrap" id="stagewrap"><div class="stage" id="stage">${drawWorld()}${hudHTML(got,play.length)}</div></div>
    <div class="panel" id="panel" aria-live="polite"></div>
    <section class="extras" id="extras"></section>
    <section class="box" id="board" hidden></section>
    <section><div class="list">${WORLD.places.map(p=>`<button type="button" data-id="${p.id}" data-state="${stateOf(p)}">
        <b>${escH(p.t)}</b><span>${escH(p.d)}</span></button>`).join('')}</div></section>
  </div>`;
  state.pos=savedPos(); drawMe(); select(null); extras(); paintOutfit();
  const sw=document.getElementById('stagewrap'); if(sw&&sw.scrollWidth>sw.clientWidth) sw.scrollLeft=Math.max(0,state.pos.x/WORLD.w*sw.scrollWidth-sw.clientWidth/2);
  tour();
  const svg=document.getElementById('svg');
  svg.addEventListener('pointerdown',ev=>{
    const g=ev.target.closest&&ev.target.closest('.pl');
    if(g){ selectAndWalk(WORLD.places.find(p=>p.id===g.dataset.id)); return; }
    walkTo(svgPoint(ev),null);
  });
  svg.addEventListener('keydown',ev=>{ const g=ev.target.closest&&ev.target.closest('.pl'); if(g&&(ev.key==='Enter'||ev.key===' ')){ ev.preventDefault(); selectAndWalk(WORLD.places.find(p=>p.id===g.dataset.id)); } });
  app.querySelectorAll('.list button').forEach(b=>b.onclick=()=>selectAndWalk(WORLD.places.find(p=>p.id===b.dataset.id)));
  if(state.user) api('/season').then(s=>{ const el=document.getElementById('ss'); if(el) el.textContent=s.season.id; board(s); }).catch(()=>{});
}
const MOVE=new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d']);
document.addEventListener('keydown',e=>{ if(e.target.closest&&e.target.closest('input,textarea,select')) return;
  const k=e.key.length===1?e.key.toLowerCase():e.key; if(!MOVE.has(k)) return; e.preventDefault();
  state.keys.add(k); if(!raf){ last=performance.now(); raf=requestAnimationFrame(tick); } });
document.addEventListener('keyup',e=>{ const k=e.key.length===1?e.key.toLowerCase():e.key; if(state.keys.delete(k)&&!state.keys.size){ savePos(); const n=worldNearest(state.pos); select(n); } });
document.title='Vương quốc Marketing — Tự Học Marketing Case';
load().then(render);
</script>
<script src="assets/js/paper.js?v=5"></script>
