<!doctype html>
<html lang="vi" data-district="brand">
<head>
<base href="/">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bóc tách thương hiệu Coolmate · Brand X-Ray</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F0EDE6'/%3E%3Ctext x='16' y='24' font-family='Georgia,serif' font-size='24' text-anchor='middle' fill='%2315120E'%3EN%3C/text%3E%3C/svg%3E">
<meta name="description" content="Coolmate giải quyết nỗi khó chịu nào của nam giới Việt? Tự trả lời trước, phân tích mở ra sau. D2C Apparel · Việt Nam.">
<meta property="og:title" content="Bóc tách thương hiệu Coolmate · Brand X-Ray">
<meta property="og:description" content="Coolmate giải quyết nỗi khó chịu nào của nam giới Việt? Tự trả lời trước, phân tích mở ra sau. D2C Apparel · Việt Nam.">
<meta property="og:type" content="article">
<meta property="og:url" content="https://nhinthay.pages.dev/thuong-hieu/coolmate.html">
<meta property="og:image" content="https://nhinthay.pages.dev/assets/og/brand-coolmate.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://nhinthay.pages.dev/thuong-hieu/coolmate.html">
<meta property="og:image" content="https://nhinthay.pages.dev/assets/og/default.png">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:site_name" content="Nhìn thấy">
<link rel="stylesheet" href="assets/css/main.css?v=7">
<style>
  .top{display:grid;gap:clamp(18px,3vw,44px);padding:clamp(28px,4vw,64px) 0}
  @media(min-width:960px){.top{grid-template-columns:1.1fr .9fr;align-items:end}}
  .qblock{border-top:var(--rule);padding:clamp(26px,3.6vw,50px) 0;display:grid;gap:clamp(14px,2vw,36px)}
  @media(min-width:900px){.qblock{grid-template-columns:5ch minmax(0,1fr)}}
  .qn{font-family:var(--serif);font-size:2rem;line-height:.9;color:var(--accent);font-weight:300}
  .qt{font-family:var(--serif);font-size:clamp(1.35rem,2.6vw,2.05rem);line-height:1.12;letter-spacing:-.02em;max-width:26ch}
  .hint{margin:10px 0 20px}
  .ans{border-left:2px solid var(--accent);padding-left:20px;margin-top:24px}
  .ans .label{margin-bottom:8px;display:block}
  .ans p{font-size:1.02rem;line-height:1.6;max-width:60ch;margin:0}
  .wrapup{border-top:var(--rule);padding:clamp(34px,5vw,80px) 0}
</style>
</head>
<body>
<noscript><div class="nojs">
  <h2>Trang này cần JavaScript</h2>
  <p>Toàn bộ nội dung — bài học, case study, thư viện nguyên lý — được dựng ngay trong trình duyệt của bạn,
  không gọi về máy chủ nào. Bật JavaScript để đọc; không có tài khoản và không có dữ liệu nào được gửi đi.</p>
</div></noscript>
<main class="wrap" id="app"></main>
<script src="assets/js/core.js?v=8"></script>
<script src="assets/js/data/brands.js?v=7"></script>
<script>
shell('xray.html');
const b = BRANDS.find(x=>x.id===(window.__ID__||qs('id'))) || BRANDS[0];
document.title = `X-Ray · ${b.name} — Nhìn thấy`;
document.documentElement.style.setProperty('--accent', b.color==='#111111'?'#B3320F':b.color);

document.getElementById('app').innerHTML = `
  <section class="top">
    <div data-reveal>
      <div class="label"><a href="xray.html">← Brand X-Ray</a> · ${b.cat} · ${b.market}</div>
      <h1 class="display" style="font-size:clamp(3.2rem,10vw,8.5rem);margin-top:18px">${b.name}</h1>
    </div>
    <div data-reveal-clip data-delay=".08">${plate({color:b.color,mark:b.mark,kicker:'Brand X-Ray',meta:b.market,title:'',shape:'plate--wide'})}</div>
  </section>

  <section style="border-top:var(--rule);padding:clamp(20px,3vw,44px) 0" data-reveal>
    <p class="lede" style="max-width:44ch">Trước khi đọc bất cứ điều gì: hãy tự trả lời. Viết ngắn cũng được, nhưng phải viết.</p>
  </section>

  ${b.q.map((q,i)=>`
    <section class="qblock" data-reveal>
      <div class="qn">${String(i+1).padStart(2,'0')}</div>
      <div>
        <h2 class="qt">${q.q}</h2>
        <p class="caption hint">Gợi ý: ${q.hint}</p>
        <textarea class="field" rows="3" id="a${i}" placeholder="Câu trả lời của bạn…"></textarea>
        <button class="btn btn--ghost" style="margin-top:18px" data-open="${i}">Mở phân tích</button>
        <div class="ans hidden" id="r${i}"><span class="label label--accent">Phân tích</span><p>${q.a}</p></div>
      </div>
    </section>`).join('')}

  <section class="wrapup" data-reveal>
    <div class="grid g2">
      <div>
        <div class="label">Brand promise</div>
        <p class="pull" style="margin-top:12px;font-size:clamp(1.4rem,3vw,2.4rem)">${b.promise}</p>
      </div>
      <div>
        <div class="label">Distinctive assets</div>
        <ul style="list-style:none;margin:14px 0 0;padding:0;display:grid;gap:0">
          ${b.assets.map(a=>`<li style="border-bottom:var(--rule);padding:11px 0;font-size:14.5px">${a}</li>`).join('')}
        </ul>
      </div>
    </div>
    <p class="lede" style="margin-top:clamp(30px,4vw,60px);max-width:34ch;border-left:2px solid var(--accent);padding-left:20px">${b.verdict}</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:34px">
      <button class="btn" id="save">Lưu bài bóc tách vào sổ tay</button>
      <a class="btn btn--ghost" href="xray.html">Chọn thương hiệu khác</a>
    </div>
  </section>`;

document.querySelectorAll('[data-open]').forEach(btn=>{
  btn.onclick=()=>{
    const i=btn.dataset.open, ta=document.getElementById('a'+i);
    if(!ta.value.trim()){ toast('Viết câu trả lời của bạn trước đã'); ta.focus(); return; }
    document.getElementById('r'+i).classList.remove('hidden');
    btn.remove();
  };
});
document.getElementById('save').onclick=()=>{
  const answers=b.q.map((q,i)=>{
    const v=document.getElementById('a'+i).value.trim();
    return v?('• '+q.q+'\n'+v):null;
  }).filter(Boolean);
  if(!answers.length) return toast('Chưa có câu trả lời nào');
  State.push('brands', b.id);
  const s=State.get();
  s.notes.unshift({t:'X-Ray · '+b.name, body:answers.join('\n\n'), when:new Date().toISOString().slice(0,10), kind:'Brand', href:'brand.html?id='+b.id});
  State.set({notes:s.notes}); toast('Đã lưu vào sổ tay');
};
reveal();
</script>
</body></html>
