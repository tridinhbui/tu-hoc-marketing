<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="assets/img/favicon-32.png">
<link rel="stylesheet" href="assets/css/case.css?v=21">
<title>Kể chuyện 60 giây — Tự Học Marketing Case</title>
<meta name="description" content="Mini-game: chọn 3 bằng chứng và xếp thứ tự để trả lời sếp trong 60 giây.">
<style>
:root{--gw-bg:#FBF8F3;--gw-card:#fff;--gw-ink:#24160E;--gw-ink2:rgba(36,22,14,.68);--gw-ink3:rgba(36,22,14,.48);--gw-line:rgba(36,22,14,.12);--gw-soft:rgba(36,22,14,.05);
  --gw-acc:#C85A32;--gw-ok:#3D7A45;--gw-bad:#C0392B;--gw-gold:#B07A12;--gw-gold-soft:rgba(229,178,75,.18);--gw-dark:#2A1A12}
html[data-theme="ivory"]{--gw-bg:#F7F0E6;--gw-card:#FFFDF9}
html[data-theme="dark"]{--gw-bg:#16100C;--gw-card:#221913;--gw-ink:#F4ECE0;--gw-ink2:rgba(244,236,224,.74);--gw-ink3:rgba(244,236,224,.5);--gw-line:rgba(244,236,224,.14);
  --gw-soft:rgba(244,236,224,.07);--gw-acc:#E27A52;--gw-ok:#7DBE86;--gw-bad:#E8786B;--gw-gold:#E5B24B;--gw-gold-soft:rgba(229,178,75,.14);--gw-dark:#0E0906}
html,body{background:var(--gw-bg)!important;color:var(--gw-ink)}
body{margin:0;padding:0!important;font-family:var(--sans,system-ui,sans-serif)}
#app{display:block;max-width:none;padding:0;margin:0}
.g{max-width:1100px;margin:0 auto;padding:clamp(16px,2.6vw,30px) clamp(14px,3vw,34px) 80px;display:grid;gap:16px}
.g>*{min-width:0}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.back{color:var(--gw-ink2);text-decoration:none;font-weight:700;font-size:14px}
.back:hover{color:var(--gw-acc)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gw-acc)}
.g h1{font-family:var(--serif,Georgia,serif);font-weight:600;font-size:clamp(1.5rem,2.8vw,2.1rem);margin:6px 0 4px}
.lede{margin:0;color:var(--gw-ink2);max-width:66ch;line-height:1.6}
.card{background:var(--gw-card);border:1px solid var(--gw-line);border-radius:20px;padding:18px 20px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps i{height:8px;border-radius:9px;background:var(--gw-soft)}
.steps i[data-s="done"]{background:var(--gw-ok)}.steps i[data-s="cur"]{background:var(--gw-acc)}
.brief{border-left:4px solid var(--gw-gold);background:var(--gw-gold-soft);border-radius:0 16px 16px 0;padding:14px 18px}
.brief b{display:block;font-size:16px}.brief p{margin:4px 0 0;color:var(--gw-ink2);line-height:1.55}
.lever{display:grid;grid-template-columns:minmax(140px,1.1fr) 2fr 70px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--gw-line)}
.lever:first-of-type{border-top:0}
.lever b{display:block;font-size:15px}.lever small{color:var(--gw-ink3);font-size:12.5px;line-height:1.4}
.lever input[type=range]{width:100%;accent-color:var(--gw-acc)}
.lever output{font-weight:800;text-align:right}
@media(max-width:560px){.lever{grid-template-columns:1fr 70px}.lever input{grid-column:1/-1;grid-row:2}}
.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.used{font-weight:700}.used.over{color:var(--gw-bad)}.used.under{color:var(--gw-gold)}
.go{border:0;border-radius:12px;background:var(--gw-acc);color:#fff;font:800 13px var(--sans,system-ui);letter-spacing:.05em;text-transform:uppercase;padding:13px 20px;cursor:pointer;text-decoration:none}
.go[disabled]{opacity:.45;cursor:default}
.go--ghost{background:var(--gw-card);color:var(--gw-ink);border:1.5px solid var(--gw-line)}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.cmp h3{margin:0 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gw-ink3)}
.cmp .big{font-size:1.8rem;font-weight:800}
.alloc{display:grid;gap:6px;margin-top:10px;font-size:13.5px}
.alloc div{display:grid;grid-template-columns:100px 1fr 42px;gap:8px;align-items:center}
.alloc i{display:block;height:8px;border-radius:9px;background:var(--gw-acc)}
.alloc .opt i{background:var(--gw-ok)}
.note{border-left:4px solid var(--gw-acc);background:var(--gw-soft);border-radius:0 14px 14px 0;padding:12px 16px;font-size:14.5px;line-height:1.55}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist th,.hist td{text-align:left;padding:9px 6px;border-top:1px solid var(--gw-line)}
.hist th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gw-ink3);border-top:0}
.gw-result{text-align:center;padding:10px}
.gw-stars{font-size:3rem;letter-spacing:.2em;color:var(--gw-gold)}
.gw-result p{margin:6px 0;color:var(--gw-ink2)}
.gw-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.gw-btn{display:inline-block;border-radius:12px;border:1.5px solid var(--gw-line);padding:12px 18px;font-weight:800;font-size:13px;text-decoration:none;color:var(--gw-ink);background:var(--gw-card)}
.mx{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:stretch}
.mx__y{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-size:12.5px;font-weight:700;color:var(--gw-ink2);display:flex;justify-content:space-between}
.mx__grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{aspect-ratio:1/1;border-radius:12px;border:2px solid transparent;background:color-mix(in srgb,var(--gw-acc) calc(var(--d)*70%),var(--gw-soft));position:relative;cursor:pointer;display:grid;place-items:center;font:800 13px var(--sans,system-ui);color:var(--gw-ink);padding:0}
.cell:hover{border-color:var(--gw-acc)}
.cell[data-me]{border-color:var(--gw-ink);box-shadow:0 0 0 3px rgba(200,90,50,.25)}
.cell .riv{position:absolute;inset:auto 4px 4px auto;font-size:11px;background:var(--gw-ink);color:var(--gw-bg);border-radius:6px;padding:2px 6px}
.cell .you{position:absolute;inset:4px auto auto 4px;font-size:11px;background:var(--gw-acc);color:#fff;border-radius:6px;padding:2px 6px}
.cell[data-own="me"]{outline:3px solid var(--gw-ok);outline-offset:-3px}
.mx__x{display:flex;justify-content:space-between;grid-column:2;font-size:12.5px;font-weight:700;color:var(--gw-ink2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--gw-ink2)}
.cards{display:grid;gap:10px}
.sc{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;border:1.5px solid var(--gw-line);background:var(--gw-card);color:var(--gw-ink);border-radius:16px;padding:14px;cursor:pointer;font:inherit;line-height:1.5}
.sc:hover{border-color:var(--gw-acc)}
.sc .no{width:30px;height:30px;border-radius:50%;border:2px solid var(--gw-line);display:grid;place-items:center;font-weight:800;color:var(--gw-ink3)}
.sc[aria-pressed="true"]{border-color:var(--gw-acc);box-shadow:0 0 0 3px rgba(200,90,50,.14)}
.sc[aria-pressed="true"] .no{background:var(--gw-acc);border-color:var(--gw-acc);color:#fff}
.sc small{display:block;margin-top:6px;color:var(--gw-ink3)}
.sc[data-t="2"] .no{box-shadow:0 0 0 0}
.tierchip{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:3px 9px;margin-right:6px;background:var(--gw-soft);color:var(--gw-ink2)}
.tierchip[data-t="2"]{background:rgba(61,122,69,.16);color:var(--gw-ok)}.tierchip[data-t="1"]{background:var(--gw-gold-soft);color:var(--gw-gold)}.tierchip[data-t="-1"]{background:rgba(192,57,43,.14);color:var(--gw-bad)}
</style>
<link rel="stylesheet" href="assets/css/paper.css?v=12">
</head>
<body>
<noscript><div class="nojs"><h1 class="h2">Trang này cần JavaScript</h1></div></noscript>
<main id="app"></main>
<script src="assets/js/data/lessons.js?v=8"></script>
<script src="assets/js/data/principles.js?v=8"></script>
<script src="assets/js/data/curriculum.js?v=4"></script>
<script src="assets/js/data/bai-index.js?v=11"></script>
<script src="assets/js/app.js?v=21"></script>
<script src="assets/js/games/g6-story.js?v=1"></script>
<script src="assets/js/games/frame.js?v=1"></script>
<script>
appShell('');
const app=document.getElementById('app'), GID='g6';
let picks=[], cur=[], shown=false, done=null;
const pct=x=>Math.round(x*100)+'%';
const TIER={2:'Bằng chứng kiểm chứng được',1:'Giả thuyết có cơ sở',0:'Chung chung','-1':'Phản tác dụng'};
const cardOf=(r,id)=>r.cards.find(c=>c.id===id);
function render(){
  const qi=picks.length-(shown?1:0), finished=picks.length>=G6.rounds.length&&!shown, r=G6.rounds[Math.min(qi<0?0:qi,G6.rounds.length-1)];
  const head=`<div class="top"><a class="back" href="kingdom.html">← Về bản đồ vương quốc</a><span class="eyebrow">Mini-game · số liệu minh hoạ</span></div>
    <header><h1>Kể chuyện 60 giây</h1>
      <p class="lede">Sếp hỏi một câu. Có 6 mảnh bằng chứng; chọn <b>đúng 3</b> theo thứ tự bạn sẽ nói. Mảnh đầu có trọng số lớn nhất, nên nói ý mạnh nhất trước.
      Số liệu là minh hoạ; mô hình cố định, không may rủi.</p></header>
    <div class="steps">${G6.rounds.map((_,i)=>`<i data-s="${i<picks.length?'done':(i===picks.length&&!finished&&!shown)?'cur':''}"></i>`).join('')}</div>`;
  if(finished){
    const score=G6.score(picks), stars=G6.stars(score); if(!done) done=GW.report(GID,stars,score);
    app.innerHTML=`<div class="g">${head}<div class="card">${GW.resultHTML(done,{goal:`Điểm của bạn: <b>${pct(score)}</b> so với tối ưu. Mốc sao: 55% · 80% · 99%. Chọn một mảnh phản tác dụng kéo điểm xuống rất nhiều.`})}</div>
      <div class="bar"><button class="go go--ghost" id="again">Chơi lại</button><a class="go" href="kingdom.html">Về bản đồ</a></div></div>`;
    document.getElementById('again').onclick=()=>{ picks=[]; cur=[]; shown=false; done=null; render(); };
    return;
  }
  if(shown){
    const i=picks.length-1, rr=G6.rounds[i], mine=picks[i], b=G6.best(rr);
    const list=ids=>ids.map((id,k)=>{ const c=cardOf(rr,id); return `<div class="sc" style="cursor:default" data-t="${c.tier}"><span class="no">${k+1}</span><span><span class="tierchip" data-t="${c.tier}">${TIER[c.tier]}</span>${escH(c.t)}<small>${escH(c.why)}</small></span></div>`; }).join('');
    app.innerHTML=`<div class="g">${head}
      <div class="brief"><b>Sếp hỏi: “${escH(rr.ask)}”</b></div>
      <div class="cmp"><div class="card"><h3>Câu trả lời của bạn · ${pct(Math.max(0,G6.points(rr,mine)/b.p))}</h3><div class="cards">${list(mine)}</div></div>
        <div class="card"><h3>Cách xếp tốt nhất</h3><div class="cards">${list(b.ids)}</div></div></div>
      <div class="bar"><span></span><button class="go" id="next">${picks.length>=G6.rounds.length?'Xem kết quả':'Câu hỏi kế →'}</button></div></div>`;
    document.getElementById('next').onclick=()=>{ shown=false; cur=[]; render(); };
    return;
  }
  app.innerHTML=`<div class="g">${head}
    <div class="brief"><b>Câu ${qi+1}/${G6.rounds.length} · Sếp hỏi: “${escH(r.ask)}”</b><p>Bấm lần lượt 3 mảnh theo thứ tự bạn sẽ nói. Bấm lại để bỏ chọn.</p></div>
    <div class="cards">${r.cards.map(c=>{ const k=cur.indexOf(c.id);
      return `<button type="button" class="sc" data-id="${c.id}" aria-pressed="${k>=0}"><span class="no">${k>=0?k+1:''}</span><span>${escH(c.t)}</span></button>`; }).join('')}</div>
    <div class="bar"><span class="used">Đã chọn ${cur.length}/3</span><button class="go" id="commit" ${cur.length===3?'':'disabled'}>Chốt câu trả lời</button></div></div>`;
  app.querySelectorAll('.sc').forEach(b=>b.onclick=()=>{ const id=b.dataset.id, k=cur.indexOf(id);
    if(k>=0) cur.splice(k,1); else if(cur.length<3) cur.push(id); render(); });
  document.getElementById('commit').onclick=()=>{ picks.push([...cur]); shown=true; render(); };
}
document.title='Kể chuyện 60 giây — Tự Học Marketing Case';
render();
</script>
</body>
</html>
