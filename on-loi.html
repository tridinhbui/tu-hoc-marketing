<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23fff%27/%3E%3Ctext x=%2716%27 y=%2724%27 font-family=%27Georgia,serif%27 font-size=%2722%27 text-anchor=%27middle%27 fill=%27%230F1B2D%27%3EM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/case.css?v=3">
<title>Ôn lỗi — Tự Học Marketing Case</title>
<meta name="description" content="Mỗi lỗi được lưu theo mã có tên và nhắc ôn sau 1, 3 và 7 ngày. Lỗi lặp lại ba lần trở lên thành bài luyện bắt buộc.">
</head>
<body>
<noscript><div class="nojs"><h1 class="h2">Trang này cần JavaScript</h1><p>Bài học và tiến độ được dựng ngay trong trình duyệt của bạn, không gửi về máy chủ nào.</p></div></noscript>
<main class="wrap narrow" id="app"></main>
<script src="assets/js/data/lessons.js?v=7"></script>
<script src="assets/js/data/principles.js?v=7"></script>
<script src="assets/js/data/curriculum.js?v=2"></script>
<script src="assets/js/data/bai-index.js?v=1"></script>
<script src="assets/js/data/drills.js?v=2"></script>
<script src="assets/js/data/exams.js?v=7"></script>
<script src="assets/js/app.js?v=13"></script>
<script>
appShell('on-loi.html');
function render(){
  const s=S.get(), due=dueErrors(s), must=mustDrill(s), all=Object.entries(s.errors);
  const row=([c,e],btn)=>`<li style="padding:14px 0">
    <div class="row between"><b>${escH(ERRORS[c]||c)}</b><span class="mono">${e.count} lần</span></div>
    <div class="small muted" style="margin:4px 0 8px">Mã ${c} · lần đầu ${e.first} · ${e.due?'ôn lại ngày '+e.due:'đã ôn đủ 1 · 3 · 7 ngày'}</div>
    <div class="row">${e.lessons.map(k=>{const m=lessonMeta(k);return m?`<a class="small" href="bai.html?id=${encodeURIComponent(k)}#p2">Làm lại: ${escH(m.t)} →</a>`:''}).join(' ')}
      ${btn?`<button class="btn btn--ghost" data-rev="${c}" style="margin-left:auto">Đã ôn · +${XP.review} XP</button>`:''}</div></li>`;
  document.getElementById('app').innerHTML=`
  <section class="section">
    <span class="mono mono--red">Ôn lỗi</span>
    <h1 class="h1" style="margin:14px 0 16px">Lỗi của bạn,<br><em>có tên và có lịch.</em></h1>
    <p class="lede">Mỗi lần làm sai bài tính số, lỗi được lưu theo mã. App nhắc ôn sau 1, 3 rồi 7 ngày.
      Lỗi lặp lại từ ba lần trở lên thành bài luyện bắt buộc.</p>
  </section>
  ${must.length?`<section class="section"><span class="mono mono--red">Bài luyện bắt buộc · ${must.length}</span>
    <ul class="list" style="margin-top:10px">${must.map(e=>row([e.code,e],false)).join('')}</ul>
    <p class="small muted" style="margin-top:10px">Làm lại đúng bài gốc. Mỗi lần làm sai tiếp, bộ đếm tăng — không có cách “xoá” lỗi ngoài làm đúng.</p></section>`:''}
  <section class="section"><span class="mono mono--ink">Đến hạn hôm nay · ${due.length}</span>
    ${due.length?`<ul class="list" style="margin-top:10px">${due.map(e=>row([e.code,e],true)).join('')}</ul>`
      :'<p class="muted" style="margin-top:10px">Không có lỗi nào đến hạn hôm nay.</p>'}</section>
  <section class="section"><span class="mono mono--ink">Tất cả lỗi đã ghi · ${all.length}</span>
    ${all.length?`<ul class="list" style="margin-top:10px">${all.map(x=>row(x,false)).join('')}</ul>`
      :`<p class="muted" style="margin-top:10px">Chưa có lỗi nào. Bài tính số hiện có ở ${Object.keys(DRILLS).length} bài — bắt đầu từ bài đầu tiên trong số đó.</p>
       ${(()=>{const k=Object.keys(DRILLS).find(x=>lessonOpen(x,s));return k?`<a class="btn" style="margin-top:14px" href="bai.html?id=${encodeURIComponent(k)}#p2">Làm thử: ${escH(lessonMeta(k).t)}</a>`:''})()}`}</section>`;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-rev]'); if(!b) return; reviewed(b.dataset.rev); render();});
render();
</script>
</body>
</html>
