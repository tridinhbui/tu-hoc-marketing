<style>

    --r-act-bg:#FCE9E0;--r-act:#B8451F;--r-field:#F1ECE4;--r-pill:#F6F1E9;--page:#F7F0E6;}

  .rail__top{flex:none;padding:16px 12px 4px;position:relative;z-index:5}

  .rail__search{position:relative;margin:0 0 10px}

  .sres a{display:block;padding:9px 11px;border-radius:9px;color:var(--r-ink);text-decoration:none;font:500 13.5px/1.3 var(--sans)}

    .rail[data-open]{transform:none}
    .mbar{display:flex;align-items:center;position:fixed;top:0;left:0;right:0;height:56px;z-index:50;padding:0 8px 0 64px;background:var(--r-bg);border-bottom:1px solid var(--r-line);color:var(--r-ink);font:700 14px var(--sans)}

    .rail__scrim{position:fixed;inset:0;z-index:58;background:rgba(0,0,0,.5)}
    .rail__scrim[data-open]{display:block}
  }
  @media(prefers-reduced-motion:reduce){.rail,.stage__load{transition:none}}

  /* ===== thanh điều hướng v2: đều chữ, thẳng hàng, co giãn theo cỡ màn hình ===== */

  .nav svg.i{width:19px;height:19px}

    .nav .tag{font-size:0;width:8px;height:8px;padding:0;border-radius:50%;flex:none}

  ] },
  { t: 'Thực hành', ic: 'flask', items: [
    ['Phòng thử thách', 'quiz.html', 'cap', ['quiz.html', 'challenge.html', 'luyen.html'], 'new'],
    ['Thi vượt chặng', 'thi.html', 'trophy', ['thi.html']],
    ['Game Kingdom', 'kingdom.html', 'game', ['kingdom.html', 'tro-choi.html', 'game-ngan-sach.html', 'game-chon-tep.html', 'game-phieu-ro.html', 'game-ban-do-dinh-vi.html', 'game-ke-chuyen.html', 'game-chan-doan.html', 'game-lich-noi-dung.html', 'game-doc-studio.html', 'game-khung-hoang.html', 'boss.html', 'pvp.html', 'shop.html'], 'hot'],
    ['Luyện phỏng vấn', 'phong-van.html', 'brief', ['phong-van.html', 'interview.html']],
    ['Marketing Lab', 'lab.html', 'chart', ['lab.html', 'lab-meta.html'], 'new'],
    ['Mô phỏng công cụ', 'unit-economics.html', 'term', ['unit-economics.html']],
  ] },
  { t: 'Cộng đồng', ic: 'users', items: [
    ['Thế giới & tạp chí', 'world.html', 'compass', ['world.html', 'tap-chi.html', 'timeline.html', 'collections.html', 'taste.html', 'gioi-thieu.html']],
    ['Thống kê', 'thong-ke.html', 'chart', ['thong-ke.html', 'bang-xep-hang.html']],
  ] },
];
/* Chỉ nhận tên file .html trong cùng thư mục — không cho `p` trỏ ra ngoài (chống open-redirect). */
const SAFE = /^[a-z0-9][a-z0-9-]*\.html(\?[A-Za-z0-9_.:=&%-]*)?$/i;
const frame = document.getElementById('frame'), rail = document.getElementById('rail');
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TAG = { new: '<span class="tag tag--new">Tin mới</span>', hot: '<span class="tag tag--hot">Hot</span>', chk: '<span class="tag tag--chk">Check-in</span>', due: '<em class="due" hidden id="due"></em>' };
const link = ([t, h, ic, m, tag]) => `<a href="${h}" data-go data-m="${m.join(',')}">${ico(ic)}<span>${t}</span>${TAG[tag] || ''}</a>`;
const open = JSON.parse(localStorage.getItem('thmc.navShut') || '{}');
document.getElementById('nav').innerHTML =
  TOP.map(link).join('') +
  GROUPS.map((g, gi) => `<div class="grp" data-g="${gi}" ${open[gi] ? 'data-shut' : ''}>
    <button class="grp__h" type="button" aria-expanded="${open[gi] ? 'false' : 'true'}">${ico(g.ic, '')}<span>${g.t}</span>${CHEV}</button>
    <div class="grp__body ${g.box ? 'box' : ''}">${g.items.map((it, ii) => Array.isArray(it) ? link(it)
      : `<div class="has" data-has="${gi}-${ii}"><button type="button" class="nv">${ico(it.ic)}<span>${it.t}</span>${CHEV}</button>
          <div class="sub">${it.kids.map(link).join('')}</div></div>`).join('')}</div></div>`).join('');

document.getElementById('nav').addEventListener('click', (e) => {
  const h = e.target.closest('.grp__h');
  if (h) { const g = h.parentElement, shut = g.toggleAttribute('data-shut'); h.setAttribute('aria-expanded', String(!shut));
    open[g.dataset.g] = shut; try { localStorage.setItem('thmc.navShut', JSON.stringify(open)); } catch (x) {} return; }
  const hs = e.target.closest('.has > button');
  if (hs) { const p = hs.parentElement; p.classList.toggle('on'); p.querySelector('.sub').classList.toggle('on'); }
});

function target() {
  const p = new URLSearchParams(location.search).get('p') || 'hoc.html';
  return SAFE.test(p) ? p : 'hoc.html';
}
function mark(file) {
  rail.querySelectorAll('a[data-m]').forEach((a) => {
    const on = a.dataset.m.split(',').includes(file);
    if (on) { a.setAttribute('aria-current', 'page'); const s = a.closest('.sub'); if (s) { s.classList.add('on'); s.parentElement.classList.add('on'); } }
    else a.removeAttribute('aria-current');
  });
}
function refreshMe() {
  try {
    const s = S.get(), lv = level(s.xp);
    const pct = lv.next ? Math.round((s.xp - lv.cur) / (lv.next - lv.cur) * 100) : 100;
    document.getElementById('sm').textContent = `${fmt(s.xp)} XP · cấp ${lv.n}${s.streak ? ' · ' + s.streak + ' ngày' : ''}`;
    document.getElementById('xpbar').style.width = Math.max(0, Math.min(100, pct)) + '%';
    const due = typeof dueErrors === 'function' ? dueErrors(s).length : 0, el = document.getElementById('due');
    if (el) { el.hidden = !due; el.textContent = due > 9 ? '9+' : due; }
  } catch (e) { /* thiếu dữ liệu thì để trống, không làm hỏng khung */ }
}
function loadInto(path) {
  if (!SAFE.test(path)) path = 'hoc.html';
  const bar = document.getElementById('load'); bar.style.width = '35%';
  frame.src = path;
}
frame.addEventListener('load', () => {
  document.getElementById('load').style.width = '100%';
  setTimeout(() => { document.getElementById('load').style.width = '0'; }, 250);
  let file = 'hoc.html', q = '';
  try {
    const l = frame.contentWindow.location;
    if (l.href === 'about:blank') return;
    file = (l.pathname.split('/').pop() || 'hoc.html'); q = l.search;
    if (!/\.html$/.test(file)) file += '.html';
    if (frame.contentDocument.title) document.title = frame.contentDocument.title;
  } catch (e) { return; }
  mark(file);
  if (typeof Social !== 'undefined') Social.page(file);
  const url = `app.html?p=${encodeURIComponent(file + q)}`;
  if (location.search !== url.slice('app.html'.length)) history.replaceState(null, '', url);
  refreshMe();
  closeDrawer();
});
/* Bấm mục trên thanh: chỉ đổi khung bên trong, không điều hướng cả trang. */
rail.addEventListener('click', (e) => {
  const a = e.target.closest('a[data-go]'); if (!a) return;
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
  e.preventDefault();
  const href = a.getAttribute('href');
  if (typeof Social !== 'undefined') Social.track('nav', href);
  if (SAFE.test(href)) loadInto(href);
});
window.addEventListener('storage', refreshMe);
/* Trang bàn làm việc (core.js) báo có thay đổi → đồng bộ lên máy chủ. */
window.addEventListener('message', (e) => { if (e.origin === location.origin && e.data && e.data.thmc === 'sync' && typeof scheduleSync === 'function') scheduleSync(); });
setInterval(refreshMe, 4000);

/* ---- Tìm kiếm nhanh (⌘K): mục điều hướng + bài học ---- */
const sq = document.getElementById('sq'), sres = document.getElementById('sres');
let hits = [], sel = 0;
const flat = [...TOP, ...GROUPS.flatMap((g) => g.items.flatMap((i) => (Array.isArray(i) ? [i] : i.kids)))];
function runSearch() {
  const q = typeof normVN === 'function' ? normVN(sq.value.trim()) : sq.value.trim().toLowerCase();
  if (!q) { sres.classList.remove('on'); return; }
  const nav = flat.filter((i) => (typeof normVN === 'function' ? normVN(i[0]) : i[0].toLowerCase()).includes(q)).slice(0, 4)
    .map((i) => ({ t: i[0], s: 'Mục điều hướng', h: i[1] }));
  let les = [];
  try { les = ALL.filter((x) => lessonHay(x.key).includes(q)).slice(0, 7).map((x) => { const m = lessonMeta(x.key); return { t: m ? m.t : x.key, s: x.mod.t, h: 'bai.html?id=' + encodeURIComponent(x.key) }; }); } catch (e) {}
  hits = [...nav, ...les]; sel = 0;
  sres.innerHTML = hits.length ? hits.map((h, i) => `<a href="${esc(h.h)}" data-i="${i}" class="${i === 0 ? 'sel' : ''}">${esc(h.t)}<small>${esc(h.s)}</small></a>`).join('') : '<p>Không có kết quả.</p>';
  sres.classList.add('on');
}
function goHit(i) { const h = hits[i]; if (!h) return; sq.value = ''; sres.classList.remove('on'); loadInto(h.h); closeDrawer(); }
sq.addEventListener('input', runSearch);
sq.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, Math.min(hits.length - 1, sel + (e.key === 'ArrowDown' ? 1 : -1)));
    sres.querySelectorAll('a').forEach((a, i) => a.classList.toggle('sel', i === sel)); }
  else if (e.key === 'Enter') { e.preventDefault(); goHit(sel); }
  else if (e.key === 'Escape') { sq.value = ''; sres.classList.remove('on'); sq.blur(); }
});
sres.addEventListener('mousedown', (e) => { const a = e.target.closest('a[data-i]'); if (a) { e.preventDefault(); goHit(+a.dataset.i); } });
document.addEventListener('click', (e) => { if (!e.target.closest('.rail__search')) sres.classList.remove('on'); });
document.addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); sq.focus(); sq.select(); } });

/* Ngăn kéo trên điện thoại. */
const openBtn = document.getElementById('open'), scrim = document.getElementById('scrim');
function openDrawer() { rail.setAttribute('data-open', ''); scrim.setAttribute('data-open', ''); openBtn.setAttribute('aria-expanded', 'true'); openBtn.style.visibility = 'hidden'; }
function closeDrawer() { rail.removeAttribute('data-open'); scrim.removeAttribute('data-open'); openBtn.setAttribute('aria-expanded', 'false'); openBtn.style.visibility = ''; }
openBtn.onclick = () => (rail.hasAttribute('data-open') ? closeDrawer() : openDrawer());
scrim.onclick = closeDrawer;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

/* Tên người dùng từ phiên đăng nhập thật. Chưa có phiên (API đã trả lời) thì về trang đăng nhập — khung không hiện cho khách. */
account().then((u) => {
  if (u && u.name) {
    document.getElementById('nm').textContent = u.name;
    document.getElementById('av').textContent = (u.name.trim()[0] || 'M').toUpperCase();
    if (typeof Social !== 'undefined') Social.init(u);
  } else if (API.on === true) {
    location.replace('dang-nhap.html?next=' + encodeURIComponent('app.html?p=' + encodeURIComponent(target())));
  }
});
refreshMe();
loadInto(target());
</script>
<script src="assets/js/yy.js?v=4"></script>
<script>
/* Ý Ý: một bong bóng duy nhất ở khung app (không dựng lại khi đổi trang) + lời nhắc ngắn, một lần cho mỗi trang mỗi phiên. */

  const TIPS = {

  function start(){

      greet: 'Chào bạn, mình là Ý Ý. Mình giải thích thuật ngữ, gợi ý bài nên học và chỉ đường trong app. Bạn muốn hỏi gì?',
      chips: ['CAC là gì?', 'Nên học gì trước?', 'Case có bấm giờ là gì?', 'Làm sao lên cấp nhanh?'],

        f.addEventListener('load', fire);

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
