<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="assets/img/favicon-32.png">
<link rel="stylesheet" href="assets/css/case.css?v=21f6">
<title>Bài xếp lớp — Tự Học Marketing Case</title>
<meta name="description" content="20 câu trải qua các chặng. Đạt từ 80% ở chặng nào thì chặng đó được ghi công, không phải học lại.">
<link rel="stylesheet" href="assets/css/paper.css?v=12">
<link rel="stylesheet" href="assets/css/atelier.css?v=27z1">
</head>
<body>
<noscript><div class="nojs"><h1 class="h2">Trang này cần JavaScript</h1></div></noscript>
<main class="wrap narrow" id="app"></main>
<script src="assets/js/data/lessons.js?v=8"></script>
<script src="assets/js/data/principles.js?v=8"></script>
<script src="assets/js/data/curriculum.js?v=4"></script>
<script src="assets/js/data/bai-index.js?v=11"></script>
<script src="assets/js/data/drills.js?v=3"></script>
<script src="assets/js/data/cases.js?v=7"></script>
<script src="assets/js/app.js?v=21"></script>
<script src="assets/js/quizkit.js?v=2"></script>
<script>

appShell('xep-lop.html');
const app=document.getElementById('app');
(async()=>{
  if(!await needLogin(app,'Bài xếp lớp')) return;
  app.innerHTML=`<section class="section"><span class="mono mono--red">Bài xếp lớp</span>
    <h1 class="h1" style="margin:14px 0 10px">Đã biết rồi thì<br><em>không phải học lại.</em></h1>
    <p class="lede">Vài câu cốt lõi của mỗi chặng. Đạt từ 80% ở chặng nào, mọi bài chặng đó được ghi công. Làm một lần; muốn làm lại thì đợi 7 ngày.</p>
    <button class="btn" id="start" style="margin-top:16px">Bắt đầu</button></section><section class="section" id="ex" hidden></section>`;
  document.getElementById('start').onclick=async()=>{
    let d; try{ d=await api('/placement'); }catch(e){ toast(e.message==='cooldown'?'Bạn vừa làm bài xếp lớp. Đợi 7 ngày để làm lại.':'Chưa mở được bài'); return; }
    const ex=document.getElementById('ex'); ex.hidden=false; document.getElementById('start').remove();
    ex.innerHTML=`<div id="qs"></div><button class="btn" id="go" style="margin-top:16px">Nộp bài</button>`;
    const box=document.getElementById('qs'); QK.render(box,d.items);
    document.getElementById('go').onclick=async()=>{
      const r=await api('/placement',{method:'POST',body:{attempt_id:d.attempt_id,answers:QK.answers(box)}});
      document.getElementById('go').remove();
      box.insertAdjacentHTML('beforebegin',`<div class="note" style="margin-bottom:12px">${r.stages.map(s=>`Chặng ${escH(s.stage.slice(1))}: ${s.score}/${s.total} ${s.passed?'— <b>đạt, đã ghi công</b>':''}`).join('<br>')}
        <br>${r.credited?`Đã ghi công ${r.credited} bài. `:'Chưa chặng nào đạt 80% — bắt đầu từ chặng 1 là hợp lý nhất.'}</div>`);
    };
  };
})();

</script>
<script src="assets/js/paper.js?v=7"></script>
</body>
</html>
