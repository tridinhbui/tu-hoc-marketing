<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="assets/img/favicon-32.png">
<link rel="stylesheet" href="assets/css/case.css?v=21f6">
<title>Lịch nội dung 30 ngày — Tự Học Marketing Case</title>
<meta name="description" content="Bài tập: xếp lịch nội dung 30 ngày phục vụ mục tiêu, vừa sức sản xuất và có nhịp hợp lý.">
<style>
:root{--gw-bg:#FBF8F3;--gw-card:#fff;--gw-ink:#24160E;--gw-ink2:rgba(36,22,14,.68);--gw-ink3:rgba(36,22,14,.48);--gw-line:rgba(36,22,14,.12);--gw-soft:rgba(36,22,14,.05);
  --gw-acc:#C85A32;--gw-ok:#3D7A45;--gw-bad:#C0392B;--gw-gold:#B07A12;--gw-gold-soft:rgba(229,178,75,.18);--gw-dark:#2A1A12}
html[data-theme="ivory"]{--gw-bg:#F7F0E6;--gw-card:#FFFDF9}
html[data-theme="dark"]{--gw-bg:#16100C;--gw-card:#221913;--gw-ink:#F4ECE0;--gw-ink2:rgba(244,236,224,.74);--gw-ink3:rgba(244,236,224,.5);--gw-line:rgba(244,236,224,.14);
  --gw-soft:rgba(244,236,224,.07);--gw-acc:#E27A52;--gw-ok:#7DBE86;--gw-bad:#E8786B;--gw-gold:#E5B24B;--gw-gold-soft:rgba(229,178,75,.14);--gw-dark:#0E0906}
html,body{background:var(--gw-bg)!important;color:var(--gw-ink)}
body{margin:0;padding:0!important;font-family:var(--sans,system-ui,sans-serif)}
#app{display:block;max-width:none;padding:0;margin:0}
.g{max-width:1100px;margin:0 auto;padding:clamp(16px,2.6vw,30px) clamp(14px,3vw,34px) 80px;display:grid;gap:16px}
.g>*{min-width:0}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.back{color:var(--gw-ink2);text-decoration:none;font-weight:700;font-size:14px}
.back:hover{color:var(--gw-acc)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gw-acc)}
.g h1{font-family:var(--serif,'Fraunces',serif);font-weight:600;font-size:clamp(1.5rem,2.8vw,2.1rem);margin:6px 0 4px}
.lede{margin:0;color:var(--gw-ink2);max-width:66ch;line-height:1.6}
.card{background:var(--gw-card);border:1px solid var(--gw-line);border-radius:20px;padding:18px 20px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps i{height:8px;border-radius:9px;background:var(--gw-soft)}
.steps i[data-s="done"]{background:var(--gw-ok)}.steps i[data-s="cur"]{background:var(--gw-acc)}
.brief{border-left:4px solid var(--gw-gold);background:var(--gw-gold-soft);border-radius:0 16px 16px 0;padding:14px 18px}
.brief b{display:block;font-size:16px}.brief p{margin:4px 0 0;color:var(--gw-ink2);line-height:1.55}
.lever{display:grid;grid-template-columns:minmax(140px,1.1fr) 2fr 70px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--gw-line)}
.lever:first-of-type{border-top:0}
.lever b{display:block;font-size:15px}.lever small{color:var(--gw-ink3);font-size:12.5px;line-height:1.4}
.lever input[type=range]{width:100%;accent-color:var(--gw-acc)}
.lever output{font-weight:800;text-align:right}
@media(max-width:560px){.lever{grid-template-columns:1fr 70px}.lever input{grid-column:1/-1;grid-row:2}}
.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.used{font-weight:700}.used.over{color:var(--gw-bad)}.used.under{color:var(--gw-gold)}
.go{border:0;border-radius:12px;background:var(--gw-acc);color:#fff;font:800 13px var(--sans,system-ui);letter-spacing:.05em;text-transform:uppercase;padding:13px 20px;cursor:pointer;text-decoration:none}
.go[disabled]{opacity:.45;cursor:default}
.go--ghost{background:var(--gw-card);color:var(--gw-ink);border:1.5px solid var(--gw-line)}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.cmp h3{margin:0 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gw-ink3)}
.cmp .big{font-size:1.8rem;font-weight:800}
.alloc{display:grid;gap:6px;margin-top:10px;font-size:13.5px}
.alloc div{display:grid;grid-template-columns:100px 1fr 42px;gap:8px;align-items:center}
.alloc i{display:block;height:8px;border-radius:9px;background:var(--gw-acc)}
.alloc .opt i{background:var(--gw-ok)}
.note{border-left:4px solid var(--gw-acc);background:var(--gw-soft);border-radius:0 14px 14px 0;padding:12px 16px;font-size:14.5px;line-height:1.55}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist th,.hist td{text-align:left;padding:9px 6px;border-top:1px solid var(--gw-line)}
.hist th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gw-ink3);border-top:0}
.gw-result{text-align:center;padding:10px}
.gw-stars{font-size:3rem;letter-spacing:.2em;color:var(--gw-gold)}
.gw-result p{margin:6px 0;color:var(--gw-ink2)}
.gw-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.gw-btn{display:inline-block;border-radius:12px;border:1.5px solid var(--gw-line);padding:12px 18px;font-weight:800;font-size:13px;text-decoration:none;color:var(--gw-ink);background:var(--gw-card)}
.chk{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.chk button{text-align:left;border:1.5px solid var(--gw-line);background:var(--gw-card);color:var(--gw-ink);border-radius:14px;padding:12px 14px;cursor:pointer;font:inherit;font-weight:700;font-size:14px;line-height:1.4}
.chk button:hover:not([disabled]){border-color:var(--gw-acc)}
.chk button[disabled]{opacity:.5;cursor:default}
.chk button[data-ran]{border-color:var(--gw-ok);background:rgba(61,122,69,.1)}
.res{border:1px solid var(--gw-line);border-radius:14px;padding:12px 14px;background:var(--gw-card)}
.res h3{margin:0 0 6px;font-size:13px}
.res table{width:100%;border-collapse:collapse;font-size:14px}.res td{padding:6px 4px;border-top:1px solid var(--gw-line)}.res td:first-child{color:var(--gw-ink2);width:42%}
.opts2{display:grid;gap:8px}
.opts2 label{display:flex;gap:10px;align-items:center;border:1.5px solid var(--gw-line);border-radius:12px;padding:10px 12px;cursor:pointer;background:var(--gw-card)}
.opts2 label:has(input:checked){border-color:var(--gw-acc);box-shadow:0 0 0 3px rgba(200,90,50,.14)}
.cal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.day{aspect-ratio:1/1;border-radius:10px;border:1.5px solid var(--gw-line);background:var(--gw-card);color:var(--gw-ink);cursor:pointer;display:grid;place-items:center;font:700 12px var(--sans,system-ui);padding:2px;line-height:1.1}
.day small{display:block;font-size:10px;color:var(--gw-ink3);font-weight:600}
.day[data-p="aware"]{background:rgba(63,126,166,.18);border-color:#3F7EA6}
.day[data-p="proof"]{background:rgba(61,122,69,.18);border-color:#3D7A45}
.day[data-p="sell"]{background:rgba(200,90,50,.2);border-color:var(--gw-acc)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--gw-ink2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:6px}
.rule{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--gw-line);font-size:14px}
.rule b{display:block}.rule small{color:var(--gw-ink3)}
.rule[data-ok] .mk{color:var(--gw-ok)}.rule:not([data-ok]) .mk{color:var(--gw-bad)}
</style>
<link rel="stylesheet" href="assets/css/paper.css?v=12">
<link rel="stylesheet" href="assets/css/atelier.css?v=27z1">
</head>
<body>
<noscript><div class="nojs"><h1 class="h2">Trang này cần JavaScript</h1></div></noscript>
<main id="app"></main>
<script src="assets/js/data/lessons.js?v=8"></script>
<script src="assets/js/data/principles.js?v=8"></script>
<script src="assets/js/data/curriculum.js?v=4"></script>
<script src="assets/js/data/bai-index.js?v=15"></script>
<script src="assets/js/app.js?v=21"></script>
<script src="assets/js/games/g8-calendar.js?v=1"></script>
<script src="assets/js/games/frame.js?v=1"></script>
<script>
appShell('');
const app=document.getElementById('app'), GID='g8';
let qi=0, cal=new Array(G8.DAYS).fill(null), checked=null, plays=[], done=null;
const pct=x=>Math.round(x*100)+'%';
const label={aware:'Biết',proof:'Tin',sell:'Mua'};
function render(){
  const finished=plays.length>=G8.briefs.length, b=G8.briefs[Math.min(qi,G8.briefs.length-1)];
  const head=`<div class="top"><a class="back" href="kingdom.html">← Về bản đồ vương quốc</a><span class="eyebrow">Bài tập · luật kiểm minh hoạ</span></div>
    <header><h1>Lịch nội dung 30 ngày</h1>
      <p class="lede">Bấm vào từng ngày để đổi: nghỉ → Biết → Tin → Mua. Lịch tốt đi từ mục tiêu: đúng tỉ lệ trụ cột, vừa sức sản xuất, có bài bán đúng giai đoạn chốt. Bộ kiểm chỉ chấm cấu trúc lịch, không dự đoán hiệu quả trên nền tảng.</p></header>
    <div class="steps" style="grid-template-columns:repeat(${G8.briefs.length},1fr)">${G8.briefs.map((_,i)=>`<i data-s="${i<plays.length?'done':i===qi&&!finished?'cur':''}"></i>`).join('')}</div>`;
  if(finished){
    const score=G8.score(plays), stars=G8.stars(score); if(!done) done=GW.report(GID,stars,score);
    app.innerHTML=`<div class="g">${head}<div class="card">${GW.resultHTML(done,{goal:`Tỉ lệ luật đạt trung bình: <b>${pct(score)}</b>. Mốc sao: 60% · 80% · 100%.`})}</div>
      <div class="bar"><button class="go go--ghost" id="again">Chơi lại</button><a class="go" href="kingdom.html">Về bản đồ</a></div></div>`;
    document.getElementById('again').onclick=()=>{ qi=0; cal=new Array(G8.DAYS).fill(null); checked=null; plays=[]; done=null; render(); };
    return;
  }
  const c=G8.count(cal);
  app.innerHTML=`<div class="g">${head}
    <div class="brief"><b>${escH(b.t)}</b><p>${escH(b.goal)} Sản xuất tối đa <b>${b.capacity}</b> bài trong 30 ngày.</p>
      <p class="legend" style="margin-top:8px">${b.pillars.map(p=>`<span><i style="background:${p.id==='aware'?'#3F7EA6':p.id==='proof'?'#3D7A45':'var(--gw-acc)'}"></i><b>${escH(p.t)}</b> ${p.target}% · ${escH(p.hint)}</span>`).join('')}</p></div>
    <div class="card"><div class="cal">${cal.map((x,i)=>`<button type="button" class="day" data-i="${i}" data-p="${x||''}" aria-label="Ngày ${i+1}: ${x?label[x]:'nghỉ'}">${i+1}<small>${x?label[x]:'nghỉ'}</small></button>`).join('')}</div>
      <div class="bar"><span class="used">Đã xếp ${c.total} bài · Biết ${c.aware||0} · Tin ${c.proof||0} · Mua ${c.sell||0}</span>
        <span style="display:flex;gap:8px;flex-wrap:wrap"><button class="go go--ghost" id="clear">Xoá lịch</button><button class="go go--ghost" id="copy">Sao chép lịch</button><button class="go" id="check">Kiểm lịch</button></span></div></div>
    ${checked?`<div class="card"><h2 class="eyebrow" style="margin:0 0 6px">Kết quả kiểm · ${checked.passed}/${checked.total} luật đạt</h2>
      ${checked.rules.map(r=>`<div class="rule" ${r.ok?'data-ok':''}><span class="mk">${r.ok?'✓':'✗'}</span><span><b>${escH(r.t)}</b><small>${escH(r.detail)}</small></span></div>`).join('')}
      <div class="bar"><span class="used">${checked.passed===checked.total?'Lịch đạt mọi luật':'Sửa lịch rồi kiểm lại, hoặc chốt để sang bài kế'}</span><button class="go" id="commit">Chốt lịch này</button></div></div>`:''}</div>`;
  const order=[null,'aware','proof','sell'];
  app.querySelectorAll('.day').forEach(d=>d.onclick=()=>{ const i=+d.dataset.i; cal[i]=order[(order.indexOf(cal[i])+1)%order.length]; checked=null; render(); });
  document.getElementById('clear').onclick=()=>{ cal=new Array(G8.DAYS).fill(null); checked=null; render(); };
  document.getElementById('check').onclick=()=>{ checked=G8.check(b,cal); render(); };
  document.getElementById('copy').onclick=()=>{ const txt=cal.map((x,i)=>`Ngày ${i+1}: ${x?b.pillars.find(p=>p.id===x).t:'nghỉ'}`).join('\n');
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Đã sao chép lịch'),()=>toast('Trình duyệt không cho sao chép')); };
  const cm=document.getElementById('commit'); if(cm) cm.onclick=()=>{ plays.push([...cal]); qi++; cal=new Array(G8.DAYS).fill(null); checked=null; render(); };
}
document.title='Lịch nội dung 30 ngày — Tự Học Marketing Case';
render();
</script>
</body>
</html>
