<!doctype html>
<html lang="vi" data-district="taste">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taste Training — Nhìn thấy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F0EDE6'/%3E%3Ctext x='16' y='24' font-family='Georgia,serif' font-size='24' text-anchor='middle' fill='%2315120E'%3EN%3C/text%3E%3C/svg%3E">
<meta name="description" content="Luyện gu marketing: hai phương án dựng thật, chọn trước rồi mổ xẻ theo phân cấp, typography, bố cục và thông điệp.">
<meta property="og:title" content="Taste Training — Nhìn thấy">
<meta property="og:description" content="Luyện gu marketing: hai phương án dựng thật, chọn trước rồi mổ xẻ theo phân cấp, typography, bố cục và thông điệp.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://nhinthay.pages.dev/assets/og/default.png">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:site_name" content="Nhìn thấy">
<link rel="stylesheet" href="assets/css/main.css?v=7">
<style>
  .pair{border-top:var(--rule);padding:clamp(34px,5vw,80px) 0}
  .pair__head{display:grid;gap:16px;margin-bottom:clamp(20px,3vw,40px)}
  @media(min-width:900px){.pair__head{grid-template-columns:1fr 1fr;align-items:end}}
  .pair__q{font-family:var(--serif);font-size:clamp(1.6rem,3.4vw,2.7rem);line-height:1;letter-spacing:-.028em}
  .duo{display:grid;gap:clamp(14px,2vw,30px)}
  @media(min-width:760px){.duo{grid-template-columns:repeat(2,minmax(0,430px))}}
  .opt{display:grid;gap:12px;max-width:430px}
  .mock{position:relative;aspect-ratio:4/5;overflow:hidden;border:1px solid var(--ink-14);background:#fff}
  .pick{width:100%;border:1px solid var(--ink-14);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;
    font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;transition:.3s}
  .pick:hover{border-color:var(--ink)}
  .opt[data-state="win"] .pick{background:var(--accent);border-color:var(--accent);color:#fff}
  .opt[data-state="lose"]{opacity:.5}
  .opt[data-state="lose"] .pick{border-style:dashed}
  .read{margin-top:clamp(26px,3.5vw,50px)}
  .read__row{display:grid;gap:8px;padding:16px 0;border-bottom:var(--rule)}
  @media(min-width:800px){.read__row{grid-template-columns:20ch minmax(0,1fr);gap:24px}}
  .read__row h4{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
  .read__row p{margin:0;font-size:14.5px;line-height:1.6;max-width:62ch;color:rgba(21,18,14,.85)}
</style>
</head>
<body>
<noscript><div class="nojs">
  <h2>Trang này cần JavaScript</h2>
  <p>Toàn bộ nội dung — bài học, case study, thư viện nguyên lý — được dựng ngay trong trình duyệt của bạn,
  không gọi về máy chủ nào. Bật JavaScript để đọc; không có tài khoản và không có dữ liệu nào được gửi đi.</p>
</div></noscript>
<main class="wrap">
  <section class="pagehead">
    <div class="pagehead__grid">
      <h1 class="display" data-reveal>Taste<br><em>Training</em></h1>
      <p class="caption" data-reveal data-delay=".1">Hai phương án, cùng một đề bài. Chọn cái bạn thấy mạnh hơn trước khi đọc bất cứ dòng nào.
        Sau đó mổ xẻ theo sáu chiều: phân cấp, typography, bố cục, thông điệp, độ nhận diện và cảm xúc.
        Đây là cách gu được xây: nhìn nhiều, gọi tên được lý do.</p>
    </div>
  </section>
  <div id="list"></div>
</main>
<script src="assets/js/core.js?v=7"></script>
<script src="assets/js/data/taste.js?v=7"></script>
<script>
shell('taste.html');
document.getElementById('list').innerHTML = TASTE.map((p,i)=>`
  <section class="pair" data-reveal>
    <div class="pair__head">
      <div>
        <div class="label label--accent">Cặp ${String(i+1).padStart(2,'0')} · ${p.kind}</div>
        <h2 class="pair__q">Cái nào mạnh hơn?</h2>
      </div>
      <p class="caption">${p.brief}</p>
    </div>
    <div class="duo">
      ${['a','b'].map(k=>`
        <div class="opt" id="o${i}${k}">
          <div class="mock">${p[k]}</div>
          <button class="pick" data-i="${i}" data-k="${k}"><span>Phương án ${k.toUpperCase()}</span><span>Chọn</span></button>
        </div>`).join('')}
    </div>
    <div class="read hidden" id="r${i}">
      <div class="label" style="margin-bottom:6px">Vì sao — sáu chiều đọc</div>
      ${p.read.map(([h,t])=>`<div class="read__row"><h4>${h}</h4><p>${t}</p></div>`).join('')}
      <button class="btn btn--ghost" style="margin-top:24px" data-save="${i}">Lưu quan sát này</button>
    </div>
  </section>`).join('');

document.addEventListener('click',e=>{
  const b=e.target.closest('.pick'); if(!b) return;
  const i=+b.dataset.i, k=b.dataset.k, p=TASTE[i];
  ['a','b'].forEach(x=>document.getElementById('o'+i+x).dataset.state = x===p.stronger?'win':'lose');
  document.getElementById('r'+i).classList.remove('hidden');
  State.push('taste', p.id);
  toast(k===p.stronger?'Mắt bạn đúng — giờ đọc vì sao':'Không sao. Phần vì sao mới là chỗ luyện');
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-save]'); if(!b) return;
  const p=TASTE[+b.dataset.save]; const s=State.get();
  s.notes.unshift({t:'Taste · '+p.kind, body:p.read.map(([h,t])=>h+': '+t).join('\n\n'), when:new Date().toISOString().slice(0,10), kind:'Taste', href:'taste.html'});
  State.set({notes:s.notes}); toast('Đã lưu vào sổ tay');
});
reveal();
</script>
</body></html>
