<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Học bài — Tự Học Marketing Case</title>
<meta name="description" content="Lộ trình học: bài đang học, các chặng và module, câu sai cần ôn, thử thách mỗi ngày và luyện tập không giới hạn.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%233b2416%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27Arial%27 font-weight=%27800%27 font-size=%2716%27 text-anchor=%27middle%27 fill=%27%23fff%27%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Trang Học bài — bố cục theo casebook học tập; tông kem + nâu của Tự Học Marketing Case.
   Mọi màu nằm ở :root, đổi tông chỉ cần đổi các biến dưới đây. */
:root{
  --page:#f8f3ea; --side:#fffdf9; --card:#fffdf8; --card2:#fbf8f1; --white:#fff;
  --line:#e8dfd0; --line2:#efe7da; --ink:#2b1a11; --ink2:#5b4a3e; --ink3:#8a7a6d; --ink4:#b3a598;
  --dark:#3b2416; --dark-h:#5a3a24;                 /* vai trò “xanh đậm” của bản gốc */
  --acc:#9a6a3a; --acc-bg:#f5ecdc; --acc-bd:#e2cfae; --acc-tx:#6b4423;   /* vai trò “emerald” */
  --amber:#f59e0b; --amber-bg:#fef3c7; --amber-bd:#fcd9a0; --amber-tx:#92400e; --amber-tx2:#b45309; --amber-card:#fffaf0;
  --sky-bg:#eff8ff; --sky-bd:#bae0fd; --sky-tx:#0c4a6e;
  --red:#b4232a; --ok:#4d7c0f; --ok-bg:#eef6e4; --ok-bd:#c9e2a8;
  --rw:340px;
  --f:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font:500 14px/1.5 var(--f);color:var(--ink);background:var(--page);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%;display:block}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- sidebar ---------- */
.side{position:fixed;inset:0 auto 0 0;width:256px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30;transition:transform .25s}
.side__logo{display:flex;align-items:center;gap:10px;padding:18px 20px 12px;font-weight:800;font-size:15px;line-height:1.05;letter-spacing:-.01em;color:var(--dark)}
.side__logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--dark);color:#fff;font-style:normal;font-size:15px}
.side__search{margin:6px 14px 10px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:8px 10px;color:var(--ink3);font-size:13px;position:relative}
.side__search input{border:0;background:none;outline:0;flex:1;font:inherit;color:var(--ink);min-width:0}
.side__search kbd{font:600 10px var(--f);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:#fff}
.side__res{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px -12px rgba(43,26,17,.25);max-height:320px;overflow:auto;z-index:5;padding:6px}
.side__res a{display:block;padding:8px 10px;border-radius:10px;font-size:13px;color:var(--ink)}
.side__res a:hover,.side__res a[data-on]{background:var(--acc-bg)}
.side__res small{display:block;color:var(--ink3);font-size:11px}
.side nav{flex:1;overflow:auto;padding:0 12px 12px}
.nav-a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;color:var(--ink2);font-weight:600;font-size:14px}
.nav-a:hover{background:var(--card2);color:var(--ink)}
.nav-a[aria-current="page"]{background:var(--acc-bg);color:var(--acc-tx)}
.nav-g{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;padding:14px 10px 6px;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--dark);text-transform:uppercase}
.nav-g svg{transition:transform .2s}
.nav-g[aria-expanded="false"] svg.chev{transform:rotate(-90deg)}
.nav-box{border:1px solid var(--line2);border-radius:14px;padding:4px;background:#fff}
.badge{margin-left:auto;font-size:9.5px;font-weight:800;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--acc-bg);color:var(--acc-tx);border:1px solid var(--acc-bd)}
.badge--amber{background:var(--amber-bg);color:var(--amber-tx);border-color:var(--amber-bd)}
.side__foot{border-top:1px solid var(--line);padding:12px 14px;display:grid;gap:10px}
.gold{display:flex;align-items:center;gap:8px}
.gold a{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--card2);font-size:12px;color:var(--ink3)}
.gold a b{margin-left:auto;color:var(--ink);font-size:14px}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fde68a,#f59e0b 70%);box-shadow:inset 0 0 0 1px rgba(146,64,14,.3)}
.bell{position:relative;display:grid;place-items:center;width:40px;height:38px;border:1px solid var(--line);border-radius:12px;background:#fff}
.bell b{position:absolute;top:-7px;right:-7px;min-width:20px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.me{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:8px 10px;background:#fff}
.me i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--dark);color:#fff;font-style:normal;font-weight:800}
.me span{min-width:0;flex:1;line-height:1.25}.me b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me small{color:var(--ink3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mtop{display:none}
@media(max-width:1023px){
  .side{transform:translateX(calc(-100% - 16px));visibility:hidden} .side[data-open]{transform:none;visibility:visible;box-shadow:0 0 60px rgba(0,0,0,.25)}
  .mtop{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--side);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .mtop button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px}
}

/* ---------- khung chính ---------- */
.shell{padding-left:256px}
@media(max-width:1023px){.shell{padding-left:0}}
.wrapm{padding:24px;max-width:1280px;margin:0 auto}
.grid{display:grid;gap:14px}
@media(min-width:1280px){
  .grid{grid-template-columns:minmax(0,1fr) 10px var(--rw);gap:4px;height:calc(100dvh - 48px)}
  .col{overflow-y:auto;min-height:0;padding-right:6px;scrollbar-width:thin}
}
.rez{display:none}
@media(min-width:1280px){.rez{display:block;cursor:col-resize;border-radius:6px;position:relative}
  .rez::after{content:"";position:absolute;inset:0 4px;border-radius:2px;background:transparent;transition:background .15s}
  .rez:hover::after,.rez:focus-visible::after,.rez[data-drag]::after{background:var(--acc-bd)}}
.cardx{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 1px 2px rgba(43,26,17,.04)}

/* hero */
.hero{display:flex;gap:22px;padding:22px;border:2px solid var(--acc-bd);background:var(--card);border-radius:24px;position:relative;overflow:hidden;transition:box-shadow .2s}
.hero:hover{box-shadow:0 10px 30px -18px rgba(43,26,17,.35)}
.hero__ic{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--dark);color:#fff;flex:none}
.hero__ic svg{width:22px;height:22px}
.hero__body{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;border:1px solid}
.pill--acc{background:var(--acc-bg);border-color:var(--acc-bd);color:var(--acc-tx)}
.pill--amber{background:var(--amber-bg);border-color:var(--amber-bd);color:var(--amber-tx);text-transform:none}
.dot{width:6px;height:6px;border-radius:50%;background:var(--acc);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.hero__meta{color:var(--ink3);font-size:12.5px;font-weight:600;margin:10px 0 2px}
.hero__t{font-size:clamp(1.15rem,2.2vw,1.6rem);font-weight:800;line-height:1.25;letter-spacing:-.02em;margin:0 0 14px;color:var(--ink);transition:color .2s}
.hero:hover .hero__t{color:var(--acc-tx)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:9px 16px;font-size:12.5px;font-weight:800;background:var(--dark);color:#fff;box-shadow:0 6px 14px -6px rgba(59,36,22,.45)}
.btn:hover{background:var(--dark-h)}
.btn--ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn--ghost:hover{background:var(--card2)}
.prog{display:flex;align-items:center;gap:12px;margin-top:16px;font-size:12px;color:var(--ink3);font-weight:600}
.bar{height:8px;flex:1;max-width:180px;background:#ece4d6;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.prog b{color:var(--acc-tx)}
.hero__img{width:352px;height:152px;border-radius:16px;overflow:hidden;border:1px solid rgba(120,53,15,.1);position:relative;flex:none;align-self:center}
.hero__img img{width:100%;height:100%;object-fit:cover;object-position:right top;transition:transform .6s}
.hero:hover .hero__img img{transform:scale(1.05)}
.hero__img::before{content:"";position:absolute;inset:0 auto 0 0;width:30%;background:linear-gradient(90deg,var(--card),transparent);z-index:1}
@media(max-width:1400px) and (min-width:1024px){.hero__img{display:none}}
@media(max-width:720px){.hero__img{display:none}}

/* tabs, search */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 14px}
.tab{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:16px;padding:13px 12px;font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--card2);color:var(--ink)}
.tab small{font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;background:rgba(43,26,17,.07)}
.tab[aria-selected="true"]{background:var(--dark);color:#fff;border-color:var(--dark)}
.tab[aria-selected="true"] small{background:rgba(255,255,255,.16)}
.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.search{flex:1;min-width:220px;max-width:450px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 14px;color:var(--ink3)}
.search input{border:0;outline:0;flex:1;font:inherit;color:var(--ink);background:none;min-width:0}
.flagbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-weight:700;font-size:12.5px;position:relative}
.flagbtn[aria-pressed="true"]{background:var(--sky-bg);border-color:var(--sky-bd);color:var(--sky-tx)}
.qmark{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);font-size:10px;color:var(--ink3);position:relative}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:320px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 14px 34px -14px rgba(43,26,17,.3);z-index:10;font-size:12.5px;font-weight:500;color:var(--ink2);text-align:left;line-height:1.55}
.pop b{color:var(--ink)}
.flagbar{display:flex;align-items:center;gap:10px;background:var(--sky-bg);border:1px solid var(--sky-bd);border-radius:14px;padding:10px 14px;margin-bottom:14px;color:var(--sky-tx);font-size:13px;font-weight:600;flex-wrap:wrap}
.flagbar .btn{margin-left:auto;padding:7px 12px}

/* chặng */
.stage{background:var(--card2);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px;transition:box-shadow .2s}
.stage:hover{box-shadow:0 8px 24px -18px rgba(43,26,17,.35)}
.stage__h{display:flex;align-items:flex-start;gap:12px;width:100%;border:0;background:none;text-align:left;padding:4px 4px 6px}
.tile{display:grid;place-items:center;width:40px;height:40px;border-radius:16px;background:var(--dark);color:#fff;flex:none;font-weight:800;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tile--first{background:#fde68a;border:1px solid #f4c55c;color:#c2410c}
.tile svg{width:18px;height:18px}
.stage__t{flex:1;min-width:0}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.04em;padding:2px 7px;border-radius:7px;background:#f1ebe0;border:1px solid var(--line);color:var(--ink2);text-transform:uppercase}
.tag--new{background:var(--acc-bg);border-color:var(--acc-bd);color:var(--acc-tx);font-size:9px}
.stage__t h3{margin:6px 0 0;font-size:16px;font-weight:800;line-height:1.35;letter-spacing:-.01em}
.stage__r{display:flex;align-items:center;gap:10px;flex:none;padding-top:22px}
.mini{width:56px;height:6px;border-radius:6px;background:#e7dfd1;overflow:hidden}.mini i{display:block;height:100%;background:var(--acc)}
.cnt{font-size:12.5px;font-weight:800;padding:4px 10px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.chev{transition:transform .2s;color:var(--ink3)}
[aria-expanded="true"]>.stage__r .chev,[aria-expanded="true"]>.mod__r .chev{transform:rotate(180deg)}
.stage__q{color:var(--ink3);font-size:12.5px;margin:2px 0 0;font-weight:500}
.mods{display:grid;gap:10px;margin-top:8px}
.mod{background:#fff;border:1px solid var(--line2);border-radius:16px}
.mod__h{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:12px 14px}
.mod__ic{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;flex:none;color:var(--ink4);background:var(--card2)}
.mod__ic[data-s="play"]{background:var(--dark);color:#fff}
.mod__ic[data-s="done"]{background:var(--ok-bg);color:var(--ok)}
.mod__ic svg{width:14px;height:14px}
.mod__h b{flex:1;font-size:14.5px;font-weight:700;min-width:0}
.mod__r{display:flex;align-items:center;gap:10px;flex:none}
.rng{font-size:10.5px;font-weight:700;color:var(--ink3);background:var(--card2);border:1px solid var(--line2);border-radius:7px;padding:2px 7px}
.lessons{padding:0 12px 12px;display:grid;gap:6px}
.les{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;background:#fff;font-size:13.5px}
.les:hover{border-color:var(--acc-bd);background:var(--card2)}
.les .n{font-size:11px;font-weight:800;color:var(--ink4);width:44px;flex:none}
.les .t{flex:1;min-width:0;font-weight:600}
.les[data-cur]{border-color:var(--ink)}
.les[data-done] .n{color:var(--ok)}
.les[data-flag]{background:var(--sky-bg);border-color:var(--sky-bd)}
.les[data-lock]{opacity:.5}
.les input{accent-color:var(--sky-tx);width:16px;height:16px}
.st{font-size:10px;font-weight:800;padding:2px 8px;border-radius:7px;white-space:nowrap}
.st--cur{background:var(--ink);color:#fff}.st--done{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-bd)}
.st--flag{background:#fff;color:var(--sky-tx);border:1px solid var(--sky-bd)}.st--num{background:var(--acc-bg);color:var(--acc-tx)}
.empty{padding:24px;text-align:center;color:var(--ink3)}

/* cột phải */
.rc{display:grid;gap:14px;align-content:start}
.notes{position:relative;overflow:hidden;padding:18px 20px;min-height:140px}
.notes img{position:absolute;right:0;top:0;height:100%;width:55%;object-fit:cover;object-position:right;opacity:.9}
.notes::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--card) 50%,rgba(255,253,248,.55) 70%,transparent 100%);z-index:1}
.notes>*{position:relative;z-index:2}
.nb{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 6px -2px rgba(0,0,0,.08)}
.kick{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--ink3);text-transform:uppercase}
.rc h4{margin:2px 0 0;font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.3}
.rc p{margin:4px 0 0;color:var(--ink3);font-size:12.5px}
.link{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:12.5px;color:var(--acc-tx);margin-top:12px}
.colbtn{position:absolute;right:14px;top:14px;border:0;background:rgba(255,255,255,.8);border-radius:8px;padding:4px;z-index:3;color:var(--ink3)}
.mist{display:flex;gap:14px;align-items:flex-start;padding:18px 20px;background:var(--amber-card);border:1px solid #f3d9a4;border-radius:24px;position:relative;overflow:hidden}
.mist__ic{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--amber);color:#fff;flex:none;box-shadow:0 6px 14px -6px rgba(245,158,11,.6)}
.mist h4{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mist h4 small{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--amber-bg);color:var(--amber-tx);border:1px solid var(--amber-bd)}
.mist p{color:var(--amber-tx2)!important}
.mist .deco{position:absolute;right:6px;bottom:0;width:80px;height:56px}
.daily{padding:18px;position:relative;overflow:hidden}
.daily__h{display:flex;align-items:center;gap:10px}
.daily__h h4{flex:1}
.ibtn{border:0;background:none;padding:4px;border-radius:8px;color:var(--ink3);display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700}
.ibtn:hover{background:var(--card2)}
.dnote{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 8px}
.dnote small{color:var(--ink4);font-size:10.5px}
.dq{font-size:15.5px;font-weight:800;line-height:1.4;margin:0 0 4px}
.dctx{color:var(--ink2);font-size:13px;font-weight:600;margin:0 0 12px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:13.5px;line-height:1.5;font-weight:500}
.opt:hover:not([disabled]){border-color:var(--acc-bd);background:var(--card2)}
.opt i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--acc-bg);color:var(--acc-tx);font-style:normal;font-weight:800;font-size:12px;flex:none;border:1px solid var(--acc-bd)}
.opt[aria-pressed="true"]{border-color:var(--dark);box-shadow:0 0 0 1px var(--dark)}
.opt[data-r="ok"]{border-color:var(--ok);background:var(--ok-bg)} .opt[data-r="ok"] i{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt[data-r="bad"]{border-color:var(--red);background:#fdf0ef} .opt[data-r="bad"] i{background:var(--red);color:#fff;border-color:var(--red)}
.submit{width:100%;justify-content:center;border-radius:999px;padding:12px;letter-spacing:.06em;text-transform:uppercase}
.submit[disabled]{background:#e9e2d6;color:var(--ink4);box-shadow:none;cursor:not-allowed}
.explain{border:1px solid var(--line);background:var(--card2);border-radius:16px;padding:12px 14px;font-size:13px;color:var(--ink2);margin-top:4px}
.explain ol{margin:6px 0 0;padding-left:18px}
.daily .deco{position:absolute;right:-6px;bottom:-4px;width:128px;height:112px;opacity:.85;pointer-events:none}
.practice{display:flex;align-items:center;gap:14px;padding:0 18px 0 0;overflow:hidden;min-height:84px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:24px}
.practice .im{position:relative;width:120px;align-self:stretch;flex:none}
.practice .im img{width:100%;height:100%;object-fit:cover;object-position:left}
.practice .im::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 30%,var(--card))}
.practice b{flex:1;font-size:14.5px;font-weight:800;line-height:1.35}
.next{display:flex;align-items:center;gap:12px;padding:16px 18px;background:var(--card2);border:1px solid var(--line);border-radius:24px}
.troph{display:grid;place-items:center;width:40px;height:40px;border-radius:14px;background:var(--amber-bg);border:1px solid var(--amber-bd);color:#b45309;flex:none}
.next span{flex:1;min-width:0}.next small{display:block;font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--ink3)}
.next strong{display:block;font-size:12px;font-weight:800;text-transform:uppercase;line-height:1.35}
.next a{font-size:12px;font-weight:800;border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 10px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.comm{padding:16px;border-radius:16px}
.comm h5{margin:4px 0 0;font-size:15px;font-weight:800;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.people{display:flex;gap:10px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:thin}
.per{flex:none;width:150px;border:1px solid var(--line2);background:#fff;border-radius:22px;padding:12px}
.per .av{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--dark);color:#fff;font-weight:800;font-size:12px}
.per b{display:block;font-size:13px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.per small{color:#c2410c;font-weight:800;font-size:11.5px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(43,26,17,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal>div{width:min(680px,100%);max-height:92dvh;overflow:auto;background:var(--card);border-radius:24px;padding:22px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:13px;transition:.25s;pointer-events:none;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:640px){
  .wrapm{padding:14px}
  .stage__h{flex-wrap:wrap}.stage__t{flex:1 1 calc(100% - 60px)}.stage__r{padding-top:0;margin-left:52px;flex-basis:calc(100% - 52px)}
  .mod__h{flex-wrap:wrap}.mod__h b{flex:1 1 calc(100% - 50px)}.mod__r{margin-left:42px}.rng{display:none}
  .tab{flex-direction:column;gap:4px;padding:10px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<noscript><p style="padding:24px">Trang này cần JavaScript. Bài học và tiến độ được dựng ngay trong trình duyệt của bạn.</p></noscript>
<aside class="side" id="side" aria-label="Điều hướng"></aside>
<div class="shell">
  <div class="mtop"><b style="font-weight:800;color:var(--dark)">Tự Học Marketing</b><button id="menu" aria-controls="side" aria-expanded="false">Menu</button></div>
  <main class="wrapm" id="main"><div class="grid" id="grid">
    <section class="col" id="colL" aria-label="Lộ trình học"></section>
    <div class="rez" id="rez" role="separator" aria-orientation="vertical" aria-label="Kéo để đổi độ rộng cột phải" tabindex="0"></div>
    <aside class="col rc" id="colR" aria-label="Công cụ học"></aside>
  </div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/data/lessons.js?v=7"></script>
<script src="assets/js/data/principles.js?v=7"></script>
<script src="assets/js/data/curriculum.js?v=1"></script>
<script src="assets/js/data/drills.js?v=2"></script>
<script src="assets/js/data/cases.js?v=2"></script>
<script src="assets/js/app.js?v=9"></script>
<script>
/* ---------------- icon ---------------- */
const P={
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>', users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><path d="M16 4.5a3.5 3.5 0 010 7M18 20a6 6 0 00-2.5-4.9"/>',
  compass:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>', book:'<path d="M2 5h7a3 3 0 013 3v12a2 2 0 00-2-2H2z"/><path d="M22 5h-7a3 3 0 00-3 3v12a2 2 0 012-2h8z"/>',
  brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2M3 13h18"/>', help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 015 .5c0 1.5-2.5 2-2.5 3.5M12 17h.01"/>',
  trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0z"/><path d="M17 5h3a3 3 0 01-3 4M7 5H4a3 3 0 003 4"/>', game:'<rect x="2" y="7" width="20" height="11" rx="4"/><path d="M7 11v3M5.5 12.5h3M15 12h.01M18 13h.01"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>', sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  lib:'<path d="M4 20h16M6 20V8M10 20V8M14 20V8M18 20V8M3 8l9-5 9 5"/>', chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', bell:'<path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 004 0"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/>', flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>', play:'<path d="M8 5l11 7-11 7z" fill="currentColor"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>', check:'<path d="M5 12l5 5L20 7"/>', checks:'<path d="M2 12l5 5L17 7M13 16l1 1 9-10"/>',
  down:'<path d="M6 9l6 6 6-6"/>', right:'<path d="M5 12h14M13 6l6 6-6 6"/>', spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 17l.8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8z"/>',
  max:'<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>', alert:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5h.01"/>',
  pct:'<path d="M19 5L5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/>', card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>', layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
  file:'<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 13h6M9 17h6"/>', grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  fire:'<path d="M12 22a7 7 0 007-7c0-4-3-6-4-10-2 2-3 4-3 6-1-1-2-2-2-4-2 2-5 5-5 8a7 7 0 007 7z"/>', up:'<path d="M18 15l-6-6-6 6"/>',
};
const ic=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${P[n]||''}</svg>`;
const norm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
const pct=(a,b)=>b?Math.round(a/b*100):0;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2400);}

/* ---------------- sidebar ---------------- */
const NAVS=[
  {items:[['home','Dashboard','hoc.html'],['users','Cộng đồng','cong-dong.html']]},
  {g:'Học tập',box:true,items:[['compass','Bắt đầu từ đâu','ban-do.html'],['book','Học bài','hoc-bai.html'],['brief','Học theo nghề','hoc-bai.html?lo-trinh=1']]},
  {g:'Thực hành',items:[['help','Quiz 60 giây','quiz.html'],['trophy','Case có bấm giờ','case-thu-vien.html'],['game','Trò chơi thương hiệu','tro-choi.html'],['mic','Luyện phỏng vấn','phong-van.html','AI'],['sliders','Mô phỏng công cụ','roadmap.html']]},
  {g:'Cộng đồng',items:[['lib','Thư viện case','gallery.html'],['chart','Bảng xếp hạng','bang-xep-hang.html'],['grid','Bản đồ năng lực','nang-luc.html']]},
];
function renderSide(u){
  const s=S.get(), due=dueErrors(s).length, here='hoc-bai.html';
  const open=JSON.parse(localStorage.getItem('thmc:navg')||'{}');
  document.getElementById('side').innerHTML=`
    <a class="side__logo" href="gioi-thieu.html"><i>M</i><span>TỰ HỌC<br>MARKETING</span></a>
    <label class="side__search">${ic('search')}<input id="q" placeholder="Tìm kiếm..." autocomplete="off" aria-label="Tìm bài học"><kbd>⌘K</kbd>
      <div class="side__res" id="qres" hidden></div></label>
    <nav>${NAVS.map((g,gi)=>{const exp=open[gi]!==false;
      const list=g.items.map(([i,t,h,b])=>`<a class="nav-a" href="${h}" ${h===here&&!location.search?'aria-current="page"':''}>${ic(i)}<span>${t}</span>${b?`<span class="badge">${b}</span>`:''}</a>`).join('');
      return g.g?`<button class="nav-g" data-g="${gi}" aria-expanded="${exp}"><span>${g.g}</span>${ic('down','chev')}</button><div ${exp?'':'hidden'} class="${g.box?'nav-box':''}">${list}</div>`:list;}).join('')}</nav>
    <div class="side__foot">
      <div class="gold"><a href="ruong.html" title="Tổng XP — mở rương thưởng">${'<span class="coin"></span>'}Túi XP<b>${fmt(s.xp)}</b></a>
        <a class="bell" href="on-loi.html" title="Lỗi đến hạn ôn">${ic('bell')}${due?`<b>${due>9?'9+':due}</b>`:''}</a></div>
      <a class="me" href="tai-khoan.html"><i>${u?escH(u.name.slice(0,1).toUpperCase()):'?'}</i>
        <span><b>${u?escH(u.name):'Chưa đăng nhập'}</b><small>${u?escH(u.email):'Đăng nhập để đồng bộ tiến độ'}</small></span>${ic('down')}</a>
    </div>`;
  document.querySelectorAll('.nav-g').forEach(b=>b.onclick=()=>{const e=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',e);
    b.nextElementSibling.hidden=!e; open[b.dataset.g]=e; try{localStorage.setItem('thmc:navg',JSON.stringify(open));}catch(x){}});
  wireSearch();
}
function wireSearch(){
  const q=document.getElementById('q'), res=document.getElementById('qres'); let sel=0, hits=[];
  const pages=[...NAVS.flatMap(g=>g.items).map(([,t,h])=>({t,h,sub:'Trang'})),...CASES.map(c=>({t:c.t,h:'giai-case.html?id='+c.id,sub:'Case · '+c.industry}))];
  const draw=()=>{ res.innerHTML=hits.map((h,i)=>`<a href="${h.h}" ${i===sel?'data-on':''}>${escH(h.t)}<small>${escH(h.sub)}</small></a>`).join('')||'<div class="empty">Không thấy kết quả.</div>'; };
  q.oninput=()=>{ const n=norm(q.value.trim()); sel=0; if(!n){res.hidden=true;return;}
    hits=[...ALL.map(x=>({t:lessonMeta(x.key).t,h:'bai.html?id='+encodeURIComponent(x.key),sub:'Bài · Chặng '+x.stage.n+' · '+x.mod.t})),...pages].filter(h=>norm(h.t).includes(n)).slice(0,12);
    res.hidden=false; draw(); };
  q.onkeydown=e=>{ if(res.hidden) return; if(e.key==='ArrowDown'){sel=Math.min(sel+1,hits.length-1);draw();e.preventDefault();}
    if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);draw();e.preventDefault();} if(e.key==='Enter'&&hits[sel]) location.href=hits[sel].h; if(e.key==='Escape'){res.hidden=true;q.blur();} };
  q.onblur=()=>setTimeout(()=>res.hidden=true,150);
  document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();q.focus();} });
}

/* ---------------- lộ trình ---------------- */
const TILE=['flag','pct','card','compass','layers','file'];
let track='full', query='', flagMode=false, picked=new Set();
const openStages=new Set(), openMods=new Set();
function trackKeys(){ return track==='full'?ALL.map(x=>x.key):pathLessons(track); }
function currentIn(keys,s){ return keys.find(k=>!s.done[k])||null; }

function renderL(){
  const s=S.get(), keys=trackKeys(), set=new Set(keys), cur=currentIn(keys,s), cw=cur&&where(cur), cm=cur&&lessonMeta(cur);
  const doneN=keys.filter(k=>s.done[k]).length, p=pct(doneN,keys.length);
  const path=PATHS.find(x=>x.id===(s.path&&s.path!=='full'?s.path:null));
  const order=ALL.map(x=>x.key).filter(k=>set.has(k)), num=k=>order.indexOf(k)+1;
  const n=norm(query.trim());
  const L=document.getElementById('colL');

  const stages=STAGES.map((st,si)=>{
    const mods=st.mods.map(m=>({m,ks:m.lessons.filter(k=>set.has(k))})).filter(x=>x.ks.length);
    const ks=mods.flatMap(x=>x.ks); if(!ks.length) return '';
    const hit=k=>!n||norm(lessonMeta(k).t).includes(n)||norm(where(k).mod.t).includes(n)||norm(st.t).includes(n);
    const visMods=mods.map(x=>({...x,vis:x.ks.filter(hit)})).filter(x=>x.vis.length);
    if(n&&!visMods.length) return '';
    const hasCur=cur&&ks.includes(cur), expanded=openStages.has(st.id)||hasCur||!!n;
    const d=ks.filter(k=>s.done[k]).length, fresh=st.id==='s6';
    return `<div class="stage">
      <button class="stage__h" data-stage="${st.id}" aria-expanded="${expanded}" ${hasCur?'data-lockopen':''}>
        <span class="tile ${si===0?'tile--first':''}">${ic(TILE[si]||'book')}</span>
        <span class="stage__t"><span class="tag">Chặng ${si+1}</span>
          <h3>${escH(st.t)}</h3><p class="stage__q">${escH(st.q)}</p></span>
        <span class="stage__r"><span class="mini"><i style="width:${pct(d,ks.length)}%"></i></span><span class="cnt">${d}/${ks.length}</span>${ic('down','chev')}</span>
      </button>
      ${expanded?`<div class="mods">${visMods.map(({m,ks:mk,vis})=>{
        const md=mk.filter(k=>s.done[k]).length, mOpen=openMods.has(m.id)||(!!n&&vis.length>0);
        const state=md===mk.length?'done':mk.includes(cur)?'play':mk.every(k=>!lessonOpen(k,s))?'lock':'open';
        const a=num(mk[0]), b=num(mk[mk.length-1]);
        return `<div class="mod"><button class="mod__h" data-mod="${m.id}" aria-expanded="${mOpen}">
            <span class="mod__ic" data-s="${state}">${ic(state==='done'?'check':state==='play'?'play':state==='lock'?'lock':'book')}</span>
            <b>${escH(m.t)}</b><span class="mod__r"><span class="rng">Bài ${a}${b!==a?'–'+b:''}</span><span class="cnt">${md}/${mk.length}</span>${ic('down','chev')}</span></button>
          ${mOpen?`<div class="lessons">${vis.map(k=>lessonRow(k,s,cur,num(k))).join('')}
            ${m.caseLink?`<a class="les" href="${m.caseLink.href}" style="background:var(--card2)"><span class="n">${ic('trophy')}</span><span class="t">${escH(m.caseLink.t)}</span><span class="st st--num">Case</span></a>`:''}</div>`:''}
        </div>`;}).join('')}</div>`:''}
    </div>`;}).join('');

  L.innerHTML=`
    <a class="hero" href="${cur?'bai.html?id='+encodeURIComponent(cur):'case-thu-vien.html'}">
      <span class="hero__ic">${ic('book')}</span>
      <span class="hero__body">
        <span style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill pill--acc"><span class="dot"></span>${cur?'Nhiệm vụ đang học':'Đã xong lộ trình'}</span>
          <span class="pill pill--amber">${ic('spark')}+${XP.lesson} XP khi hoàn thành</span></span>
        <p class="hero__meta">${cur?`Chặng ${STAGES.indexOf(cw.stage)+1} · Bài ${num(cur)}`:'Tất cả bài trong lộ trình'}</p>
        <h2 class="hero__t">${cur?escH(cm.t):'Bạn đã học hết lộ trình này — sang case có bấm giờ.'}</h2>
        <span class="btn" style="pointer-events:none">${cur?'Học tiếp':'Mở thư viện case'} ${ic('right')}</span>
        <span class="prog">Tiến độ (${doneN}/${keys.length} bài) <span class="bar"><i style="width:${Math.max(2,p)}%"></i></span><b>${p}%</b></span>
      </span>
      <span class="hero__img"><img src="assets/img/hero_mountain.jpg" alt="" loading="eager"></span>
    </a>
    <div class="tabs" role="tablist" aria-label="Lộ trình">
      <button class="tab" role="tab" data-track="full" aria-selected="${track==='full'}">Chương trình đầy đủ <small>${ALL.filter(x=>s.done[x.key]).length}/${ALL.length} bài</small></button>
      <button class="tab" role="tab" data-track="${path?path.id:'pick'}" aria-selected="${track!=='full'}">${path?escH(path.t):'Chọn lộ trình theo nghề'} ${path?`<small>${path.lessons.filter(k=>s.done[k]).length}/${path.lessons.length} bài</small>`:''}</button>
    </div>
    <div class="tools">
      <label class="search">${ic('search')}<input id="ls" placeholder="Tìm bài học trong lộ trình này..." value="${escH(query)}" aria-label="Tìm bài học trong lộ trình"></label>
      <button class="flagbtn" id="fb" aria-pressed="${flagMode}">Đánh dấu đã học <span class="qmark" id="qm" tabindex="0" aria-label="Giải thích">?</span>
        <span class="pop" id="pop" hidden><b>Hai cách tính “đã học”.</b><br>
          <b style="color:var(--ok)">Xanh lá</b>: bạn học trong bài và bấm hoàn thành — được cộng XP, tính vào tiến độ và bản đồ năng lực.<br>
          <b style="color:var(--sky-tx)">Xanh dương</b>: bạn tự đánh dấu những bài đã biết ở nơi khác. Chỉ để ghi nhớ — không cộng XP, không tính tiến độ. Muốn tính, mở bài và làm như bình thường.</span></button>
    </div>
    ${flagMode?`<div class="flagbar">${ic('checks')} Chọn những bài bạn đã biết. <span>Đã chọn ${picked.size} bài</span>
      <button class="btn btn--ghost" id="fcancel" style="margin-left:auto">Huỷ</button><button class="btn" id="fok" ${picked.size?'':'disabled'} style="margin-left:0">Đánh dấu ${picked.size} bài</button></div>`:''}
    ${stages||`<div class="stage empty">Không có bài nào khớp “${escH(query)}”.</div>`}`;
  wireL();
}
function lessonRow(k,s,cur,n){
  const m=lessonMeta(k), done=!!s.done[k], flag=!!(s.flags||{})[k], lock=!lessonOpen(k,s)&&!done, isCur=k===cur;
  const inner=`${flagMode&&!done?`<input type="checkbox" data-pick="${k}" ${picked.has(k)?'checked':''} aria-label="Chọn ${escH(m.t)}">`:''}
    <span class="n">${done?ic('check'):flag?ic('checks'):lock?ic('lock'):'Bài '+n}</span><span class="t">${escH(m.t)}</span>
    ${DRILLS[k]?'<span class="st st--num">Có tính số</span>':''}
    ${isCur?'<span class="st st--cur">Đang học</span>':done?'<span class="st st--done">Đã học</span>':flag?'<span class="st st--flag">Tự đánh dấu</span>':''}`;
  const attrs=`class="les" ${isCur?'data-cur':''} ${done?'data-done':''} ${flag&&!done?'data-flag':''} ${lock?'data-lock':''}`;
  return flagMode&&!done?`<label ${attrs}>${inner}</label>`:`<a ${attrs} href="bai.html?id=${encodeURIComponent(k)}">${inner}</a>`;
}
function wireL(){
  const L=document.getElementById('colL');
  L.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{ if(b.hasAttribute('data-lockopen')) return toast('Chặng chứa bài đang học luôn mở');
    const id=b.dataset.stage; openStages.has(id)?openStages.delete(id):openStages.add(id); renderL(); });
  L.querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>{ const id=b.dataset.mod; openMods.has(id)?openMods.delete(id):openMods.add(id); renderL(); });
  L.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>{ if(b.dataset.track==='pick'){ location.href='hoc.html'; return; } track=b.dataset.track; renderL(); });
  const ls=document.getElementById('ls'); ls.oninput=()=>{ query=ls.value; const pos=ls.selectionStart; renderL(); const x=document.getElementById('ls'); x.focus(); x.setSelectionRange(pos,pos); };
  const pop=document.getElementById('pop'), qm=document.getElementById('qm');
  qm.onmouseenter=()=>pop.hidden=false; qm.onmouseleave=()=>pop.hidden=true;
  qm.onclick=e=>{ e.stopPropagation(); pop.hidden=!pop.hidden; };
  document.getElementById('fb').onclick=e=>{ if(e.target.closest('#qm')||e.target.closest('#pop')) return; flagMode=!flagMode; picked.clear(); renderL(); };
  L.querySelectorAll('[data-pick]').forEach(c=>c.onchange=()=>{ c.checked?picked.add(c.dataset.pick):picked.delete(c.dataset.pick); renderL(); });
  const ok=document.getElementById('fok'); if(ok) ok.onclick=()=>{ const s=S.get(), f={...(s.flags||{})}; picked.forEach(k=>f[k]=today());
    S.set({flags:f}); toast(`Đã đánh dấu ${picked.size} bài`); flagMode=false; picked.clear(); renderL(); scheduleSync(); };
  const cc=document.getElementById('fcancel'); if(cc) cc.onclick=()=>{ flagMode=false; picked.clear(); renderL(); };
}

/* ---------------- cột phải ---------------- */
/* Câu hỏi mỗi ngày: chọn theo số ngày kể từ mốc — ai mở hôm nay cũng gặp cùng một câu. */
const dayNo=()=>Math.floor(new Date(today()+'T00:00:00Z').getTime()/864e5);
function seeded(seed){ let x=seed%2147483647||1; return ()=>(x=x*16807%2147483647)/2147483647; }
function sshuffle(a,r){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function mcq(key,r){
  const D=DRILLS[key], m=lessonMeta(key);
  if(D){ const vals=[...new Set([D.ans,...D.wrong.map(w=>w[0]),D.ans*2,Math.round(D.ans/2*100)/100])].slice(0,4);
    return {key,q:D.q,ctx:D.ctx,opts:sshuffle(vals,r).map(v=>({t:fmt(v)+' '+D.unit,ok:v===D.ans,code:(D.wrong.find(w=>w[0]===v)||[])[1]})),steps:D.steps}; }
  if(m.kind==='L'){ const o=sshuffle(LESSONS.filter(l=>'L:'+l.day!==key),r).slice(0,3);
    return {key,q:`Ý chính của bài “${m.t}” là gì?`,opts:sshuffle([{t:m.src.idea,ok:true},...o.map(x=>({t:x.idea,ok:false}))],r)}; }
  const o=sshuffle(PRINCIPLES.filter(p=>'P:'+p.id!==key),r).slice(0,3);
  return {key,q:`Câu nào nói đúng về ${m.src.vi} (${m.src.t})?`,opts:sshuffle([{t:m.src.one,ok:true},...o.map(x=>({t:x.one,ok:false}))],r)};
}
function dailyQ(){ const keys=ALL.map(x=>x.key), d=dayNo(); return mcq(keys[d%keys.length],seeded(d+7)); }

let dailyPick=null, dailyOpen=null, collapseT=null;
function renderR(u){
  const s=S.get(), errs=Object.keys(s.errors||{}), due=dueErrors(s).length;
  const col=JSON.parse(localStorage.getItem('thmc:cardcol')||'{}');
  const Q=dailyQ(), ans=(s.daily&&s.daily.d===today())?s.daily:null;
  if(dailyOpen===null) dailyOpen=!ans;
  const nextCase=CASES.find(c=>!((s.cases||{})[c.id]||[]).some(a=>a.passed));
  const R=document.getElementById('colR');
  R.innerHTML=`
    <div class="cardx notes">
      <img src="assets/img/notebook_field_art.jpg" alt="" loading="lazy">
      <button class="colbtn" data-col="notes" aria-label="${col.notes?'Mở rộng':'Thu gọn'}">${ic(col.notes?'down':'up')}</button>
      <div style="display:flex;gap:14px;align-items:flex-start">
        <span class="nb"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><path d="M5 7h-1.5M5 11h-1.5M5 15h-1.5M5 19h-1.5" stroke="#78350f" stroke-width="1.6" stroke-linecap="round"/><path d="M9 9h6M9 13h4" stroke="#d97706" stroke-width="1.6" stroke-linecap="round"/><path d="M15 17c1.5-3 3.5-3.5 4.5-3-0.5 2-2 3.5-4.5 3z" fill="#84a33a"/></svg></span>
        <span><span class="kick">Ghi chép</span><h4>Sổ tay của bạn</h4>${col.notes?'':'<p>Ghi lại điều vừa hiểu, trước khi quên.</p>'}</span></div>
      ${col.notes?'':`<a class="link" href="journal.html">Mở sổ tay ${ic('right')}</a>`}
    </div>
    ${errs.length?`<a class="mist" href="on-loi.html">
      <span class="mist__ic">${ic('alert')}</span>
      <span style="flex:1"><h4>Câu sai cần ôn tập <small>${errs.length} lỗi</small></h4>
        <p>${due?`${due} lỗi đến hạn ôn hôm nay. `:''}Mỗi lỗi có tên và lịch ôn sau 1, 3, 7 ngày.</p></span>
      <span style="color:var(--amber-tx2)">${ic('right')}</span>
      <svg class="deco" viewBox="0 0 80 56" aria-hidden="true"><path d="M40 56C38 36 30 20 14 10c14 4 26 18 30 46z" fill="#84a33a"/><path d="M52 56c0-22 8-36 22-44-8 10-14 26-16 44z" fill="#5f7a24"/><path d="M28 56c4-14 2-26-6-36 12 8 16 22 12 36z" fill="#a3b95a"/><path d="M62 56c2-10 8-18 16-22-6 6-9 14-10 22z" fill="#c2d27a"/></svg>
    </a>`:''}
    <div class="cardx daily">
      <div class="daily__h"><span class="nb">${ic('book')}</span><h4>Thử thách marketing mỗi ngày</h4>
        <button class="ibtn" id="dmax" aria-label="Phóng to">${ic('max')}</button>
        <button class="ibtn" id="dtog" aria-expanded="${dailyOpen}">${dailyOpen?'Thu gọn':'Mở'} ${ic(dailyOpen?'up':'down')}</button></div>
      ${dailyOpen?dailyBody(Q,ans):`<p style="margin-top:10px">${ans?(ans.ok?'Hôm nay bạn đã trả lời đúng. Mai có câu mới.':'Hôm nay bạn đã trả lời. Mai có câu mới.'):'Có một câu hỏi mới hôm nay.'}</p>`}
      <svg class="deco" viewBox="0 0 128 112" aria-hidden="true"><path d="M0 112C20 70 44 58 70 70s40 18 58 8v34z" fill="#f1e6d2"/><path d="M20 112c18-30 40-40 62-30s30 8 46 0v30z" fill="#e5d3b3"/>
        <path d="M86 26v44" stroke="#6b4423" stroke-width="2.5"/><path d="M86 26l18 6-18 6z" fill="#6b4423"/>
        <path d="M30 96l6-16 6 16z" fill="#5f7a24"/><path d="M104 100l5-13 5 13z" fill="#6b4423"/><path d="M48 104l5-12 5 12z" fill="#84a33a"/></svg>
    </div>
    <button class="practice" id="prac"><span class="im"><img src="assets/img/mountains_panorama_banner.jpg" alt="" loading="lazy"></span>
      <b>Luyện tập không giới hạn (không tính XP)</b>${ic('right')}</button>
    ${nextCase?`<div class="next"><span class="troph">${ic('trophy')}</span><span><small>THỬ THÁCH TIẾP THEO</small><strong>Case: ${escH(nextCase.t)}</strong></span>
      <a href="giai-case.html?id=${nextCase.id}">Vào thi ngay ${ic('right')}</a></div>`:''}
    <div class="cardx comm" id="comm" hidden></div>`;
  wireR(Q,ans);
  loadCommunity(u);
}
function dailyBody(Q,ans){
  const letters='ABCD', chosen=ans?ans.opt:dailyPick, done=!!ans;
  return `<div class="dnote"><span class="pill pill--acc">Bài tập hôm nay</span><small>Rút từ bài: ${escH(lessonMeta(Q.key).t)}</small></div>
    <p class="dq">${escH(Q.q)}</p>${Q.ctx?`<p class="dctx">${escH(Q.ctx)}</p>`:''}
    ${Q.opts.map((o,i)=>`<button class="opt" data-o="${i}" ${done?'disabled':''} aria-pressed="${chosen===i}" ${done?(o.ok?'data-r="ok"':chosen===i?'data-r="bad"':''):''}><i>${letters[i]}</i><span>${escH(o.t)}</span></button>`).join('')}
    ${done?`<div class="explain"><b style="color:${ans.ok?'var(--ok)':'var(--red)'}">${ans.ok?'Đúng — +'+XP.daily+' XP.':'Chưa đúng.'}</b>
      ${Q.steps?`<ol>${Q.steps.map(x=>`<li>${x}</li>`).join('')}</ol>`:''}
      <a class="link" style="margin-top:8px" href="bai.html?id=${encodeURIComponent(Q.key)}">Đọc lại bài ${ic('right')}</a></div>`
      :`<button class="btn submit" id="dsub" ${chosen===null?'disabled':''}>${ic('right')} Gửi câu trả lời</button>`}`;
}
function wireR(Q,ans){
  const u=API.user;
  document.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{ const c=JSON.parse(localStorage.getItem('thmc:cardcol')||'{}');
    c[b.dataset.col]=!c[b.dataset.col]; try{localStorage.setItem('thmc:cardcol',JSON.stringify(c));}catch(x){} renderR(u); });
  document.getElementById('dtog').onclick=()=>{ dailyOpen=!dailyOpen; renderR(u); };
  document.getElementById('dmax').onclick=()=>openDailyModal(Q);
  document.querySelectorAll('#colR .opt').forEach(b=>b.onclick=()=>{ dailyPick=+b.dataset.o; renderR(u); });
  const sub=document.getElementById('dsub'); if(sub) sub.onclick=()=>submitDaily(Q,()=>renderR(u));
  document.getElementById('prac').onclick=practice;
}
function submitDaily(Q,after){
  if(dailyPick===null) return; const o=Q.opts[dailyPick];
  S.set({daily:{d:today(),opt:dailyPick,ok:o.ok,key:Q.key}});
  if(o.ok){ award('daily',today()); } else { if(DRILLS[Q.key]) logError(o.code||'SAI_TINH_TOAN',Q.key); toast('Chưa đúng — xem lời giải bên dưới'); }
  after(); renderSide(API.user);
  clearTimeout(collapseT); collapseT=setTimeout(()=>{ dailyOpen=false; renderR(API.user); },4000);
}
function modal(html){ const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(m); m.onclick=e=>{ if(e.target===m) m.remove(); }; document.addEventListener('keydown',function esc(e){ if(e.key==='Escape'){m.remove();document.removeEventListener('keydown',esc);} }); return m; }
function openDailyModal(Q){
  const m=modal(''); const draw=()=>{ const s=S.get(), ans=(s.daily&&s.daily.d===today())?s.daily:null;
    m.firstChild.innerHTML=`<div class="daily__h"><h4 style="margin:0">Thử thách marketing mỗi ngày</h4><button class="ibtn" data-x aria-label="Đóng">${ic('x')}</button></div>${dailyBody(Q,ans)}`;
    m.querySelector('[data-x]').onclick=()=>m.remove();
    m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{dailyPick=+b.dataset.o;draw();});
    const sub=m.querySelector('#dsub'); if(sub) sub.onclick=()=>submitDaily(Q,()=>{draw();renderR(API.user);}); };
  draw();
}
/* Luyện tập không giới hạn: câu ngẫu nhiên từ toàn bộ chương trình, chấm tại chỗ, không cộng XP, không ghi lỗi. */
function practice(){
  const keys=ALL.map(x=>x.key); let n=0, right=0, streak=0, best=0, Q, pick=null, shown=false;
  const m=modal('');
  const next=()=>{ Q=mcq(keys[Math.floor(Math.random()*keys.length)],Math.random); pick=null; shown=false; draw(); };
  const draw=()=>{
    m.firstChild.innerHTML=`<div class="daily__h"><h4 style="margin:0">Luyện tập không giới hạn</h4><span class="pill pill--acc">Không tính XP</span><button class="ibtn" data-x aria-label="Đóng">${ic('x')}</button></div>
      <p style="color:var(--ink3);font-size:12.5px;margin:8px 0 14px">Câu ${shown?n:n+1} · đúng ${right}/${n} · chuỗi ${streak} (tốt nhất ${best})</p>
      <p class="dq">${escH(Q.q)}</p>${Q.ctx?`<p class="dctx">${escH(Q.ctx)}</p>`:''}
      ${Q.opts.map((o,i)=>`<button class="opt" data-o="${i}" ${shown?'disabled':''} aria-pressed="${pick===i}" ${shown?(o.ok?'data-r="ok"':pick===i?'data-r="bad"':''):''}><i>${'ABCD'[i]}</i><span>${escH(o.t)}</span></button>`).join('')}
      ${shown?`<div class="explain">${Q.steps?`<ol>${Q.steps.map(x=>`<li>${x}</li>`).join('')}</ol>`:''}<a class="link" href="bai.html?id=${encodeURIComponent(Q.key)}">Đọc bài: ${escH(lessonMeta(Q.key).t)} ${ic('right')}</a></div>
        <div style="display:flex;gap:10px;margin-top:14px"><button class="btn btn--ghost" data-x>Thoát</button><button class="btn" id="pn">Câu tiếp theo ${ic('right')}</button></div>`
      :`<button class="btn submit" id="ps" ${pick===null?'disabled':''}>Kiểm tra</button>`}`;
    m.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>m.remove());
    m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{pick=+b.dataset.o;draw();});
    const ps=m.querySelector('#ps'); if(ps) ps.onclick=()=>{ shown=true; n++; if(Q.opts[pick].ok){right++;streak++;best=Math.max(best,streak);}else streak=0; draw(); };
    const pn=m.querySelector('#pn'); if(pn) pn.onclick=next;
  };
  next();
}
/* Cộng đồng hôm nay: chỉ hiện khi có máy chủ — con số là số thật từ bảng xếp hạng tuần. */
async function loadCommunity(u){
  const box=document.getElementById('comm'); if(!box) return;
  try{ const d=await api('/leaderboard?by=streak'); if(!d.rows.length) return;
    box.hidden=false;
    box.innerHTML=`<span class="kick">Cộng đồng tuần này</span><h5>${ic('users')} ĐANG GIỮ CHUỖI NGÀY</h5>
      <p>${d.rows.length} người học đang duy trì chuỗi ngày trong tuần này.</p>
      <div class="people">${d.rows.slice(0,12).map(r=>`<div class="per"><span class="av">${escH(r.name.slice(0,1).toUpperCase())}</span><b>${escH(r.name)}${r.me?' (bạn)':''}</b><small>${ic('fire')} ${r.streak} ngày</small></div>`).join('')}</div>
      <a class="link" href="bang-xep-hang.html?theo=streak">Xem bảng xếp hạng ${ic('right')}</a>`;
  }catch(e){}
}

/* ---------------- cột phải kéo giãn ---------------- */
function wireResize(){
  const grid=document.getElementById('grid'), rez=document.getElementById('rez'), KEY='thmc:rw';
  const set=w=>{ w=Math.max(280,Math.min(520,Math.round(w))); grid.style.setProperty('--rw',w+'px'); try{localStorage.setItem(KEY,w);}catch(e){} return w; };
  let w=+(localStorage.getItem(KEY)||340); set(w);
  rez.onpointerdown=e=>{ rez.setPointerCapture(e.pointerId); rez.dataset.drag=1; const x0=e.clientX, w0=w;
    rez.onpointermove=ev=>{ w=set(w0-(ev.clientX-x0)); }; rez.onpointerup=()=>{ delete rez.dataset.drag; rez.onpointermove=null; }; };
  rez.onkeydown=e=>{ if(e.key==='ArrowLeft') w=set(w+24); if(e.key==='ArrowRight') w=set(w-24); };
}

/* ---------------- khởi động ---------------- */
(async()=>{
  applyTheme();
  const s=S.get();
  if(qp('lo-trinh')&&s.path&&s.path!=='full') track=s.path;
  renderSide(null); renderL(); renderR(null); wireResize();
  const menu=document.getElementById('menu'), side=document.getElementById('side');
  menu.onclick=()=>{ const o=!side.hasAttribute('data-open'); side.toggleAttribute('data-open',o); menu.setAttribute('aria-expanded',o); };
  const u=await account();
  if(u){ renderSide(u); renderR(u); syncNow().then(()=>{ renderL(); }); mountAssistant(); }
})();
</script>
