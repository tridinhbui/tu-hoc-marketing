<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campaign Gallery — Nhìn thấy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F0EDE6'/%3E%3Ctext x='16' y='24' font-family='Georgia,serif' font-size='24' text-anchor='middle' fill='%2315120E'%3EN%3C/text%3E%3C/svg%3E">
<meta name="description" content="Mười lăm chiến dịch kinh điển đọc như case study: bối cảnh, insight, big idea, thực thi và bài học cho marketer.">
<meta property="og:title" content="Campaign Gallery — Nhìn thấy">
<meta property="og:description" content="Mười lăm chiến dịch kinh điển đọc như case study: bối cảnh, insight, big idea, thực thi và bài học cho marketer.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://nhinthay.pages.dev/assets/og/default.png">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:site_name" content="Nhìn thấy">
<link rel="stylesheet" href="assets/css/main.css?v=7">
<style>
  .filters{display:flex;gap:18px;flex-wrap:wrap;padding:18px 0;border-bottom:var(--rule)}
  .filters button{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-38);
    padding-bottom:3px;border-bottom:1px solid transparent}
  .filters button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
  .spread{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(12px,2vw,32px);padding:clamp(30px,5vw,70px) 0}
  .item{grid-column:span 12}
  @media(min-width:760px){
    .item{grid-column:span 6}
    .item:nth-child(6n+1){grid-column:span 8}
    .item:nth-child(6n+2){grid-column:span 4;align-self:end}
    .item:nth-child(6n+4){grid-column:span 4}
    .item:nth-child(6n+5){grid-column:span 8;align-self:end}
  }
  .item__cap{display:flex;justify-content:space-between;gap:14px;border-top:1px solid var(--ink);margin-top:10px;padding-top:8px}
  .item h2{font-family:var(--serif);font-size:clamp(1.2rem,1.9vw,1.65rem);line-height:1.05;letter-spacing:-.02em}
  .item p{margin:6px 0 0;font-size:13px;line-height:1.5;color:var(--ink-60);max-width:44ch}
</style>
</head>
<body>
<noscript><div class="nojs">
  <h2>Trang này cần JavaScript</h2>
  <p>Toàn bộ nội dung — bài học, case study, thư viện nguyên lý — được dựng ngay trong trình duyệt của bạn,
  không gọi về máy chủ nào. Bật JavaScript để đọc; không có tài khoản và không có dữ liệu nào được gửi đi.</p>
</div></noscript>
<main class="wrap">
  <section class="pagehead">
    <div class="pagehead__grid">
      <h1 class="display" data-reveal>Campaign<br><em>Gallery</em></h1>
      <p class="caption" data-reveal data-delay=".1">Mười lăm chiến dịch, đọc như case study chứ không như tin tức.
        Mỗi trang đi qua: bối cảnh, insight, big idea, cách thực thi, ngôn ngữ hình ảnh, kênh, vì sao nó hiệu quả
        và marketer học được gì.</p>
    </div>
  </section>
  <div class="filters" id="filters"></div>
  <div class="spread" id="spread"></div>
</main>

<script src="assets/js/core.js?v=8"></script>
<script src="assets/js/data/campaigns.js?v=7"></script>
<script src="assets/js/data/districts.js?v=7"></script>
<script>
shell('gallery.html');
const FILTERS=[['all','Tất cả'],...DISTRICTS.map(d=>[d.key,d.name])];
let active='all';
document.getElementById('filters').innerHTML=FILTERS.map(([k,l])=>
  `<button data-k="${k}" aria-pressed="${k===active}">${l}</button>`).join('');

function render(){
  const list = active==='all'?CAMPAIGNS:CAMPAIGNS.filter(c=>c.district===active);
  document.getElementById('spread').innerHTML = list.map((c,i)=>`
    <article class="item" data-reveal data-delay="${(i%4)*.06}">
      ${plate({color:c.color,mark:c.mark,kicker:c.brand,meta:c.year,title:c.title,
        shape:(i%6===0||i%6===4)?'plate--wide':'plate--tall',href:'case/'+c.id+'.html'})}
      <div class="item__cap"><span class="label">${c.tag}</span><span class="label">${c.market}</span></div>
      <a href="case/${c.id}.html"><h2>${c.brand} — ${c.title}</h2></a>
      <p>${c.idea}</p>
    </article>`).join('');
  reveal();
}
document.getElementById('filters').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  active=b.dataset.k;
  [...document.querySelectorAll('.filters button')].forEach(x=>x.setAttribute('aria-pressed',x.dataset.k===active));
  render();
};
render();
</script>
</body></html>
