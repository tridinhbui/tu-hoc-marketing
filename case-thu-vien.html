<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23fff%27/%3E%3Ctext x=%2716%27 y=%2724%27 font-family=%27Georgia,serif%27 font-size=%2722%27 text-anchor=%27middle%27 fill=%27%230F1B2D%27%3EM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/case.css?v=3">
<title>Case có bấm giờ — Tự Học Marketing Case</title>
<meta name="description" content="Thư viện case có bấm giờ theo ngành, lọc theo độ khó và thời lượng.">
</head>
<body>
<noscript><div class="nojs"><h1 class="h2">Trang này cần JavaScript</h1><p>Nội dung và tiến độ được dựng ngay trong trình duyệt của bạn, không gửi về máy chủ nào.</p></div></noscript>
<main class="wrap" id="app"></main>
<script src="assets/js/data/lessons.js?v=7"></script>
<script src="assets/js/data/principles.js?v=7"></script>
<script src="assets/js/data/curriculum.js?v=3"></script>
<script src="assets/js/data/bai-index.js?v=4"></script>
<script src="assets/js/data/drills.js?v=2"></script>
<script src="assets/js/data/cases.js?v=2"></script>
<script src="assets/js/app.js?v=14"></script>
<script>
appShell('case-thu-vien.html');
const F={industry:'',level:'',minutes:''};
const uniq=k=>[...new Set(CASES.map(c=>c[k]))];
function render(){
  const s=S.get(), list=CASES.filter(c=>(!F.industry||c.industry===F.industry)&&(!F.level||c.level===F.level)&&(!F.minutes||c.minutes<=+F.minutes));
  const sel=(k,label,opts,fmtO=x=>x)=>`<label class="stack" style="gap:2px;min-width:150px"><span class="mono">${label}</span>
    <select class="field" data-f="${k}"><option value="">Tất cả</option>${opts.map(o=>`<option value="${o}" ${String(F[k])===String(o)?'selected':''}>${fmtO(o)}</option>`).join('')}</select></label>`;
  document.getElementById('app').innerHTML=`
  <section class="section">
    <span class="mono mono--red">Tự giải có bấm giờ</span>
    <h1 class="h1" style="margin:14px 0 16px">${CASES.length} case,<br><em>dữ liệu mở theo câu bạn hỏi.</em></h1>
    <p class="lede" style="max-width:62ch">Mỗi case có một thương hiệu giả định với số liệu minh hoạ tự khớp. Bạn chọn hỏi gì,
      đồng hồ vẫn chạy, và bài được chấm tự động theo tính toán · insight · đề xuất.
      Muốn đọc case thật không bấm giờ: <a href="gallery.html">thư viện campaign</a>.</p>
    <div class="row" style="margin-top:22px;align-items:end">
      ${sel('industry','Ngành',uniq('industry'))}${sel('level','Độ khó',uniq('level'))}
      ${sel('minutes','Thời lượng',[...new Set(CASES.map(c=>c.minutes))].sort((a,b)=>a-b),m=>'≤ '+m+' phút')}
    </div>
  </section>
  <ul class="list">${list.map((c,i)=>{const tr=s.cases[c.id]||[], ok=tr.some(a=>a.passed);
    return `<li><a class="item" href="giai-case.html?id=${c.id}">
      <span class="item__n">${String(i+1).padStart(2,'0')}</span>
      <span><span class="item__t">${escH(c.t)}</span><br><span class="small muted">${escH(c.brand)}</span></span>
      <span class="stack" style="gap:4px;justify-items:end"><span class="row" style="gap:6px"><span class="tag">${escH(c.industry)}</span><span class="tag">${escH(c.level)}</span><span class="tag">${c.minutes} phút</span></span>
        <span class="mono ${ok?'':'muted'}" style="${ok?'color:var(--ok)':''}">${ok?'Đã đạt':tr.length?tr.length+' lần · chưa đạt':'Chưa làm'}</span></span></a></li>`}).join('')
    ||'<li style="padding:16px 0" class="muted">Không có case nào khớp bộ lọc.</li>'}</ul>`;
  document.querySelectorAll('[data-f]').forEach(x=>x.onchange=()=>{F[x.dataset.f]=x.value;render();});
}
render();
</script>
</body>
</html>
