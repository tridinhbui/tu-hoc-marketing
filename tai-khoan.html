<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="assets/img/favicon-32.png">
<link rel="stylesheet" href="assets/css/case.css?v=21f6">
<title>Hồ sơ Chiến lược gia — Tự Học Marketing Case</title>
<meta name="description" content="Xem tiến trình học, điểm tích lũy XP, cấp bậc và quản lý tài khoản cá nhân.">
<link rel="stylesheet" href="assets/css/paper.css?v=12">
<link rel="stylesheet" href="assets/css/atelier.css?v=27f6">
</head>
<body>
<noscript><div class="nojs"><h1 class="h2">Trang này cần JavaScript</h1></div></noscript>
<main class="wrap narrow" id="app"></main>

<script src="assets/js/data/lessons.js?v=8"></script>
<script src="assets/js/data/principles.js?v=8"></script>
<script src="assets/js/data/curriculum.js?v=4"></script>
<script src="assets/js/data/drills.js?v=3"></script>
<script src="assets/js/data/cases.js?v=5"></script>
<script src="assets/js/app.js?v=21"></script>
<script src="assets/js/social-ui.js?v=7"></script>
<script>
appShell('tai-khoan.html');
const app = document.getElementById('app');

async function renderProfile() {
  const u = await account();
  const s = S.get();
  const rk = typeof rank === 'function' ? rank(s) : { t: 'Strategist', n: 1 };
  const doneCount = Object.keys(s.done || {}).length;

  if (u && u.name) {
    app.innerHTML = `
      <section class="section">
        <span class="studio-badge studio-badge--terra">HỒ SƠ CHIẾN LƯỢC GIA</span>
        <div style="display:flex;align-items:center;gap:16px;margin:16px 0 8px">${SocialUI.avatar(u, 64)}<h1 class="h1" style="margin:0">${escH(u.display_name || u.friendly_name || u.name)}</h1></div>
        ${u.display_name ? '' : '<p class="small muted" style="margin:0 0 8px">Bạn chưa đặt tên hiển thị — trên bảng xếp hạng bạn đang hiện là “' + escH(u.name) + '”. Đặt tên ở mục “Đổi tên hiển thị” bên dưới.</p>'}
        <p class="muted" style="margin:0 0 24px">${escH(u.email || 'Tài khoản Studio hoạt động trên trình duyệt')}</p>

        <!-- Sổ cái: ba con số lớn + cấp độ hiện tại -->
        <div class="at-ledger">
          <div class="at-ledger__n">
            <div><b>${fmt(s.xp)}</b><span>Tổng điểm XP</span></div>
            <div><b>${s.streak || 0}</b><span>Chuỗi ngày (Streak)</span></div>
            <div><b>${doneCount}</b><span>Case đã giải</span></div>
          </div>
          <div class="at-ledger__rank">
            <div><span class="at-ledger__k">Cấp độ hiện tại</span><b>${escH(rk ? rk.t : 'Strategist')}</b></div>
            <a class="btn btn--primary" href="hoc.html">Tiếp tục giải case →</a>
          </div>
        </div>

        <div id="moi-ban" style="margin-bottom:24px"></div>

        <!-- Edit Profile Form -->
        <div style="background:var(--bg-2);border-radius:14px;padding:20px;border:1px solid rgba(249,244,235,.1);margin-bottom:24px">
          <span class="mono" style="color:var(--ink-70);margin-bottom:8px;display:block">Đổi tên hiển thị</span>
          <form id="editNameForm" class="row" style="gap:10px">
            <input class="field" id="inputNewName" value="${escH(u.display_name || u.friendly_name || '')}" placeholder="Tên của bạn..." style="max-width:280px;background:#FAF5EE;color:#24160E" required>
            <button type="submit" class="btn btn--ghost" style="border-radius:8px;padding:9px 18px">Lưu tên</button>
          </form>
        </div>

        <!-- Account Actions -->
        <div class="row" style="gap:14px">
          <button type="button" class="btn btn--ghost" id="btnLogout" onclick="signOut()" style="border-color:rgba(249,244,235,.3)">
            Đăng xuất tài khoản
          </button>
        </div>
      </section>
    `;

    SocialUI.inviteCard(document.getElementById('moi-ban')).then(() => {
      if (new URLSearchParams(location.search).get('moi')) document.getElementById('moi-ban').scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    document.getElementById('editNameForm').onsubmit = async (e) => {
      e.preventDefault();
      const newName = document.getElementById('inputNewName').value.trim();
      if (newName.length < 2) { toast('Tên cần ít nhất 2 ký tự'); return; }
      try {
        await api('/me', { method: 'PATCH', body: { display_name: newName } });
        API.user = undefined;
        toast('Đã cập nhật tên mới ✓');
        setTimeout(renderProfile, 300);
      } catch (err) { toast('Chưa lưu được tên, thử lại sau'); }
    };
  } else {
    app.innerHTML = `
      <section class="section">
        <span class="studio-badge studio-badge--terra">CHẾ ĐỘ KHÁCH</span>
        <h1 class="h1" style="margin:16px 0 12px">Bạn chưa đăng nhập.</h1>
        <p class="lede" style="margin-bottom:28px">
          Tiến trình giải case và điểm tích luỹ XP hiện đang được lưu tạm thời trên trình duyệt máy này. 
          Đăng nhập vào Studio để lưu giữ hồ sơ lâu dài và đồng bộ tiến độ.
        </p>

        <!-- Guest Stats Preview -->
        <div style="background:#FAF5EE;color:#24160E;border-radius:16px;padding:22px;border:1px solid rgba(36,22,14,.15);margin-bottom:28px">
          <div class="row between" style="margin-bottom:12px">
            <span style="font-size:12px;font-weight:700;color:rgba(36,22,14,.6)">TIẾN TRÌNH TRÊN TRÌNH DUYỆT</span>
            <span class="gold" style="font-weight:700">${fmt(s.xp)} XP</span>
          </div>
          <b style="font-family:var(--serif);font-size:1.3rem;display:block;margin-bottom:6px">Chiến lược gia ẩn danh</b>
          <p style="font-size:13.5px;color:rgba(36,22,14,.7);margin:0">Đã hoàn thành ${doneCount} bài học & thử thách.</p>
        </div>

        <div class="row" style="gap:14px">
          <a class="btn btn--primary" href="/dang-nhap.html?next=/tai-khoan.html" style="border-radius:99px;padding:13px 28px">
            Đăng nhập tài khoản Studio →
          </a>
        </div>
      </section>
    `;
  }
}

async function signOut() {
  try { await api('/auth/logout', { method: 'POST' }); } catch (e) {}
  try { localStorage.removeItem('thmc.user'); } catch (e) {}
  API.user = undefined;
  toast('Đã đăng xuất');
  setTimeout(() => { location.href = '/dang-nhap.html'; }, 300);
}

renderProfile();
</script>
<script src="assets/js/paper.js?v=7"></script>
</body>
</html>
