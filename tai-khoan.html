<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23C85A32'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' text-anchor='middle' fill='%23FAF3E8'%3EM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/case.css?v=9">
<title>Hồ sơ Chiến lược gia — Tự Học Marketing Case</title>
<meta name="description" content="Xem tiến trình học, điểm tích lũy XP, cấp bậc và quản lý tài khoản cá nhân.">
</head>
<body>
<noscript><div class="nojs"><h1 class="h2">Trang này cần JavaScript</h1></div></noscript>
<main class="wrap narrow" id="app"></main>

<script src="assets/js/data/lessons.js?v=8"></script>
<script src="assets/js/data/principles.js?v=8"></script>
<script src="assets/js/data/curriculum.js?v=4"></script>
<script src="assets/js/data/drills.js?v=3"></script>
<script src="assets/js/data/cases.js?v=3"></script>
<script src="assets/js/app.js?v=17"></script>
<script>
appShell('tai-khoan.html');
const app = document.getElementById('app');

async function renderProfile() {
  const u = await account();
  const s = S.get();
  const rk = typeof rank === 'function' ? rank(s) : { t: 'Strategist', n: 1 };
  const doneCount = Object.keys(s.done || {}).length;

  if (u && u.name) {
    app.innerHTML = `
      <section class="section">
        <span class="studio-badge studio-badge--terra">HỒ SƠ CHIẾN LƯỢC GIA</span>
        <h1 class="h1" style="margin:16px 0 8px">${escH(u.name)}</h1>
        <p class="muted" style="margin:0 0 24px">${escH(u.email || 'Tài khoản Studio hoạt động trên trình duyệt')}</p>

        <!-- Stats Grid Card -->
        <div style="background:#FAF5EE;color:#24160E;border-radius:18px;padding:24px;border:1px solid rgba(36,22,14,.12);margin-bottom:28px;box-shadow:0 14px 32px -12px rgba(0,0,0,.6)">
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:center;border-bottom:1px solid rgba(36,22,14,.1);padding-bottom:18px;margin-bottom:18px">
            <div>
              <b style="font-family:var(--serif);font-size:1.8rem;color:var(--terra);display:block">${fmt(s.xp)}</b>
              <span style="font-size:12px;color:rgba(36,22,14,.6)">Tổng điểm XP</span>
            </div>
            <div>
              <b style="font-family:var(--serif);font-size:1.8rem;color:var(--gold-d);display:block">${s.streak || 0}</b>
              <span style="font-size:12px;color:rgba(36,22,14,.6)">Chuỗi ngày (Streak)</span>
            </div>
            <div>
              <b style="font-family:var(--serif);font-size:1.8rem;color:var(--sage-d);display:block">${doneCount}</b>
              <span style="font-size:12px;color:rgba(36,22,14,.6)">Case đã giải</span>
            </div>
          </div>

          <div class="row between">
            <div>
              <span style="font-size:12px;font-weight:700;letter-spacing:.08em;color:rgba(36,22,14,.55);text-transform:uppercase">CẤP ĐỘ HIỆN TẠI</span>
              <b style="font-family:var(--serif);font-size:1.25rem;display:block;margin-top:2px">${escH(rk ? rk.t : 'Strategist')}</b>
            </div>
            <a class="btn btn--primary" href="hoc.html" style="border-radius:99px;padding:9px 20px;font-size:13.5px">Tiếp tục giải case →</a>
          </div>
        </div>

        <!-- Edit Profile Form -->
        <div style="background:var(--bg-2);border-radius:14px;padding:20px;border:1px solid rgba(249,244,235,.1);margin-bottom:24px">
          <span class="mono" style="color:var(--ink-70);margin-bottom:8px;display:block">Đổi tên hiển thị</span>
          <form id="editNameForm" class="row" style="gap:10px">
            <input class="field" id="inputNewName" value="${escH(u.name)}" placeholder="Tên mới..." style="max-width:280px;background:#FAF5EE;color:#24160E" required>
            <button type="submit" class="btn btn--ghost" style="border-radius:8px;padding:9px 18px">Lưu tên</button>
          </form>
        </div>

        <!-- Account Actions -->
        <div class="row" style="gap:14px">
          <button type="button" class="btn btn--ghost" id="btnLogout" onclick="signOut()" style="border-color:rgba(249,244,235,.3)">
            Đăng xuất tài khoản
          </button>
        </div>
      </section>
    `;

    document.getElementById('editNameForm').onsubmit = (e) => {
      e.preventDefault();
      const newName = document.getElementById('inputNewName').value.trim();
      if (!newName) return;
      u.name = newName;
      try { localStorage.setItem('thmc.user', JSON.stringify(u)); } catch(err){}
      toast('Đã cập nhật tên mới ✓');
      setTimeout(renderProfile, 300);
    };
  } else {
    app.innerHTML = `
      <section class="section">
        <span class="studio-badge studio-badge--terra">CHẾ ĐỘ KHÁCH</span>
        <h1 class="h1" style="margin:16px 0 12px">Bạn chưa đăng nhập.</h1>
        <p class="lede" style="margin-bottom:28px">
          Tiến trình giải case và điểm tích luỹ XP hiện đang được lưu tạm thời trên trình duyệt máy này. 
          Đăng nhập vào Studio để lưu giữ hồ sơ lâu dài và đồng bộ tiến độ.
        </p>

        <!-- Guest Stats Preview -->
        <div style="background:#FAF5EE;color:#24160E;border-radius:16px;padding:22px;border:1px solid rgba(36,22,14,.15);margin-bottom:28px">
          <div class="row between" style="margin-bottom:12px">
            <span style="font-size:12px;font-weight:700;color:rgba(36,22,14,.6)">TIẾN TRÌNH TRÊN TRÌNH DUYỆT</span>
            <span class="gold" style="font-weight:700">${fmt(s.xp)} XP</span>
          </div>
          <b style="font-family:var(--serif);font-size:1.3rem;display:block;margin-bottom:6px">Chiến lược gia ẩn danh</b>
          <p style="font-size:13.5px;color:rgba(36,22,14,.7);margin:0">Đã hoàn thành ${doneCount} bài học & thử thách.</p>
        </div>

        <div class="row" style="gap:14px">
          <a class="btn btn--primary" href="dang-nhap.html?next=tai-khoan.html" style="border-radius:99px;padding:13px 28px">
            Đăng nhập tài khoản Studio →
          </a>
          <a class="btn btn--ghost" href="hoc.html" style="border-radius:99px;padding:13px 22px">
            Học tiếp với tư cách Khách
          </a>
        </div>
      </section>
    `;
  }
}

function signOut() {
  try {
    localStorage.removeItem('thmc.user');
    if (typeof API !== 'undefined') API.user = undefined;
  } catch(e){}
  toast('Đã đăng xuất');
  setTimeout(() => { location.href = 'dang-nhap.html'; }, 300);
}

renderProfile();
</script>
</body>
</html>
