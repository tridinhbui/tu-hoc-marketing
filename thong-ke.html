<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23C85A32%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27Georgia,serif%27 font-size=%2720%27 text-anchor=%27middle%27 fill=%27%23FAF3E7%27%3EM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/case.css?v=13">
<title>Thống kê — Tự Học Marketing Case</title>
<meta name="description" content="Nhịp học, tiến trình 8 tuần và bảng vinh danh tuần của bạn.">
<style>
  #app{max-width:1280px;margin:0 auto;padding:clamp(16px,3vw,32px) clamp(16px,3vw,32px) 80px}
  .tk{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:20px;align-items:start}
  .tk-card{background:var(--paper-card);color:var(--ink-dark);border:1px solid var(--ink-12);border-radius:22px;padding:20px 22px;margin-bottom:18px}
  .tk-pill{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 var(--sans);letter-spacing:.1em;padding:7px 12px;border-radius:999px;background:var(--terra-06);color:var(--terra);border:1px solid var(--terra-15)}
  .tk-pill--gold{background:#fbf0d3;color:#8a5f0c;border-color:#ecd28c}
  .tk-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 14px}
  .tk-tile{border:1px solid rgba(36,22,14,.1);border-radius:16px;padding:12px 8px;text-align:center;background:#fff}
  .tk-tile small{display:block;font:700 10px/1 var(--sans);letter-spacing:.1em;color:var(--ink-dark-50);margin-bottom:8px}
  .tk-tile b{display:block;font:700 1.7rem/1.1 var(--sans)}
  .tk-tile span{font-size:11.5px;color:var(--ink-dark-50)}
  .tk-note{font-size:13px;color:var(--ink-dark-70);display:flex;gap:8px;align-items:center;border-top:1px solid rgba(36,22,14,.08);padding-top:12px}
  .tk-note i{width:7px;height:7px;border-radius:50%;background:var(--terra);flex:none}
  .tk-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .tk-h h3{margin:4px 0 0;font:700 1.15rem/1.2 var(--sans)}
  .tk-h small{font:700 10.5px var(--sans);letter-spacing:.1em;color:var(--ink-dark-50)}
  .tk-up{font:700 12px var(--sans);padding:6px 12px;border-radius:999px;background:#e6f3ea;color:#2f7a42}
  .tk-chart{display:flex;align-items:flex-end;gap:10px;height:170px;margin:18px 0 6px;padding-bottom:22px;position:relative;border-bottom:1px solid rgba(36,22,14,.1)}
  .tk-bar{flex:1;display:grid;justify-items:center;align-content:end;height:100%;position:relative}
  .tk-bar i{display:block;width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--terra);min-height:3px;opacity:.9}
  .tk-bar span{position:absolute;bottom:-22px;font-size:11px;color:var(--ink-dark-50)}
  .tk-bar em{font-style:normal;font-size:11px;font-weight:700;margin-bottom:4px}
  .tk-dist{height:10px;border-radius:9px;background:rgba(36,22,14,.08);overflow:hidden;display:flex;margin:10px 0}
  .tk-leg{display:grid;gap:6px;font-size:13px}.tk-leg div{display:flex;gap:8px;align-items:center}.tk-leg i{width:9px;height:9px;border-radius:50%}
  .tk-leg span{margin-left:auto;color:var(--ink-dark-50)}
  .tk-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}
  .tk-tabs button{border:1px solid rgba(36,22,14,.12);background:#fff;border-radius:999px;padding:9px 16px;font:600 13.5px var(--sans);cursor:pointer;color:var(--ink-dark)}
  .tk-tabs button.on{background:var(--terra);border-color:var(--terra);color:#fff}
  .tk-climb{display:flex;gap:14px;align-items:center;background:#fdf3d8;border:1px solid #ecd28c;border-radius:20px;padding:16px 18px}
  .tk-climb b{display:block;font-size:14.5px}.tk-climb p{margin:4px 0 8px;font-size:13px;color:var(--ink-dark-70)}
  .tk-prog{height:8px;border-radius:9px;background:rgba(36,22,14,.1);overflow:hidden}.tk-prog i{display:block;height:100%;background:var(--terra)}
  .tk-podium{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:end;margin-top:26px;min-height:320px}
  .tk-p{border-radius:20px;border:1.5px solid rgba(36,22,14,.12);background:#fff;text-align:center;padding:14px 8px;display:grid;gap:6px;justify-items:center}
  .tk-p .rk{font:800 10px var(--sans);letter-spacing:.08em;padding:4px 8px;border-radius:7px;background:rgba(36,22,14,.07)}
  .tk-p .av{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--terra-06);color:var(--terra);font:800 1.1rem var(--sans);border:2px solid var(--terra-15)}
  .tk-p b{font-size:13.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tk-p strong{font:700 1rem var(--sans);color:var(--terra)}
  .tk-p--1{background:linear-gradient(#fff8e1,#fff);border-color:#e3b64a;padding-top:22px}.tk-p--1 .av{width:64px;height:64px}
  .tk-p--1 .rk{background:#f6dd91}
  .tk-base{height:14px;border-radius:50%;background:rgba(36,22,14,.12);margin-top:2px}
  .tk-empty{padding:34px 12px;text-align:center;color:var(--ink-dark-50)}
  @media(max-width:980px){.tk{grid-template-columns:1fr}.tk-podium{grid-template-columns:repeat(3,1fr)}}
</style>
<link rel="stylesheet" href="assets/css/paper.css?v=5">
</head>
<body>
<noscript><div class="nojs"><h1 class="h2">Trang này cần JavaScript</h1></div></noscript>
<main id="app"></main>
<script src="assets/js/data/lessons.js?v=8"></script>
<script src="assets/js/data/principles.js?v=8"></script>
<script src="assets/js/data/curriculum.js?v=4"></script>
<script src="assets/js/data/bai-index.js?v=11"></script>
<script src="assets/js/data/drills.js?v=3"></script>
<script src="assets/js/data/cases.js?v=5"></script>
<script src="assets/js/app.js?v=21"></script>
<script>
appShell('thong-ke.html');
const app=document.getElementById('app');
const COLS={xp:['XP tuần','XP'],streak:['Chuỗi ngày','ngày'],cases:['Case đã đạt','case']};
let by='xp';
const DAY=864e5;
const toDay=s=>Date.parse(s+'T00:00:00');
const monday=t=>{ const d=new Date(t); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.getTime(); };

function mine(){
  const s=S.get(), doneKeys=Object.keys(s.done||{}).filter(k=>s.done[k]);
  const now=Date.now(), wk0=monday(now);
  const weeks=Array.from({length:8},(_,i)=>({start:wk0-(7-i)*7*DAY,n:0}));
  doneKeys.forEach(k=>{ const t=toDay(String(s.done[k])); if(isNaN(t)) return; const i=weeks.findIndex(w=>t>=w.start&&t<w.start+7*DAY); if(i>-1) weeks[i].n++; });
  const mq=Object.values(s.modq||{}), of=mq.reduce((n,x)=>n+(x.of||0),0), best=mq.reduce((n,x)=>n+(x.best||0),0);
  const last=s.lastDay?Math.max(0,Math.floor((now-toDay(s.lastDay))/DAY)):null;
  const stages=STAGES.map(st=>{ const ks=st.mods.flatMap(m=>m.lessons); return {t:st.t,total:ks.length,done:ks.filter(k=>s.done[k]).length}; });
  return {s,done:doneKeys.length,weeks,acc:of?Math.round(best/of*100):null,last,stages};
}
const COLORS=['#C85A32','#E5B24B','#546845','#6B7FA3','#9E5E52','#7A2E8E'];

async function lb(){ try{ return await api('/leaderboard?by='+by); }catch(e){ return null; } }
async function render(){
  const m=mine(), u=await account(), d=await lb();
  const max=Math.max(1,...m.weeks.map(w=>w.n)), total=m.stages.reduce((n,x)=>n+x.total,0)||1;
  const thisWeek=m.weeks[m.weeks.length-1].n;
  const rows=(d&&d.rows)||[], top=rows.slice(0,5);
  const order=[4,2,1,3,5].map(r=>top.find(x=>x.rank===r)).filter(Boolean);
  const heights={1:300,2:250,3:230,4:210,5:200};
  const my=d&&d.me, ahead=my?rows.find(r=>r.rank===my.rank-1):null;
  const gap=ahead&&my?Math.max(1,(ahead[by]||0)-(my[by]||0)+1):0;
  app.innerHTML=`<div class="tk"><div>
    <section class="tk-card"><span class="tk-pill">NHỊP HỌC & HỒ SƠ</span>
      <div class="tk-tiles">
        <div class="tk-tile"><small>STREAK</small><b>${m.s.streak||0}</b><span>Kỷ lục ${m.s.best||m.s.streak||0} ngày</span></div>
        <div class="tk-tile"><small>QUIZ TB</small><b>${m.acc==null?'—':m.acc+'%'}</b><span>Chính xác</span></div>
        <div class="tk-tile"><small>ĐÃ HỌC</small><b>${m.done}</b><span>Bài học</span></div></div>
      <div class="tk-note"><i></i>${m.last==null?'Chưa học ngày nào — bài đầu tiên chỉ mất 6 phút':m.last===0?'Hôm nay bạn đã học':m.last+' ngày chưa học'}</div></section>
    <section class="tk-card"><div class="tk-h"><div><small>TIẾN TRÌNH HỌC TẬP</small><h3>Tổng quan 8 tuần</h3></div>
        <span class="tk-up">+${thisWeek} bài tuần này</span></div>
      <div class="tk-chart">${m.weeks.map((w,i)=>`<div class="tk-bar"><em>${w.n||''}</em><i style="height:${Math.round(w.n/max*100)}%"></i><span>${i===7?'Nay':'T-'+(7-i)}</span></div>`).join('')}</div>
      <div style="margin-top:26px;display:flex;justify-content:space-between;font-size:13px;font-weight:600"><span>Phân bổ theo chặng</span><span style="color:var(--ink-dark-50)">${m.done} bài</span></div>
      <div class="tk-dist">${m.stages.map((st,i)=>`<i style="flex:${Math.max(st.done,0)};background:${COLORS[i%6]}"></i>`).join('')}</div>
      <div class="tk-leg">${m.stages.map((st,i)=>`<div><i style="background:${COLORS[i%6]}"></i>${escH(st.t)}<span>${st.done}/${st.total}</span></div>`).join('')}</div></section>
  </div><div>
    <section class="tk-card"><div class="tk-h"><div><span class="tk-pill tk-pill--gold">VINH DANH BXH</span><h3 style="font:600 2rem/1.1 var(--serif);margin-top:14px">Top 5 nổi bật</h3></div></div>
      <div class="tk-tabs">${Object.entries(COLS).map(([k,[l]])=>`<button class="${k===by?'on':''}" data-by="${k}">${l}</button>`).join('')}</div>
      ${!u?`<div class="tk-climb"><div><b>Đăng nhập để có tên trên bảng</b><p>Điểm tuần lấy từ tiến độ bạn đồng bộ.</p><a class="tk-pill tk-pill--gold" href="dang-nhap.html">Đăng nhập</a></div></div>`
      :my?`<div class="tk-climb"><div style="flex:1"><b>Bạn đang hạng #${my.rank} theo ${COLS[by][0].toLowerCase()} · ${fmt(my[by]||0)} ${COLS[by][1]}</b>
          <p>${ahead?`Cần thêm ${fmt(gap)} ${COLS[by][1]} để vượt ${escH(ahead.name)} (hạng #${ahead.rank}).`:'Bạn đang dẫn đầu tuần này.'}</p>
          <div class="tk-prog"><i style="width:${ahead?Math.min(100,Math.round((my[by]||0)/Math.max(1,ahead[by])*100)):100}%"></i></div></div></div>`
      :`<div class="tk-climb"><div><b>Chưa có điểm tuần này</b><p>Học một bài là có tên trên bảng.</p><a class="tk-pill tk-pill--gold" href="hoc-bai.html" data-go>Học ngay</a></div></div>`}
      ${top.length?`<div class="tk-podium">${order.map(r=>`<div class="tk-p tk-p--${r.rank}" style="min-height:${heights[r.rank]||200}px">
          <span class="rk">#${r.rank}${r.rank===1?' · VÔ ĐỊCH':''}</span><span class="av">${(r.name||'?')[0].toUpperCase()}</span>
          <b title="${escH(r.name)}">${escH(r.name)}${r.me?' (bạn)':''}</b><strong>${fmt(r[by]||0)}</strong><span class="tk-base" style="width:80%"></span></div>`).join('')}</div>`
      :`<div class="tk-empty">Tuần này chưa ai có điểm. Bạn có thể là người đầu tiên.</div>`}
    </section></div></div>`;
  app.querySelectorAll('[data-by]').forEach(b=>b.onclick=()=>{ by=b.dataset.by; render(); });
}
render();
</script>
<script src="assets/js/paper.js?v=5"></script>
</body>
</html>
