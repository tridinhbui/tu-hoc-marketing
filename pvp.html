<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23fff%27/%3E%3Ctext x=%2716%27 y=%2724%27 font-family=%27Georgia,serif%27 font-size=%2722%27 text-anchor=%27middle%27 fill=%27%230F1B2D%27%3EM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/case.css?v=12">
<title>Đấu trường — Tự Học Marketing Case</title>
<meta name="description" content="Đấu 5 câu với bóng ma của một người học thật. Cược xu nếu muốn.">
<link rel="stylesheet" href="assets/css/paper.css?v=4">
<style>
  .pv{max-width:900px;margin:0 auto;padding:clamp(8px,2vw,20px) 0 60px}
  .pv__vs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;margin:18px 0}
  .pv__who{border:1px solid rgba(36,22,14,.14);border-radius:18px;padding:16px 18px;background:rgba(255,255,255,.55);display:grid;gap:4px;text-align:center}
  .pv__av{width:56px;height:56px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font:800 22px var(--sans);color:#fff;background:var(--terra)}
  .pv__who b{font-size:1.05rem}.pv__who small{color:rgba(36,22,14,.6);font-size:13px}
  .pv__x{align-self:center;font:800 1.4rem var(--sans);color:var(--terra)}
  .pv__rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:6px 0 16px}
  .pv__rules div{border:1px solid rgba(36,22,14,.12);border-radius:14px;padding:10px 14px;font-size:13.5px;line-height:1.5}
  .pv__rules b{display:block}
  .pv__count{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(20,12,8,.78);color:#fff;font:800 clamp(4rem,14vw,9rem) var(--sans)}
  .pv__count[hidden]{display:none}
  .pv__count span{animation:pvPop .8s ease-out}
  @keyframes pvPop{0%{transform:scale(2.2);opacity:0}30%{opacity:1}100%{transform:scale(1)}}
  .pv__top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .pv__dots{display:flex;gap:6px}.pv__dots i{width:12px;height:12px;border-radius:50%;background:rgba(36,22,14,.14);display:block}
  .pv__dots i[data-s="on"]{background:var(--terra)}.pv__dots i[data-s="cur"]{outline:2px solid var(--terra);outline-offset:2px}
  .pv__nav{display:flex;gap:10px;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
  .pv__res{text-align:center;border-radius:20px;padding:18px;margin:12px 0}
  .pv__res b.big{display:block;font:600 clamp(2rem,6vw,3.2rem)/1.1 var(--serif)}
  .pv__res[data-o="win"]{background:rgba(61,122,69,.14)}.pv__res[data-o="draw"]{background:rgba(176,122,18,.16)}.pv__res[data-o="lose"]{background:rgba(192,57,43,.12)}
  @media(max-width:560px){.pv__vs{grid-template-columns:1fr}.pv__x{justify-self:center}}
  @media(prefers-reduced-motion:reduce){.pv__count span{animation:none}}
</style>
</head>
<body>
<noscript><div class="nojs"><h1 class="h2">Trang này cần JavaScript</h1></div></noscript>
<main class="wrap narrow" id="app"></main>
<script src="assets/js/data/lessons.js?v=8"></script>
<script src="assets/js/data/principles.js?v=8"></script>
<script src="assets/js/data/curriculum.js?v=4"></script>
<script src="assets/js/data/bai-index.js?v=11"></script>
<script src="assets/js/data/drills.js?v=3"></script>
<script src="assets/js/data/cases.js?v=5"></script>
<script src="assets/js/app.js?v=21"></script>
<script src="assets/js/quizkit.js?v=3"></script>
<script>

appShell('pvp.html');
const app=document.getElementById('app');
(async()=>{
  if(!await needLogin(app,'Đấu trường')) return;
  let d; try{ d=await api('/pvp'); }catch(e){ app.innerHTML=`<section class="section"><h1 class="h2">${e.message==='daily_limit'?'Hết lượt đấu hôm nay. Mai quay lại nhé.':'Chưa mở được trận.'}</h1></section>`; return; }
  const me=level(), n=d.items.length;
  const initial=s=>escH((String(s||'?').trim()[0]||'?').toUpperCase());
  app.innerHTML=`<div class="pv"><section class="section"><span class="mono mono--red">Đấu trường · còn ${d.left_today} trận hôm nay</span>
    <h1 class="h1" style="margin:12px 0 4px">Phòng chờ</h1>
    <p class="lede">${n} câu rút từ bài bạn đã học. Đúng nhiều hơn là thắng, bằng là hoà. Đối thủ là kết quả đã ghi của một người học, không chờ bạn thật.</p></section>
    <div class="pv__vs">
      <div class="pv__who"><span class="pv__av">${initial(me.name)}</span><b>Bạn</b><small>Cấp ${me.n} · ${escH(me.name)}</small></div>
      <div class="pv__x">VS</div>
      <div class="pv__who"><span class="pv__av" style="background:#3F7EA6">${initial(d.opponent)}</span><b>${escH(d.opponent)}</b>
        <small>${d.opponent_real?'Người học thật · kết quả 7 ngày qua':'Bóng ma luyện tập'} · ${d.opponent_correct}/${n} câu đúng</small></div></div>
    <div class="pv__rules"><div><b>Một câu mỗi lần</b>Chọn đáp án rồi sang câu kế, có thể quay lại sửa.</div>
      <div><b>Nộp một lần</b>Máy chủ chấm sau khi bạn nộp ở câu cuối.</div>
      <div><b>Cược xu (tuỳ chọn)</b>Từ ${d.bet_min} đến ${d.bet_max} xu; thắng được thêm, thua mất phần cược.</div></div>
    <label class="row" id="betRow" style="gap:10px"><span class="mono">Cược xu (0 = không cược) · đang có ${fmt(d.coins)} xu</span>
      <input class="field" id="bet" inputmode="numeric" value="0" style="max-width:120px"></label>
    <p style="margin-top:18px"><button class="btn" id="enter">Vào đấu</button></p>
    <section id="arena" hidden>
      <div class="pv__top"><span class="mono" id="no"></span><span class="pv__dots" id="dots"></span></div>
      <div id="qs"></div>
      <div class="pv__nav"><button type="button" class="btn btn--ghost" id="prev">← Câu trước</button>
        <span><button type="button" class="btn btn--ghost" id="next">Câu sau →</button><button class="btn" id="go" hidden>Nộp bài</button></span></div></section>
    <div class="pv__count" id="count" hidden aria-live="assertive"><span id="cn"></span></div></div>`;
  const box=document.getElementById('qs'); QK.render(box,d.items);
  const dots=document.getElementById('dots'); dots.innerHTML=d.items.map(()=>'<i></i>').join('');
  const paint=(i,c)=>{ const a=QK.answers(box), ids=d.items.map(x=>x.id);
    document.getElementById('no').textContent=`Câu ${i+1} / ${c} · đã trả lời ${Object.keys(a).length}`;
    [...dots.children].forEach((el,k)=>el.dataset.s=k===i?'cur':(ids[k] in a?'on':''));
    document.getElementById('prev').disabled=i===0; document.getElementById('next').hidden=i===c-1; document.getElementById('go').hidden=i!==c-1; };
  const st=QK.stepper(box,paint); paint(0,st.count);
  box.addEventListener('click',()=>setTimeout(()=>paint(st.index,st.count),0));
  document.getElementById('prev').onclick=()=>st.prev(); document.getElementById('next').onclick=()=>st.next();
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.getElementById('enter').onclick=async()=>{
    document.getElementById('enter').parentElement.hidden=true; document.getElementById('betRow').hidden=true;
    document.querySelectorAll('.pv__vs,.pv__rules').forEach(x=>x.hidden=true);
    const cd=document.getElementById('count'), cn=document.getElementById('cn'); cd.hidden=false;
    for(const x of reduce?['Bắt đầu!']:['3','2','1','Bắt đầu!']){ cn.textContent=x; cn.style.animation='none'; void cn.offsetWidth; cn.style.animation=''; await new Promise(r=>setTimeout(r,reduce?500:750)); }
    cd.hidden=true; document.getElementById('arena').hidden=false;
  };
  document.getElementById('go').onclick=async()=>{
    const bet=Math.trunc(Number(document.getElementById('bet').value)||0);
    try{ const r=await api('/pvp',{method:'POST',body:{duel_id:d.duel_id,answers:QK.answers(box),bet}});
      st.all(); QK.mark(box,r.detail);
      ['go','next','prev'].forEach(id=>document.getElementById(id).hidden=true); document.querySelector('.pv__top').hidden=true;
      const w={win:'Thắng',draw:'Hoà',lose:'Thua'}[r.outcome];
      box.insertAdjacentHTML('beforebegin',`<div class="pv__res" data-o="${r.outcome}"><b class="big">${w} ${r.correct} – ${r.opponent_correct}</b>
        +${r.xp} XP${r.coins_delta?` · ${r.coins_delta>0?'+':''}${r.coins_delta} xu`:''}. Còn ${fmt(r.coins)} xu.
        <p style="margin:10px 0 0"><a class="btn" href="pvp.html">Trận mới</a> <a class="btn btn--ghost" href="kingdom.html">← Về bản đồ vương quốc</a></p></div>`);
      window.scrollTo({top:0,behavior:'smooth'});
    }catch(e){ toast({bad_bet:`Cược từ ${d.bet_min} đến ${d.bet_max} xu`,not_enough_coins:'Không đủ xu để cược',already_submitted:'Trận này đã nộp'}[e.message]||'Chưa gửi được'); }
  };
})();

</script>
<script src="assets/js/paper.js?v=5"></script>
</body>
</html>
