<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="assets/img/favicon-32.png">
<link rel="stylesheet" href="assets/css/case.css?v=21f6">
<title>World Boss — Tự Học Marketing Case</title>
<meta name="description" content="Cả server cùng hạ một boss mỗi tuần. 15 câu rút từ bài bạn đã học, chấm ở máy chủ.">
<link rel="stylesheet" href="assets/css/paper.css?v=12">
<link rel="stylesheet" href="assets/css/atelier.css?v=27z1">
<style>
  #app{max-width:1140px;margin:0 auto}
  .bs{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start;padding:clamp(8px,2vw,20px) 0 60px}
  .bs__main,.bs__side{min-width:0}
  .bs__hp{margin-top:20px}
  .bs__hpn{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .bs__hpn b{font:600 clamp(2rem,4vw,3rem)/1 var(--serif);color:var(--ink-dark,#24160E)}
  .bs__hpn span{color:var(--ink-dark-50,rgba(36,22,14,.5));font-weight:600}.bs__hpn small{margin-left:auto;font-weight:800;color:var(--terra)}
  .bs__bar{height:16px;border-radius:99px;background:rgba(36,22,14,.1);overflow:hidden;margin-top:12px}
  .bs__bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#B8452E,#E0562A)}
  .bs__meta{margin:10px 0 0;font-size:13px;color:rgba(36,22,14,.6)}
  .bs__h{font:800 11.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;margin:0 0 12px;color:var(--terra)}
  .bs__top{list-style:none;margin:0;padding:0;display:grid;gap:10px}
  .bs__top li{display:flex;gap:10px;align-items:center}.bs__top b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .bs__top em{font-style:normal;font-weight:800;color:var(--terra)}
  .bs__rk{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:rgba(36,22,14,.07);font:800 12px var(--sans)}
  .bs__top li:first-child .bs__rk{background:#f6dd91}
  .bs__tip{font-size:13.5px;line-height:1.6;color:rgba(36,22,14,.72);margin:0 0 10px}
  .bs__fight{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:18px}
  .bs__boss{position:relative;width:120px;flex:none}
  .bs__boss svg{width:100%;display:block;transition:filter .2s}
  .bs__boss.hit svg{animation:bsShake .5s}
  .bs__boss.dead svg{filter:grayscale(1) opacity(.5)}
  @keyframes bsShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-4deg)}40%{transform:translateX(9px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
  .bs__dmg{position:absolute;left:50%;top:0;font:800 1.6rem var(--sans);color:#B8452E;opacity:0;pointer-events:none}
  .bs__boss.hit .bs__dmg{animation:bsFloat 1.2s ease-out}
  @keyframes bsFloat{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-60px)}}
  .bs__bar i{transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
  .bt{border:1px solid rgba(36,22,14,.14);border-radius:18px;padding:16px 18px;background:rgba(255,255,255,.55)}
  .bt__top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .bt__dots{display:flex;gap:5px;flex-wrap:wrap}
  .bt__dots i{width:10px;height:10px;border-radius:50%;background:rgba(36,22,14,.14);display:block}
  .bt__dots i[data-s="on"]{background:var(--terra)}.bt__dots i[data-s="cur"]{outline:2px solid var(--terra);outline-offset:2px}
  .bt__nav{display:flex;gap:10px;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
  @media(prefers-reduced-motion:reduce){.bs__boss.hit svg,.bs__boss.hit .bs__dmg{animation:none}.bs__bar i{transition:none}}
  @media(max-width:920px){.bs{grid-template-columns:1fr}}
</style>
</head>
<body>
<noscript><div class="nojs"><h1 class="h2">Trang này cần JavaScript</h1></div></noscript>
<main class="wrap" id="app"></main>
<script src="assets/js/data/lessons.js?v=8"></script>
<script src="assets/js/data/principles.js?v=8"></script>
<script src="assets/js/data/curriculum.js?v=4"></script>
<script src="assets/js/data/bai-index.js?v=11"></script>
<script src="assets/js/data/drills.js?v=3"></script>
<script src="assets/js/data/cases.js?v=7"></script>
<script src="assets/js/app.js?v=21"></script>
<script src="assets/js/quizkit.js?v=3"></script>
<script>

appShell('boss.html');
const app=document.getElementById('app');
(async()=>{
  let d; try{ d=await api('/boss'); }catch(e){ await needLogin(app,'World Boss'); return; }
  const pct=d.max_hp?Math.round(d.hp/d.max_hp*100):0;
  const wk=new Date(d.week+'T00:00:00'), left=Math.max(0,Math.ceil((wk.getTime()+7*864e5-Date.now())/864e5));
  const top=d.top.length?`<ol class="bs__top">${d.top.map((t,i)=>`<li><span class="bs__rk">${i+1}</span><b>${escH(t.name)}</b><em>${fmt(t.damage)}</em></li>`).join('')}</ol>`:'<p class="muted" style="margin:0">Chưa ai ra đòn tuần này. Bạn có thể là người đầu tiên.</p>';
  const u=await account();
  app.innerHTML=`<div class="bs"><div class="bs__main">
    <section class="section bs__hero"><span class="mono mono--red">World Boss · tuần bắt đầu ${wk.toLocaleDateString('vi-VN')}</span>
      <h1 class="h1" style="margin:12px 0 10px">Boss <em>Chi Phí Ẩn</em></h1>
      <p class="lede">Cả server cùng đánh một boss. Mỗi người một lượt mỗi tuần: 15 câu rút từ bài bạn đã học, đề cố định trong tuần — tải lại không đổi đề. Máy chủ chấm và tính sát thương.</p>
<div class="bs__fight"><div class="bs__boss" id="boss" aria-hidden="true"><span class="bs__dmg" id="dmg"></span>
        <svg viewBox="0 0 120 120"><ellipse cx="60" cy="108" rx="34" ry="7" fill="#000" opacity=".15"/>
          <path d="M18 70C18 38 36 16 60 16s42 22 42 54c0 22-14 36-42 36S18 92 18 70Z" fill="#8F3F32"/>
          <path d="M30 28l-10-14 20 8M90 28l10-14-20 8" fill="#8F3F32" stroke="#8F3F32" stroke-width="4" stroke-linejoin="round"/>
          <circle cx="44" cy="58" r="9" fill="#fff"/><circle cx="76" cy="58" r="9" fill="#fff"/><circle cx="46" cy="60" r="4" fill="#24160E"/><circle cx="74" cy="60" r="4" fill="#24160E"/>
          <path d="M34 48l20 6M86 48l-20 6" stroke="#24160E" stroke-width="4" stroke-linecap="round"/>
          <path d="M42 84q18 12 36 0" fill="none" stroke="#24160E" stroke-width="4" stroke-linecap="round"/>
          <text x="60" y="100" text-anchor="middle" font-size="12" font-weight="800" fill="#F6DD91">$ ?</text></svg></div>
      <div style="flex:1;min-width:220px">
      <div class="bs__hp" style="margin-top:0"><div class="bs__hpn"><b id="hpn">${fmt(d.hp)}</b><span>/ ${fmt(d.max_hp)} máu</span><small id="hpp">${pct}%</small></div>
        <div class="bs__bar"><i id="hpbar" style="width:${pct}%"></i></div>
        <p class="bs__meta">Mỗi câu đúng ${fmt(d.damage_per_correct)} sát thương · boss đổi sau ${left} ngày</p></div></div></div>
    </section>
    <section class="section" id="raid"></section>
  </div>
  <aside class="bs__side">
    <section class="section"><h3 class="bs__h">Top sát thương tuần này</h3>${top}</section>
    <section class="section"><h3 class="bs__h">Cách tính</h3>
      <p class="bs__tip">Mỗi câu đúng gây ${fmt(d.damage_per_correct)} sát thương. Câu tính số và câu đoán trước đều tính như nhau; không có điểm phạt khi sai.</p>
      <p class="bs__tip">Đủ 8 bài đã học thì đề lấy từ chính những bài đó; chưa đủ thì dùng kho câu của chặng 1.</p></section>
  </aside></div>`;
  const raid=document.getElementById('raid');
  if(!u){ raid.innerHTML=`<p class="note"><a href="tai-khoan.html?next=boss.html">Đăng nhập</a> để ra đòn.</p>`; return; }
  if(d.done){ raid.innerHTML=`<p class="note">Bạn đã ra đòn tuần này: đúng ${d.mine.correct} câu · ${fmt(d.mine.damage)} sát thương · +${d.mine.xp} XP · +${d.mine.coins} xu. Tuần sau có boss mới.</p>`; return; }
  raid.innerHTML=`${d.fixed_pool?'<p class="note">Bạn chưa học đủ 8 bài nên đề lấy từ kho câu cố định của chặng 1.</p>':''}
    <div id="intro" class="bt"><b style="font-size:1.1rem">Sẵn sàng ra đòn?</b>
      <p class="bs__tip" style="margin:6px 0 12px">${d.items.length} câu, mỗi lần một câu. Chọn đáp án rồi sang câu kế; chỉ khi bấm “Ra đòn” ở câu cuối mới gửi lên máy chủ chấm. Mỗi người một lượt mỗi tuần.</p>
      <button class="btn" id="start">Bắt đầu trận đánh</button></div>
    <div id="battle" class="bt" hidden>
      <div class="bt__top"><span class="mono" id="btNo"></span><span class="bt__dots" id="dots"></span></div>
      <div id="qs"></div>
      <div class="bt__nav"><button type="button" class="btn btn--ghost" id="prev">← Câu trước</button>
        <span><button type="button" class="btn btn--ghost" id="next">Câu sau →</button><button class="btn" id="go" hidden>Ra đòn</button></span></div></div>`;
  const box=document.getElementById('qs'); QK.render(box,d.items);
  const dots=document.getElementById('dots'); dots.innerHTML=d.items.map(()=>'<i></i>').join('');
  const paint=(i,n)=>{ const a=QK.answers(box), ids=d.items.map(x=>x.id);
    document.getElementById('btNo').textContent=`Đòn ${i+1} / ${n} · đã trả lời ${Object.keys(a).length}`;
    [...dots.children].forEach((el,k)=>el.dataset.s=k===i?'cur':(ids[k] in a?'on':''));
    document.getElementById('prev').disabled=i===0;
    document.getElementById('next').hidden=i===n-1; document.getElementById('go').hidden=i!==n-1; };
  const st=QK.stepper(box,paint);
  document.getElementById('start').onclick=()=>{ document.getElementById('intro').hidden=true; document.getElementById('battle').hidden=false; paint(0,st.count); };
  document.getElementById('prev').onclick=()=>st.prev(); document.getElementById('next').onclick=()=>st.next();
  box.addEventListener('click',()=>setTimeout(()=>paint(st.index,st.count),0));
  document.getElementById('go').onclick=async()=>{
    const a=QK.answers(box); if(Object.keys(a).length<d.items.length&&!confirm(`Còn ${d.items.length-Object.keys(a).length} câu chưa trả lời. Ra đòn luôn?`)) return;
    try{ const r=await api('/boss',{method:'POST',body:{answers:a}});
      st.all(); QK.mark(box,r.detail);
      ['go','next','prev'].forEach(id=>document.getElementById(id).hidden=true); document.querySelector('.bt__top').hidden=true;
      /* hoạt ảnh trừ máu: số mới = máu cũ trừ sát thương của bạn */
      const nh=Math.max(0,d.hp-r.damage), np=d.max_hp?Math.round(nh/d.max_hp*100):0, boss=document.getElementById('boss');
      document.getElementById('dmg').textContent='−'+fmt(r.damage); boss.classList.add('hit'); if(!nh) boss.classList.add('dead');
      requestAnimationFrame(()=>{ document.getElementById('hpbar').style.width=np+'%'; });
      document.getElementById('hpn').textContent=fmt(nh); document.getElementById('hpp').textContent=np+'%';
      window.scrollTo({top:0,behavior:'smooth'});
      box.insertAdjacentHTML('beforebegin',`<p class="note" style="margin-bottom:12px"><b>${r.correct}/${r.total} câu đúng · ${fmt(r.damage)} sát thương</b> · +${r.xp} XP · +${r.coins} xu${r.booster>1?' (booster ×'+r.booster+')':''}. Xem lời giải từng câu bên dưới.</p>`);
      toast(`+${r.xp} XP · +${r.coins} xu`); }catch(e){ toast(e.message==='already_submitted'?'Bạn đã ra đòn tuần này.':'Chưa gửi được'); }
  };
})();

</script>
<script src="assets/js/paper.js?v=7"></script>
</body>
</html>
