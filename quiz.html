<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23C85A32%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-family=%27Georgia,serif%27 font-size=%2720%27 text-anchor=%27middle%27 fill=%27%23FAF3E7%27%3EM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/case.css?v=13">
<title>Phòng thử thách — Tự Học Marketing Case</title>
<meta name="description" content="Phòng thử thách: rút ngẫu nhiên các tình huống marketing, chọn hướng đi, đọc lý do từng phương án. Làm lại bao nhiêu lần cũng được.">
<style>
  .rm{max-width:980px;margin:0 auto;padding:clamp(20px,4vw,44px) clamp(16px,3vw,32px) 80px}
  .rm__eyebrow{font:700 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--terra)}
  .rm h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.1rem,4.6vw,3.4rem);line-height:1.05;letter-spacing:-.02em;margin:10px 0 12px}
  .rm h1 em{color:var(--terra)}
  .rm__lede{max-width:56ch;color:var(--ink-70);line-height:1.6;margin:0 0 22px}
  .rm__stats{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 22px}
  .rm__stat{background:var(--paper-card);color:var(--ink-dark);border:1px solid var(--ink-12);border-radius:14px;padding:12px 16px;min-width:120px}
  .rm__stat b{display:block;font-family:var(--serif);font-size:1.6rem;font-weight:500;line-height:1.1}
  .rm__stat span{font-size:12px;color:var(--ink-dark-50)}
  .rm__topics{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
  .rm__topics button{border:1px solid var(--ink-12);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font:600 13px var(--sans);cursor:pointer}
  .rm__topics button[aria-pressed="true"]{background:var(--terra);border-color:var(--terra);color:#fff}
  .rm__go{border:0;background:var(--terra);color:#fff;border-radius:999px;padding:13px 28px;font:700 15px var(--sans);cursor:pointer}
  .rm__go:disabled{opacity:.45;cursor:not-allowed}
  .rm__go--ghost{background:transparent;color:var(--ink);border:1px solid var(--ink-30)}
  .rm__bar{display:flex;align-items:center;gap:12px;margin:0 0 18px;font:600 13px var(--sans);color:var(--ink-70)}
  .rm__bar i{flex:1;height:6px;border-radius:99px;background:var(--ink-12);overflow:hidden}
  .rm__bar i u{display:block;height:100%;background:var(--terra);width:0;transition:width .3s}
  .rm__card{background:var(--paper-card);color:var(--ink-dark);border-radius:20px;padding:clamp(18px,3vw,32px);box-shadow:0 18px 40px -22px rgba(0,0,0,.35)}
  .rm__kind{display:inline-block;font:700 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--terra);background:var(--terra-06);padding:6px 10px;border-radius:999px}
  .rm__brief{font-size:15.5px;line-height:1.65;color:var(--ink-dark-70);margin:14px 0 6px}
  .rm__q{font-family:var(--serif);font-size:clamp(1.3rem,2.4vw,1.75rem);line-height:1.25;margin:0 0 18px}
  .rm__opts{display:grid;gap:10px}
  .rm__opt{display:block;width:100%;text-align:left;border:1.5px solid rgba(36,22,14,.15);background:#fff;color:var(--ink-dark);border-radius:14px;padding:14px 16px;cursor:pointer;font:500 15px/1.5 var(--sans);transition:border-color .15s,background .15s}
  .rm__opt b{font-weight:700;color:var(--terra);margin-right:8px}
  .rm__opt:hover:not([disabled]){border-color:var(--terra)}
  .rm__opt[aria-pressed="true"]{border-color:var(--terra);background:rgba(200,90,50,.08)}
  .rm__opt[data-s="right"]{border-color:#3d8a4f;background:#e8f3ea}
  .rm__opt[data-s="wrong"]{border-color:#c0392b;background:#fbeae7}
  .rm__opt[disabled]{cursor:default}
  .rm__why{margin:10px 2px 0;font-size:14px;line-height:1.6;color:var(--ink-dark-70)}
  .rm__why strong{color:#2f7a42}
  .rm__act{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;align-items:center}
  .rm__res{text-align:center;padding:12px 0}
  .rm__res b{font-family:var(--serif);font-size:3.2rem;font-weight:400;display:block;line-height:1}
  .rm__hist{margin-top:34px}
  .rm__hist h2{font:700 12px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-50);margin:0 0 10px}
  .rm__hist ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .rm__hist li{display:flex;gap:10px;align-items:center;font-size:14px;padding:10px 12px;border:1px solid var(--ink-12);border-radius:12px}
  .rm__hist li span{margin-left:auto;font-size:12px;color:var(--ink-50)}
  .rm__dot{width:10px;height:10px;border-radius:50%;flex:none}
</style>
</head>
<body>
<noscript><div class="nojs"><h1 class="h2">Trang này cần JavaScript</h1></div></noscript>
<main class="rm" id="app"></main>
<script src="assets/js/data/lessons.js?v=8"></script>
<script src="assets/js/data/principles.js?v=8"></script>
<script src="assets/js/data/curriculum.js?v=4"></script>
<script src="assets/js/data/bai-index.js?v=11"></script>
<script src="assets/js/data/drills.js?v=3"></script>
<script src="assets/js/data/cases.js?v=4"></script>
<script src="assets/js/data/challenges.js?v=8"></script>
<script src="assets/js/app.js?v=21"></script>
<script>
appShell('quiz.html');
const app = document.getElementById('app');
const TOPIC = { creative: 'Sáng tạo', brand: 'Thương hiệu', consumer: 'Khách hàng', growth: 'Tăng trưởng', strategy: 'Chiến lược' };
const ROUND = 5, LABEL = 'ABCD';
/* Tình huống cà phê (trang cũ) — giữ lại làm một thử thách trong ngân hàng. */
const POOL = [...CHALLENGES, {
  id: 'ch-coffee', kind: 'Tăng nhận biết cho thương hiệu mới', d: 'brand',
  brief: 'Một thương hiệu cà phê Việt cao cấp sắp ra mắt, hướng đến giới trẻ thành thị. Ngân sách hạn chế, phải khác biệt với các chuỗi lớn.',
  q: 'Bạn dồn nguồn lực vào hướng nào trước?',
  opts: [
    { t: 'Đầu tư vào hương vị độc đáo và trải nghiệm tại quầy', why: 'Sản phẩm tốt là điều kiện cần, nhưng khó thấy được từ bên ngoài. Với ngân sách nhỏ, khách mới không có cách nào biết bạn ngon hơn trước khi thử.' },
    { t: 'Xây câu chuyện lối sống quanh người trẻ thành thị và một dịp dùng cụ thể', why: 'Đúng. Nó cho khách một lý do để chọn bạn mà không cần so giá, tạo tài sản nhận diện riêng và bảo vệ biên lợi nhuận khi chuỗi lớn giảm giá.', ok: true },
    { t: 'Thuê KOL/KOC phủ nhanh trong tháng đầu', why: 'Kéo lượt thử rất nhanh nhưng khách rời đi khi voucher hết, vì họ chưa biết thương hiệu đứng cho điều gì. Dùng KOL sau khi đã có ý tưởng, không phải thay cho ý tưởng.' }]
}];
const roomFlags = () => (S.get().flags || {});
const rec = (id) => roomFlags()['room:' + id];
let topic = 'all', run = null;

function roomStats() {
  const done = POOL.filter((c) => rec(c.id));
  const firstOk = done.filter((c) => rec(c.id).first).length;
  return { done: done.length, total: POOL.length, firstOk, tries: done.reduce((n, c) => n + rec(c.id).n, 0) };
}
function roomDraw() {
  const pool = POOL.filter((c) => topic === 'all' || c.d === topic);
  /* chưa làm trước, rồi tới cái làm sai gần nhất, rồi cái cũ nhất */
  const score = (c) => { const r = rec(c.id); return !r ? 0 : !r.ok ? 1 : 2; };
  return shuffle(pool).sort((a, b) => score(a) - score(b) || (rec(a.id)?.t || 0) - (rec(b.id)?.t || 0)).slice(0, ROUND);
}
function home() {
  run = null;
  const st = roomStats();
  const poolN = POOL.filter((c) => topic === 'all' || c.d === topic).length;
  app.innerHTML = `
    <span class="rm__eyebrow">Phòng thử thách</span>
    <h1>Chọn hướng đi. <em>Rồi đọc vì sao.</em></h1>
    <p class="rm__lede">Mỗi lượt rút ${ROUND} tình huống từ ngân hàng ${POOL.length} thử thách, ưu tiên cái bạn chưa làm hoặc từng làm sai. Không có điểm thi; phần có giá trị nằm ở lý do của từng phương án.</p>
    <div class="rm__stats">
      <div class="rm__stat"><b>${st.done}/${st.total}</b><span>thử thách đã làm</span></div>
      <div class="rm__stat"><b>${st.firstOk}</b><span>đúng ngay lần đầu</span></div>
      <div class="rm__stat"><b>${st.tries}</b><span>lượt chọn</span></div>
    </div>
    <div class="rm__topics" role="group" aria-label="Chủ đề">
      ${['all', ...Object.keys(TOPIC)].map((k) => `<button type="button" data-t="${k}" aria-pressed="${topic === k}">${k === 'all' ? 'Tất cả' : TOPIC[k]}</button>`).join('')}
    </div>
    <button class="rm__go" id="go" ${poolN ? '' : 'disabled'}>Bắt đầu lượt ${Math.min(ROUND, poolN)} thử thách →</button>
    ${histHtml()}`;
  app.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => { topic = b.dataset.t; home(); });
  document.getElementById('go').onclick = start;
}
function histHtml() {
  const items = POOL.filter((c) => rec(c.id)).sort((a, b) => rec(b.id).t - rec(a.id).t).slice(0, 8);
  if (!items.length) return '';
  return `<section class="rm__hist"><h2>Gần đây</h2><ul>${items.map((c) => {
    const r = rec(c.id);
    return `<li><i class="rm__dot" style="background:${r.ok ? '#3d8a4f' : '#c0392b'}"></i>${escH(c.kind)}<span>${TOPIC[c.d] || ''} · ${r.n} lượt</span></li>`;
  }).join('')}</ul></section>`;
}
function start() {
  const list = roomDraw();
  run = { list, i: 0, ok: 0, xp: 0, picked: null, shown: false };
  step();
}
function step() {
  const c = run.list[run.i];
  const order = shuffle(c.opts.map((o, k) => k));
  run.order = order;
  app.innerHTML = `
    <div class="rm__bar"><span>Thử thách ${run.i + 1}/${run.list.length}</span><i><u style="width:${(run.i / run.list.length) * 100}%"></u></i><span>${run.ok} đúng</span></div>
    <article class="rm__card">
      <span class="rm__kind">${escH(TOPIC[c.d] || c.d)} · ${escH(c.kind)}</span>
      <p class="rm__brief">${escH(c.brief)}</p>
      <h2 class="rm__q">${escH(c.q)}</h2>
      <div class="rm__opts" id="opts">${order.map((k, n) => `<button type="button" class="rm__opt" data-k="${k}" aria-pressed="false"><b>${LABEL[n]}</b>${escH(c.opts[k].t)}</button>`).join('')}</div>
      <div class="rm__act"><button class="rm__go" id="ok" disabled>Chốt lựa chọn</button><button class="rm__go rm__go--ghost" id="quit">Thoát</button></div>
    </article>`;
  run.picked = null;
  const opts = [...app.querySelectorAll('.rm__opt')];
  opts.forEach((b) => b.onclick = () => {
    if (run.shown) return;
    run.picked = +b.dataset.k;
    opts.forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    document.getElementById('ok').disabled = false;
  });
  document.getElementById('ok').onclick = reveal;
  document.getElementById('quit').onclick = home;
}
function reveal() {
  if (run.picked == null || run.shown) return;
  run.shown = true;
  const c = run.list[run.i], right = c.opts.findIndex((o) => o.ok), got = run.picked === right;
  const prev = rec(c.id);
  if (got) run.ok++;
  const s = S.get();
  S.set({ flags: { ...(s.flags || {}), ['room:' + c.id]: { n: (prev?.n || 0) + 1, ok: got, first: prev ? prev.first : got, t: Date.now() } } });
  award('quiz', 'room:' + c.id);
  run.xp += award.last || 0;
  document.querySelectorAll('.rm__opt').forEach((b) => {
    const k = +b.dataset.k;
    b.disabled = true;
    b.dataset.s = k === right ? 'right' : k === run.picked ? 'wrong' : '';
    b.insertAdjacentHTML('afterend', `<p class="rm__why">${k === right ? '<strong>Hướng mạnh nhất. </strong>' : k === run.picked ? '<strong style="color:#b03a2e">Bạn chọn cái này. </strong>' : ''}${escH(c.opts[k].why)}</p>`);
  });
  const last = run.i === run.list.length - 1;
  const act = document.querySelector('.rm__act');
  act.innerHTML = `<button class="rm__go" id="next">${last ? 'Xem kết quả →' : 'Thử thách kế →'}</button>`;
  document.getElementById('next').onclick = () => { if (last) finish(); else { run.i++; run.shown = false; step(); } };
}
function finish() {
  const n = run.list.length;
  app.innerHTML = `<article class="rm__card"><div class="rm__res">
      <span class="rm__eyebrow">Kết thúc lượt</span>
      <b>${run.ok}/${n}</b>
      <p class="rm__lede" style="margin:12px auto 0">${run.ok === n ? 'Trọn vẹn. Thử chủ đề khác để đổi góc nhìn.' : run.ok >= n / 2 ? 'Khá. Những cái sai sẽ được rút lại ở lượt sau.' : 'Chưa sao: đọc lại phần “vì sao” của các phương án trượt — đó mới là bài học.'}${run.xp ? ` +${run.xp} XP.` : ''}</p>
    </div>
    <div class="rm__act" style="justify-content:center"><button class="rm__go" id="again">Lượt mới</button><button class="rm__go rm__go--ghost" id="home">Về phòng thử thách</button></div></article>`;
  document.getElementById('again').onclick = start;
  document.getElementById('home').onclick = home;
}
home();
</script>
</body>
</html>
